# Question bank: behavioural
topic = "behavioural"

[[q]]
id = "be-001"
qtype = "recall"
subtopic = "strategy"
levels = ["graduate", "mid", "senior"]
q = "What does the strategy pattern replace, and what does it cost the reader?"
a = "A switch on a type code, replaced by polymorphism, so adding a case adds a class rather than editing an existing method. The cost is that the behaviour is no longer visible at the call site - you have to know how it was wired to know what runs."

[[q]]
id = "be-002"
qtype = "judgment"
subtopic = "strategy"
levels = ["mid", "senior", "lead", "staff"]
q = "You are defining an interface with one method plus three implementing classes for a sorting rule. New information - the language has first-class functions. More or less appropriate?"
a = "Less, -1 to -2. A one-method interface is a function wearing a costume, and the costume costs four files. Pass the comparison function directly. Reach for the interface when there is genuine state, more than one method, or when the implementations need names for a registry."

[[q]]
id = "be-003"
qtype = "discrimination"
subtopic = "strategy"
levels = ["mid", "senior", "lead", "staff"]
q = "Strategy and state have the same structure. What tells them apart?"
a = "Who decides the next behaviour. A strategy is chosen by the caller and does not change itself. A state transitions ITSELF in response to events. If the object decides what it becomes next, it is state; if something outside picks, it is strategy."

[[q]]
id = "be-004"
qtype = "recall"
subtopic = "observer"
levels = ["graduate", "mid", "senior"]
q = "What does the observer pattern buy, and name two costs."
a = "The subject notifies interested parties without knowing who they are, so new listeners are added without touching it. Costs - control flow becomes invisible, since reading the publisher tells you nothing about what happens next; and ordering is usually unspecified, so code that quietly depends on it is fragile."

[[q]]
id = "be-005"
qtype = "diagnostic"
subtopic = "observer"
levels = ["mid", "senior", "lead", "staff"]
q = "A long-running application slowly grows in memory. Objects that should have been discarded are still reachable, and the profiler shows they are held by an event source. What is it?"
a = "Observers that never unsubscribe. The subject holds a reference to every listener, so a listener that should have died is kept alive - and keeps being called. It is one of the most common leaks in long-lived applications, and the fix is explicit unsubscription tied to the listener's lifecycle, or weak references."

[[q]]
id = "be-006"
qtype = "judgment"
subtopic = "observer"
levels = ["senior", "lead", "staff"]
q = "You are making order-placed notify five synchronous in-process observers. New information - one of them calls an external email provider. More or less appropriate?"
a = "Less, -2. A synchronous observer makes the publisher wait for every subscriber, so a slow third party is now in your order write path, and an exception there can break the notification loop for the others. Publish an event and let a separate consumer do the email."

[[q]]
id = "be-007"
qtype = "recall"
subtopic = "template-method"
levels = ["mid", "senior", "lead", "staff"]
q = "What is the weakness of template method, and what is usually preferred?"
a = "It uses inheritance, so you get one axis of variation, tight coupling to the base class's internals, and a subclass that must know which hooks are called when. Composition is usually preferred - pass in strategies for the varying steps rather than subclassing."

[[q]]
id = "be-008"
qtype = "diagnostic"
subtopic = "template-method"
levels = ["senior", "lead", "staff"]
q = "A base class has fifteen hooks, six of which are optional, and subclasses override wildly different subsets. What does that tell you?"
a = "The sequence is not actually fixed, so the premise of template method does not hold. The variation is broader than the pattern can express, and it is now a base class that different subclasses use in incompatible ways. Move to composition, or split into separate flows that share nothing."

[[q]]
id = "be-009"
qtype = "recall"
subtopic = "state"
levels = ["mid", "senior", "lead", "staff"]
q = "What does the state pattern replace, and why is that a correctness improvement rather than a tidiness one?"
a = "A switch on this.status repeated in eight methods. It is a correctness improvement because adding a state means finding all eight, and every one you miss is a silent bug. With state objects the compiler makes you implement the interface, and illegal transitions can be refused in one place rather than allowed by omission."

[[q]]
id = "be-010"
qtype = "judgment"
subtopic = "state"
levels = ["mid", "senior", "lead", "staff"]
q = "You are introducing the state pattern for an object with two states, on and off. More or less appropriate?"
a = "Less, -2. Two states and no transition rules is a boolean. The pattern earns its cost around four or five states, or as soon as transitions have rules worth enforcing in one place."

[[q]]
id = "be-011"
qtype = "recall"
subtopic = "command"
levels = ["mid", "senior", "lead", "staff"]
q = "What does turning a request into an object make possible?"
a = "Queuing and deferred execution, retry without reconstructing the request, an audit log of intent rather than of effect, and undo where each command knows its inverse. A job in a work queue is this pattern, and so is an event-sourced write."

[[q]]
id = "be-012"
qtype = "judgment"
subtopic = "command"
levels = ["mid", "senior", "lead", "staff"]
q = "You are wrapping every service call in a command object for consistency. More or less appropriate?"
a = "Less, -2 without a reason. The pattern costs a class per operation and earns it only if you need at least one of storage, deferral, audit or undo. If you only ever call the thing immediately, call it."

[[q]]
id = "be-013"
qtype = "discrimination"
subtopic = "state"
levels = ["graduate", "mid"]
q = "Two designs replace a conditional with a set of interchangeable objects behind one interface. In the first the caller chooses which object to use; in the second the objects decide what replaces them. What separates them, and why is the second not just the first with more steps?"
a = "Who owns the transition. In the first the caller picks an interchangeable algorithm and the object has no opinion about what comes next - swapping a pricing rule does not imply a following rule. In the second each object represents a situation the system is in and knows which situations may follow, so the set encodes a machine with legal transitions. That is the substance: the second enforces that an order cannot go from delivered back to pending, which a set of interchangeable algorithms has no way to express."

[[q]]
id = "be-014"
qtype = "judgment"
subtopic = "template-method"
levels = ["graduate", "mid"]
q = "Several jobs share a fixed sequence of steps and differ in two of them, so a base class fixes the sequence and leaves those two for subclasses to fill in. New information: one new job needs the same steps in a different order. Does the base class remain the right shape?"
a = "Less appropriate, around -1 to -2. Fixing the sequence in a base class is exactly what the shape is for, and its cost is that the order is the one thing a subclass cannot vary, so a job needing a different order either subverts the structure with flags or reimplements it. If the odd job is genuinely an exception, keeping the base class and writing that one separately is honest. If order is going to vary generally, the sequence belongs in a composed pipeline where the steps are objects and the order is data, and inheritance was fixing the wrong thing."

[[q]]
id = "be-015"
qtype = "diagnostic"
subtopic = "command"
levels = ["graduate", "mid"]
q = "A user action is recorded as an object and put on a queue for a worker to carry out later. After a deployment, a batch of the queued items fails to run, and the ones that fail are all older than the deployment. Most likely cause?"
a = "The recorded objects no longer match what the code expects to read: a field was renamed, removed or given a new required value, so items serialised before the change cannot be reconstructed after it. Turning an action into a stored object means its shape becomes a persisted format with the compatibility obligations of one, and the deployment is the moment old and new meet. Handle it the way any format migration is handled - version the payload, keep readers tolerant of missing fields, and drain or migrate the backlog before removing support."

[[q]]
id = "be-016"
qtype = "recall"
subtopic = "command"
levels = ["graduate", "mid"]
q = "An application lets a user reverse any action they have taken, and each action is already stored as an object. Two ways to build the reversal are open to you. What are they, and what decides between them?"
a = "Either each stored action knows how to reverse itself, or the system snapshots state before the action and restores the snapshot. What decides is whether actions are small and cleanly reversible, in which case an inverse per action is cheap and composes across a stack of them, or large and lossy, in which case reconstructing the inverse is guesswork and a snapshot is the honest option. Real systems often do both: inverses for the common small edits, a snapshot around the rare destructive one."

[[q]]
id = "be-017"
qtype = "judgment"
subtopic = "observer"
levels = ["graduate", "mid"]
q = "Placing an order publishes a notification, and several parts of the application subscribe to it and do their own work. New information: a rule now says the customer's confirmation email must be sent before stock is reserved. Does publishing to subscribers remain the right shape for those two?"
a = "Less appropriate, around -2. The subject calls its subscribers in an order that is usually unspecified and never part of the contract, so a requirement about which runs first cannot be expressed in the pattern at all. A team that relies on registration order has written down a dependency the code does not enforce, and the next refactor breaks it silently. If the order is genuinely required, those two steps are one sequence and belong in code that states the sequence; keep the notification for the parts that genuinely do not care when they run."

[[q]]
id = "be-018"
qtype = "diagnostic"
subtopic = "state"
levels = ["graduate", "mid"]
q = "An order's status gained a sixth value last week. Three bugs followed, all the same shape: some part of the system did not recognise the new value and fell through to its default behaviour. Most likely cause?"
a = "The status is a field tested by a conditional in many methods, so adding a value means finding every one of those conditionals by hand, and the ones that were missed keep compiling and keep taking the default branch. Nothing forced the author to consider the new case. Making each status an object implementing a shared interface moves the omission to compile time, because a new type has to implement every operation, and it puts the legal transitions in one enumerable place rather than leaving them implied by whichever branches happen to exist."

[[q]]
id = "be-019"
qtype = "discrimination"
subtopic = "strategy"
levels = ["graduate", "mid"]
q = "Two designs let the pricing step of a checkout vary. The first passes an object holding the pricing rule into the checkout. The second makes the checkout a base class with an abstract pricing method each subclass fills in. Both work. What does the first let you do that the second does not?"
a = "Vary it at runtime, and vary more than one thing independently. The passed-in rule is chosen per call or per configuration, swapped without creating a type, and combined freely with another varying step chosen separately. The subclass fixes the choice at the moment the type is chosen and spends the single inheritance slot, so a second axis of variation needs a subclass per combination. The subclass is also coupled to the base class's internals and can only be tested through it, whereas the rule object is testable on its own with no checkout at all."

[[q]]
id = "be-020"
qtype = "recall"
subtopic = "template-method"
levels = ["graduate", "mid"]
q = "A base class runs the same steps in the same order and calls methods that subclasses provide. What must a subclass author know that the signatures they are implementing do not tell them?"
a = "When each hook is called, how often, and what has already happened by the time it runs. The sequence is the base class's private business and appears nowhere in the interface the subclass sees, so a hook that assumes an earlier step has run is correct only by inspection of the parent, and it stays correct only until someone reorders the parent. That is the coupling meant by saying inheritance is tight here: the subclass depends on the base class's sequence rather than on its signatures, and the sequence can change without a compile error anywhere."
