# Question bank: creational
topic = "creational"

[[q]]
id = "cr-001"
qtype = "recall"
subtopic = "factory"
levels = ["graduate", "mid", "senior"]
q = "What problem does a factory solve that calling a constructor does not?"
a = "A constructor hard-codes exactly which class is created, at that spot. A factory moves that decision somewhere it can vary - by configuration, by environment, or by test - so callers depend on the abstraction and never name the concrete type."

[[q]]
id = "cr-002"
qtype = "recall"
subtopic = "factory"
levels = ["mid", "senior", "lead", "staff"]
q = "What is a static factory method and why is it undersold?"
a = "A named constructor - Duration.ofSeconds(30), User.fromLegacyRecord(row). It gives construction a name, can return a cached instance or a subtype, and needs no hierarchy or extra class. It solves most of what people reach for a factory object to solve, at almost no cost."

[[q]]
id = "cr-003"
qtype = "discrimination"
subtopic = "factory"
levels = ["mid", "senior", "lead", "staff"]
q = "When is an abstract factory justified rather than several separate factories?"
a = "When the products form a family that must be consistent - you must not mix a Windows button with a Mac scrollbar. The consistency constraint is the entire justification. Without one, an abstract factory is several factories with a shared interface for no reason."

[[q]]
id = "cr-004"
qtype = "recall"
subtopic = "builder"
levels = ["graduate", "mid", "senior"]
q = "What does a builder fix, and how do you recognise the problem?"
a = "The telescoping constructor - four overloads and a call site reading new Report(true, false, null, true) that nobody can decode. A builder names each value at the call site and lets validation of the whole object happen at build(), where cross-field rules can live."

[[q]]
id = "cr-005"
qtype = "judgment"
subtopic = "builder"
levels = ["mid", "senior", "lead", "staff"]
q = "You are adding a builder for a class with three optional parameters. New information - the language has named arguments with defaults. More or less appropriate?"
a = "Less, -2. The language already solved it: named arguments give you readable call sites and defaults with no extra class to maintain and no window in which a half-built object exists. A builder is for languages that lack this, or for genuinely multi-step construction."

[[q]]
id = "cr-006"
qtype = "recall"
subtopic = "singleton"
levels = ["mid", "senior", "lead", "staff"]
q = "Name the three real costs of a singleton."
a = "A hidden dependency - the class needs something its constructor does not declare. Untestability - global mutable state persists between tests, so tests become order-dependent and substituting a fake means mutating a global. Concurrency - lazy initialisation is a race, and the shared mutable state is a race by construction."

[[q]]
id = "cr-007"
qtype = "discrimination"
subtopic = "singleton"
levels = ["mid", "senior", "lead", "staff"]
q = "A singleton conflates two things. What are they, and which is harmful?"
a = "There should be one of these, and anyone may reach it from anywhere. The first is often a legitimate requirement; the second is the harmful half. Create one instance at the composition root and inject it - you keep single-instance semantics and lose the global access."

[[q]]
id = "cr-008"
qtype = "diagnostic"
subtopic = "object-lifetime"
levels = ["senior", "lead", "staff"]
q = "A service registered as a singleton holds a database session. After a while it serves stale data and eventually exhausts the connection pool. What is this called?"
a = "A captive dependency - a longer-lived object capturing a shorter-lived one. The session was meant to be scoped to a request; captured by a singleton it never goes out of scope, so it holds its connection and its stale identity map for the life of the process."

[[q]]
id = "cr-009"
qtype = "recall"
subtopic = "object-lifetime"
levels = ["mid", "senior", "lead", "staff"]
q = "Give the two rules that prevent almost every lifetime bug."
a = "A longer-lived object must never capture a shorter-lived one. And anything registered as a singleton must be thread-safe, because it will be used concurrently whether or not you planned for it."

[[q]]
id = "cr-010"
qtype = "discrimination"
subtopic = "object-lifetime"
levels = ["mid", "senior", "lead", "staff"]
q = "Transient, scoped and singleton. What belongs in each?"
a = "Transient - cheap stateful objects, a new one per request for it. Scoped - anything holding per-request state, a unit of work, a database session, one per request or job. Singleton - stateless services, connection pools, caches, one per process. The mistakes are stateful singletons and captured scoped objects."

[[q]]
id = "cr-011"
qtype = "judgment"
subtopic = "singleton"
levels = ["graduate", "mid", "senior"]
q = "You are making the configuration object a singleton so any class can read settings. More or less appropriate?"
a = "Less, -1 to -2. It works and it hides the dependency: nothing in a class's signature shows that it reads configuration, and a test that needs different settings must mutate a global. Inject the configuration, or better the specific values a class needs, so the requirement is visible."

[[q]]
id = "cr-012"
qtype = "discrimination"
subtopic = "builder"
levels = ["graduate", "mid"]
q = "An object needs many optional settings. One approach offers a series of constructors covering the plausible combinations; the other assembles the object step by step and produces it at the end. What goes wrong with the first as the number of optional settings grows?"
a = "The combinations multiply, so you either write a constructor per plausible subset or you write one long parameter list where the caller passes nulls and defaults positionally and nobody can read the call site. Adding one more optional setting makes it worse again. Assembling step by step names each value at the point it is supplied, lets the caller set only what it cares about, and gives one place to validate that the finished combination is coherent before handing it over."

[[q]]
id = "cr-013"
qtype = "judgment"
subtopic = "object-lifetime"
levels = ["graduate", "mid"]
q = "A service object is created once at startup and shared by every request, because constructing it is expensive. New information: it holds the identity of the current user, set at the start of each request. Does sharing one instance remain safe?"
a = "No, -2, and it is a correctness bug rather than a design preference. A single shared instance holding per-request state means concurrent requests overwrite each other's identity, so one user's work is done as another user - intermittent, load-dependent, and invisible in a test that issues one request at a time. Keep the expensive, immutable part shared and pass the identity in as an argument, or scope the instance holding it to the request."

[[q]]
id = "cr-014"
qtype = "diagnostic"
subtopic = "singleton"
levels = ["graduate", "mid"]
q = "A suite of tests passes when each test file is run on its own and fails when the whole suite runs together, with failures that move around as tests are reordered. Most likely cause?"
a = "Shared mutable state living for the lifetime of the process, typically a single global instance holding a cache, a registry or a configuration that one test mutates and the next inherits. It passes in isolation because each file gets a fresh process. The moving failures are the giveaway: order decides who writes before whom. The reason a global instance is treated as a design problem rather than a convenience is exactly this - it is a dependency nothing declares, so nothing resets it."

[[q]]
id = "cr-015"
qtype = "discrimination"
subtopic = "factory"
levels = ["graduate", "mid"]
q = "Two ways to make a duration of thirty seconds: call the constructor with the number, or call a class-level method named for what it produces. The second is longer to write. What does it buy?"
a = "A name, and freedom in what comes back. The name says which reading of the argument you meant, which a bare number in a constructor cannot: seconds or milliseconds is a comment at best. And because the method is not obliged to return a fresh instance of exactly that class, it can hand back a cached value for a common case, or an instance of a subtype, with no caller changing. A constructor can do neither. Its name is fixed to the class and it must return a new instance of it."

[[q]]
id = "cr-016"
qtype = "recall"
subtopic = "object-lifetime"
levels = ["graduate", "mid"]
q = "A dependency can be created fresh every time something asks for it. What does that choice cost, and why is it the wrong one for a pool of database connections?"
a = "It costs allocation churn where construction is expensive, and it destroys anything whose value comes from being shared. A pool exists to hold connections and hand them back out, so creating one per request for it gives every caller a private pool with its own connections: the reuse never happens, and the total connection count grows with callers instead of being capped by the pool size. Anything whose purpose is to be shared - a pool, a cache, a set of rate-limit counters - has to live at least as long as the sharing is meant to span."

[[q]]
id = "cr-017"
qtype = "judgment"
subtopic = "builder"
levels = ["lead", "staff"]
q = "A team convention says any type with more than three constructor parameters gets a builder. New information: the language gained named arguments with defaults two releases ago, and half the team has quietly started using those instead. Keep the convention?"
a = "Less appropriate to keep as written, around -1 to -2, and the split in the team is the more urgent half. The convention encoded a language limitation that no longer exists, so it now costs a class per type to express what a call site can say directly, and it reintroduces a window in which a half-built object exists. The lead's move is not to declare the better technique and move on, it is to retire the convention explicitly and say what replaces it, including what survives: a builder still earns its place where construction genuinely happens in steps, or where cross-field validation needs somewhere to run before the object exists. A convention half the team has stopped following is worse than either option on its own, because the codebase now teaches two things and neither reads as deliberate."
