# Question bank: dependency-injection
topic = "dependency-injection"

[[q]]
id = "di-001"
qtype = "discrimination"
subtopic = "inversion"
levels = ["mid", "senior", "lead", "staff"]
q = "Dependency inversion, dependency injection and inversion of control. Are they the same?"
a = "No. Inversion is a PRINCIPLE about which way the dependency arrow points across a boundary. Injection is a TECHNIQUE - pass dependencies in rather than constructing them. Inversion of control is a STYLE where the framework calls you. You can do injection without inversion by injecting a concrete class, and inversion without any framework."

[[q]]
id = "di-002"
qtype = "recall"
subtopic = "inversion"
levels = ["graduate", "mid", "senior"]
q = "Why is constructor injection the default form?"
a = "Because the signature states exactly what the class needs, so you can see its dependencies by reading one line, and an object cannot exist in a half-configured state. Setter injection allows a partially built object; a service locator hides the dependency again behind a different global."

[[q]]
id = "di-003"
qtype = "judgment"
subtopic = "inversion"
levels = ["mid", "senior", "lead", "staff"]
q = "A class asks a static registry for what it needs, so nothing has to be passed in. More or less like dependency injection?"
a = "Not injection at all, -2. That is a service locator - the dependency is hidden again, just behind a different global, so a constructor tells you nothing about what the class needs and a test must mutate a global to substitute anything. It is occasionally the only option in a framework you do not control, and it is not a design goal."

[[q]]
id = "di-004"
qtype = "recall"
subtopic = "inversion"
levels = ["senior", "lead", "staff"]
q = "What is the real benefit of DI, beyond testability?"
a = "The constructor becomes an honest declaration of what a class needs, so a class with nine dependencies is visibly doing too much. DI makes bad cohesion legible - which is why the fix for a long constructor is splitting the class, not introducing a parameter object to hide the count."

[[q]]
id = "di-005"
qtype = "recall"
subtopic = "wiring"
levels = ["mid", "senior", "lead", "staff"]
q = "What is a composition root and why should there be exactly one?"
a = "The single place, as close to the entry point as possible, where concrete types are chosen and the object graph is built. One, because only it knows about implementations - so swapping one is a single edit. If wiring is spread across the codebase there is no composition root and the benefit is gone, even with constructor injection everywhere."

[[q]]
id = "di-006"
qtype = "judgment"
subtopic = "wiring"
levels = ["mid", "senior", "lead", "staff"]
q = "You are adding a DI container to a service with twenty classes. More or less appropriate?"
a = "Less, -1. Manual wiring at twenty classes is twenty lines in one file, readable and checked by the compiler. A container earns its place at a few hundred registrations, and its cost is that a missing registration becomes a runtime failure far from the cause."

[[q]]
id = "di-007"
qtype = "recall"
subtopic = "lifetimes"
levels = ["mid", "senior", "lead", "staff"]
q = "State the two lifetime rules that prevent most DI bugs."
a = "A longer-lived object must never capture a shorter-lived one - that is a captive dependency, and it keeps a request-scoped session alive for the life of the process. And anything registered as a singleton must be thread-safe, because it will be used concurrently."

[[q]]
id = "di-008"
qtype = "diagnostic"
subtopic = "lifetimes"
levels = ["senior", "lead", "staff"]
q = "After moving a class from scoped to singleton to reduce allocations, users occasionally see another user's data. What happened?"
a = "The class held per-request state. As a scoped object that was safe, since each request got its own; as a singleton it is shared across concurrent requests, so one request's data leaks into another's response. Singleton registration is only safe for stateless objects."

[[q]]
id = "di-009"
qtype = "recall"
subtopic = "test-seams"
levels = ["graduate", "mid", "senior"]
q = "Which three dependencies most often need injecting to make code testable?"
a = "Time, randomness and I/O. All three make behaviour non-deterministic, all three are trivially injectable as a Clock, a random source and a repository or client interface, and injecting them turns an untestable function into a deterministic one."

[[q]]
id = "di-010"
qtype = "judgment"
subtopic = "test-seams"
levels = ["mid", "senior", "lead", "staff"]
q = "Every internal collaborator is behind an interface so it can be mocked in tests. More or less appropriate?"
a = "Less, -2. Mocking internal collaborators produces tests coupled to the implementation, so any refactor breaks them and the suite starts resisting the change it was meant to enable. Put seams at boundaries you do not own; use the real thing inside your own code."

[[q]]
id = "di-011"
qtype = "recall"
subtopic = "test-seams"
levels = ["senior", "lead", "staff"]
q = "What is the signal that DI has been over-applied?"
a = "An interface with exactly one implementation, that will only ever have one, existing solely so a test can mock it. If you would never swap it in production, ask whether the test should just use the real thing - the interface is buying nothing and costing a file and a level of indirection."

[[q]]
id = "di-012"
qtype = "discrimination"
subtopic = "inversion"
levels = ["graduate", "mid"]
q = "Two classes need the same collaborator. The first takes it as a constructor parameter. The second is constructed with no arguments and has a field assigned afterwards by whoever built it. What can go wrong with the second that cannot go wrong with the first?"
a = "The object can exist half configured. Between construction and assignment it is a perfectly valid reference that fails when used, so a caller who forgets the assignment gets a null failure at the first call rather than an error at the point of the mistake, and no single place guarantees the object is complete. The constructor version cannot be built wrong: the signature is the declaration of what the class needs, and the type system enforces it. Setter assignment also makes the dependency read as optional, which is rarely what was meant."

[[q]]
id = "di-013"
qtype = "judgment"
subtopic = "lifetimes"
levels = ["graduate", "mid"]
q = "A currency formatter holds no fields and no state, and is currently constructed wherever it is used. Someone proposes registering one instance for the whole process instead. New information: profiling shows constructing it is negligible. More or less worth doing?"
a = "About 0, and the reasoning matters more than the number. It is safe, because an object with no mutable state has nothing to race on when threads share it, so nothing argues against it. But the case for it was cost, and the profile has removed that, so what is left is taste. Where the answer changes is the day someone adds a field: anything registered once per process is used concurrently whether or not that was planned, and nobody revisits the registration when adding a cache to the formatter."

[[q]]
id = "di-014"
qtype = "discrimination"
subtopic = "lifetimes"
levels = ["graduate", "mid"]
q = "A service depends on two things: a cache of reference data, and a database session that must see one request's work as a single unit. One belongs to the process and the other to the request. Which is which, and what breaks if each is given the other's lifetime?"
a = "The cache belongs to the process, the session to the request. A cache rebuilt per request caches nothing: every entry dies with the caller that filled it, and the load it was meant to remove comes straight back. A session shared by the process is worse, because the unit of work now spans requests: one caller sees another's uncommitted changes, a rollback discards work that was not theirs, and the connection it holds is never returned. The general rule underneath both is that a longer-lived object must never hold a shorter-lived one."

[[q]]
id = "di-015"
qtype = "discrimination"
subtopic = "test-seams"
levels = ["graduate", "mid"]
q = "A test needs the current date to be a fixed value. One approach replaces the global date function for the duration of the test. The other passes a clock object into the class and hands the test a fixed one. What does the second give you that the first does not?"
a = "A dependency that is declared rather than ambient. Replacing a global mutates state every test in the process shares, so tests cannot run in parallel, a replacement that escapes its scope corrupts unrelated tests, and nothing in the class under test says it reads the clock at all. Injecting it puts the dependency in the signature and makes the class deterministic by construction, with no test machinery involved. Time, randomness and I/O are the three that most often need this, because they are the sources of behaviour a test cannot otherwise pin down, and all three are trivially injectable."

[[q]]
id = "di-016"
qtype = "diagnostic"
subtopic = "wiring"
levels = ["graduate", "mid"]
q = "Every class in a service takes its collaborators as constructor parameters. Substituting a fake email provider for one test still required edits in eleven files. What has gone wrong?"
a = "There is no composition root. Constructor injection is being used everywhere, but the concrete types are still chosen all over the codebase, so eleven places construct the provider and eleven places have to change. The technique is present and the thing it is for is missing: one location near the entry point where the graph is assembled, with nothing else naming a concrete implementation. With that in place the swap is a single edit and the eleven classes never mention the provider at all."

[[q]]
id = "di-017"
qtype = "discrimination"
subtopic = "wiring"
levels = ["graduate"]
q = "Two classes obtain a database connection differently. One takes it as a constructor parameter. The other calls a module-level function at the top of each method to fetch it. Both work in production. What is materially different about them?"
a = "What the class declares, and who controls what it gets. The first states the dependency in its signature, so it can be handed a different connection - a fake, a read replica, one already inside a transaction - without being edited. The second hides the dependency behind a global lookup, so reading the constructor tells you nothing about what the class needs, and changing what it receives means changing state every other class shares. Fetching your dependencies from a registry is not injection: it is the same global with an interface in front of it."
