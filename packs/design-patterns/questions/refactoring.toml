# Question bank: refactoring
topic = "refactoring"

[[q]]
id = "rf-001"
qtype = "recall"
subtopic = "smells"
levels = ["graduate", "mid", "senior"]
q = "What is a code smell, and what is it not?"
a = "A hint that something may be wrong and a question worth asking. It is not a verdict - plenty of long methods are fine and plenty of short ones are not. Treating smells as rules produces mechanical changes that make code worse."

[[q]]
id = "rf-002"
qtype = "recall"
subtopic = "smells"
levels = ["mid", "senior", "lead", "staff"]
q = "Feature envy - what is it and what is the usual fix?"
a = "A method more interested in another class's data than its own, calling several getters on it and doing the work itself. The fix is usually to move the method to the class whose data it uses, so behaviour sits with the state it operates on."

[[q]]
id = "rf-003"
qtype = "recall"
subtopic = "smells"
levels = ["mid", "senior", "lead", "staff"]
q = "What is speculative generality and how do you recognise it?"
a = "Abstraction built for a case that never arrived. Recognise it by an interface with one implementation, a parameter always passed the same value, an abstract base with one subclass, or a configuration hook nobody sets. The fix is to delete it - it costs comprehension every day and returns nothing."

[[q]]
id = "rf-004"
qtype = "diagnostic"
subtopic = "smells"
levels = ["senior", "lead", "staff"]
q = "Half a class's methods use one group of fields and the other half use a different group, with no overlap. What is that?"
a = "Two classes wearing one name. The field clustering is the evidence - it says the responsibilities are already separate and only the file boundary is wrong. Extract class along the cluster line."

[[q]]
id = "rf-005"
qtype = "recall"
subtopic = "safe-steps"
levels = ["graduate", "mid", "senior"]
q = "What makes refactoring safe, and what is the one property that must hold?"
a = "Behaviour is preserved. That is what makes the safety argument work - the tests should still pass, so a failing test means you made a mistake. Mixing a behaviour change in destroys that signal and turns the refactor into a rewrite with a rewrite's risk."

[[q]]
id = "rf-006"
qtype = "recall"
subtopic = "safe-steps"
levels = ["mid", "senior", "lead", "staff"]
q = "There are no tests. What is the first step?"
a = "A characterisation test - one asserting what the code currently does, right or wrong. It is not a specification, it is a tripwire, and it is what lets you change structure and know you have not changed behaviour. If there is no seam to test through, creating one by injecting a dependency is a legitimate first change."

[[q]]
id = "rf-007"
qtype = "judgment"
subtopic = "safe-steps"
levels = ["mid", "senior", "lead", "staff"]
q = "You are including a small bug fix in a large refactoring commit since you spotted it while moving the code. More or less appropriate?"
a = "Less, -2. A reviewer cannot see a behaviour change inside a thousand lines of moved code, and neither can bisect later. Commit the refactor, then commit the fix. It costs one extra commit and saves an afternoon in six months."

[[q]]
id = "rf-008"
qtype = "recall"
subtopic = "safe-steps"
levels = ["senior", "lead", "staff"]
q = "Describe the strangler fig approach and what it buys."
a = "Put the new implementation alongside the old, route a slice of calls to it, verify, widen the slice, then delete the old one. It buys a working system throughout and a rollback at every step, which a big-bang rewrite does not - and it forces you to keep the interface honest because both must satisfy it."

[[q]]
id = "rf-009"
qtype = "recall"
subtopic = "naming"
levels = ["graduate", "mid", "senior"]
q = "Give two rules for naming that improve most code immediately."
a = "Name by what it means, not how it is done - activeCustomers rather than filteredList. And scale name length to scope - i in a three-line loop is fine, d as a class field is not. Also avoid noise words like data, info, manager and process, which would still fit if the class did something else entirely."

[[q]]
id = "rf-010"
qtype = "recall"
subtopic = "naming"
levels = ["mid", "senior", "lead", "staff"]
q = "You cannot think of a good name for a class. What is that telling you?"
a = "That it probably has no single responsibility. Struggling to name something is information, not a vocabulary problem - if you cannot say what it is in a few words, it is likely several things, and splitting it makes the names obvious."

[[q]]
id = "rf-011"
qtype = "judgment"
subtopic = "duplication"
levels = ["mid", "senior", "lead", "staff"]
q = "Two functions are textually identical, so you are extracting a shared one. New information - one implements a tax rule and the other a shipping rule that happen to compute the same way today. More or less appropriate?"
a = "Less, -2. DRY is about knowledge, not text. These encode different rules that will diverge, and merging them couples two things that should change independently - so the next change adds a flag, and then another. The test is whether a change to one rule must change both."

[[q]]
id = "rf-012"
qtype = "recall"
subtopic = "duplication"
levels = ["senior", "lead", "staff"]
q = "Why is a wrong abstraction worse than duplication?"
a = "Duplication is visible and mechanical to fix. A wrong abstraction is shared, so everyone bends it with special cases and flags rather than removing it, and unwinding it means understanding every caller. When you find one, inline it back to the concrete cases and re-abstract from there."

[[q]]
id = "rf-013"
qtype = "judgment"
subtopic = "duplication"
levels = ["senior", "lead", "staff"]
q = "Two services each have their own copy of the customer model, so you are extracting a shared library. More or less appropriate?"
a = "Less, -1 to -2. Duplication across a module or service boundary is often correct - the copies let the services deploy and evolve independently, whereas a shared model couples their release cycles and turns every change into a cross-team negotiation. Remove duplication inside a boundary; think hard before removing it across one."

[[q]]
id = "rf-014"
qtype = "numeric"
subtopic = "duplication"
levels = ["mid", "senior", "lead", "staff"]
q = "A block of logic appears in two places. Extracting it into a shared abstraction takes an afternoon. Six months later the two callers have diverged, and the shared thing carries three boolean flags and two special cases to serve both; unwinding it means understanding every caller. Counting the flags and special cases as the ongoing cost, what does the rule of three say the second occurrence should have bought, and why does the arithmetic favour waiting?"
a = "Nothing but a note. Two occurrences give two data points, which cannot show you the axis of variation, so abstracting at two is a guess - and here it was wrong five times over, since 3 flags plus 2 special cases is 5 accommodations bolted onto a shared thing to keep two callers working. The afternoon saved is dwarfed by that, because duplication is visible and mechanical to remove whereas a wrong abstraction has to be understood before it can be unwound. Wait for the third occurrence, which is the first one that shows what actually varies."
derivation = ["occurrences = 2", "flags = 3", "special_cases = 2", "accommodations = flags + special_cases"]

[[q]]
id = "rf-015"
qtype = "recall"
subtopic = "duplication"
levels = ["graduate"]
q = "The same block of code appears in two places. What question decides whether removing the duplication is the right move?"
a = "Whether a change to the rule would have to be made in both places. If the two blocks encode one piece of knowledge, they are duplication, and leaving them is how one gets fixed and the other does not. If they encode two rules that happen to compute the same thing today, they are coincidence, and merging them couples two things that will diverge, which is discovered later as a shared function with a flag in it. Identical text is not the test. A shared reason to change is."

[[q]]
id = "rf-016"
qtype = "judgment"
subtopic = "duplication"
levels = ["graduate", "mid"]
q = "The same short validation block appears in two request handlers, so you are extracting it into a shared function. New information: a third handler needs the same block except that one field is optional there. More or less appropriate?"
a = "Around 0, and what matters is what you do with the third case. Three occurrences is where the rule of three says go ahead, and the third is the one that finally shows which part varies, so this is the first moment there is enough information to abstract well rather than guess. But the shared thing has to express that variation honestly, as a property of the rule being applied, rather than take a boolean that switches behaviour. A flag parameter is the first special case, and the special cases that follow it are what turn a shared function into something nobody can change safely."

[[q]]
id = "rf-017"
qtype = "discrimination"
subtopic = "naming"
levels = ["graduate", "mid"]
q = "One name in a codebase is a single letter, another is the word data. One of them is defensible. Which, and what is the rule that separates them?"
a = "The single letter, if its scope is a three-line loop: name length should scale with how far the reader is from the declaration, and an index whose whole life is visible needs nothing more. The word data is indefensible at any scope, because it is a noise word - it would still fit after the thing it names changed completely, which is precisely what it means to say nothing. Same family: info, manager, helper, process, handle. A name is judged by what it rules out, and one that rules out nothing has only the appearance of a name."

[[q]]
id = "rf-018"
qtype = "diagnostic"
subtopic = "safe-steps"
levels = ["graduate", "mid"]
q = "A restructuring that has been running for two days is finally finished, and the suite fails in three places nobody can explain. The branch has one commit. What did the process get wrong?"
a = "It gave up the small steps and the commits, which are the things that turn a failure into information. With one transformation per commit and the tests run after each, a failure names the step that caused it. With two days in one commit, the failure could be any of a hundred changes, there is nothing to bisect, and reverting means losing all of it. The second cost is that abandoning has become expensive, so the work already sunk starts arguing for pushing on when starting again in small steps would be quicker."

[[q]]
id = "rf-019"
qtype = "discrimination"
subtopic = "smells"
levels = ["graduate", "mid"]
q = "Two comments in a file. One explains what the next twenty lines do. The other explains why a retry limit is three rather than ten. One of them is usually a smell. Which, and what is the fix?"
a = "The one explaining what. It is almost always a name that was not chosen: those twenty lines are a step with a purpose, and the comment is the name of the method they should be. Extract it and the comment becomes redundant, which is the test that the diagnosis was right. The why comment is the valuable kind and should be left alone: the reasoning behind a choice is not recoverable from the code at all, since the code shows three and cannot show why ten was rejected, and that is exactly what the next person needs before changing it."

[[q]]
id = "rf-020"
qtype = "judgment"
subtopic = "naming"
levels = ["lead", "staff"]
q = "The business says policy. The code says contract in three modules and agreement in a fourth. A rename would touch several hundred call sites across two services. Worth doing?"
a = "More, around +1 to +2, though it is a sequencing problem rather than a decision. Every translation between the business's word and the code's is a place a misunderstanding lives, and here there are two translations plus an internal inconsistency, so anyone reading the fourth module has to re-map twice. The cost is mechanical: an editor rename per module, one per commit, no behaviour change in any of them, and the cross-service part staged behind whichever names appear in a published contract, since those are the only ones that cannot be renamed unilaterally. What makes it a lead's job rather than a tidy-up is that it will not happen on its own and will not survive unless the new word is the one the team says out loud."
