# Question bank: solid
topic = "solid"

[[q]]
id = "so-001"
qtype = "recall"
subtopic = "srp"
levels = ["graduate", "mid", "senior"]
q = "State the single responsibility principle in the form that is actually useful."
a = "One responsibility to one actor - a class should have one reason to change, where a reason means a group of people who request changes. If finance's rules and reporting's rules live in the same class, two teams collide in one file."

[[q]]
id = "so-002"
qtype = "judgment"
subtopic = "srp"
levels = ["mid", "senior", "lead", "staff"]
q = "A codebase has been split so aggressively that every class has one method. More or less aligned with SRP?"
a = "Less, -1. Small is not the goal, cohesive is. A swarm of one-method classes means following a single operation requires opening nine files, which raises coupling and destroys comprehension. SRP is about grouping by reason to change, not about minimising line count."

[[q]]
id = "so-003"
qtype = "recall"
subtopic = "ocp"
levels = ["graduate", "mid", "senior"]
q = "What does open-closed mean, and what is its precondition?"
a = "Open for extension, closed for modification - add behaviour without editing existing code, usually via polymorphism or a registry. The precondition is that you guessed the axis of variation correctly. Along the wrong axis you get an abstraction that never varies while the real change still touches everything."

[[q]]
id = "so-004"
qtype = "judgment"
subtopic = "ocp"
levels = ["mid", "senior", "lead", "staff"]
q = "You are adding an interface now because a second implementation might be needed later. More or less appropriate?"
a = "Less, -1 to -2. Wait for the second case. Going from a concrete class to an interface when the second implementation arrives is a cheap mechanical refactor; unwinding an abstraction built along the wrong axis is expensive and everyone works around it in the meantime."

[[q]]
id = "so-005"
qtype = "recall"
subtopic = "lsp"
levels = ["mid", "senior", "lead", "staff"]
q = "Name three concrete ways Liskov substitution gets violated."
a = "Overriding a method to throw not-supported. Strengthening a precondition, so the subclass rejects input the parent accepted. Weakening a postcondition, so it returns less than promised. The visible symptom is callers writing if x is SpecialCase, which announces the hierarchy is wrong."

[[q]]
id = "so-006"
qtype = "discrimination"
subtopic = "lsp"
levels = ["mid", "senior", "lead", "staff"]
q = "Why is Square extends Rectangle the standard Liskov example?"
a = "Because a caller holding a Rectangle may reasonably set the width and expect the height unchanged, and a Square cannot honour that. The subtype is not substitutable, so code correct for the parent is wrong for the child. It shows that is-a in English is not the same as substitutable in code."

[[q]]
id = "so-007"
qtype = "recall"
subtopic = "isp"
levels = ["graduate", "mid", "senior"]
q = "What does a fat interface cost, and what is the practical benefit of splitting it?"
a = "Every implementer writes stubs for methods it does not need, and every consumer is affected by changes to methods it never calls. The practical benefit of splitting is that a narrow interface is trivial to fake in a test - a ten-method interface where you need one is a setup tax paid on every test forever."

[[q]]
id = "so-008"
qtype = "recall"
subtopic = "isp"
levels = ["mid", "senior", "lead", "staff"]
q = "What should interfaces be segregated by?"
a = "Client need, not symmetry. If one caller only reads and another only writes, that is two interfaces even if one class implements both. Splitting by what callers actually use is the point; splitting to make the design look tidy is not."

[[q]]
id = "so-009"
qtype = "recall"
subtopic = "dip"
levels = ["mid", "senior", "lead", "staff"]
q = "What exactly is inverted in dependency inversion?"
a = "The direction of the dependency arrow. Normally business logic calls a database class, so the domain depends on infrastructure. Inverted, the domain declares the interface it needs and the database implementation depends on the domain by implementing it. The domain can then be understood and tested with no database at all."

[[q]]
id = "so-010"
qtype = "judgment"
subtopic = "dip"
levels = ["senior", "lead", "staff"]
q = "Every class in the codebase has an interface in front of it, each with exactly one implementation, in the same package. Is this dependency inversion?"
a = "No, -2. Nothing is inverted - the interface sits beside its only implementation and no boundary is crossed, so it is indirection with extra files. DIP is about which way dependencies point across a boundary. An interface with one permanent implementation and no boundary is ceremony."

[[q]]
id = "so-011"
qtype = "discrimination"
subtopic = "dip"
levels = ["senior", "lead", "staff"]
q = "Group the five SOLID principles by what they are actually about."
a = "SRP and ISP are about the size and grouping of units. LSP is a correctness constraint on inheritance and the only one that can be objectively violated. OCP and DIP are about the direction of dependency. Seeing that makes clear they are not five instances of one idea."

[[q]]
id = "so-012"
qtype = "judgment"
subtopic = "ocp"
levels = ["mid", "senior", "lead", "staff"]
q = "You are applying SOLID rigorously to a script that will be deleted next month. More or less appropriate?"
a = "Less, -2. Every one of these principles costs indirection now to make future change cheap. With no future, there is no return. They earn their keep in code that has been alive long enough to change repeatedly, and nowhere else."

[[q]]
id = "so-013"
qtype = "discrimination"
subtopic = "srp"
levels = ["graduate", "mid"]
q = "Two people apply the same principle to one large class. One ends up with three cohesive classes; the other with nine classes of one method each, where following a single operation means opening all nine. What did the second person use as the unit, and what is the right one?"
a = "The second used size, splitting until each piece was small. The unit is a reason to change, better stated as one responsibility to one actor: if the finance team's rules and the reporting team's rules live in one class, two groups request changes to the same file and collide. Splitting along that axis gives you the three. Splitting by size gives you indirection with no seam behind it, because all nine still change together for the same reason. Small is not the goal, cohesive is."

[[q]]
id = "so-014"
qtype = "discrimination"
subtopic = "lsp"
levels = ["graduate", "mid"]
q = "A square is a rectangle in every sense a biology teacher would accept, and making one a subtype of the other breaks callers. What is the test the taxonomy passes and the code fails?"
a = "Substitutability by behaviour rather than resemblance by category. The rule is that a subtype must be usable anywhere its supertype is without the caller knowing, so what matters is the contract callers rely on, not whether the words form a sensible hierarchy. A caller that sets width and then height and expects both to hold is relying on their independence, which the square cannot honour. Inheriting because the sentence 'is a' sounds true is the trap; the question is whether every promise the supertype made still holds."

[[q]]
id = "so-015"
qtype = "judgment"
subtopic = "isp"
levels = ["graduate", "mid"]
q = "A wide interface is to be split so that no caller depends on methods it does not use. New information: there is one implementation and one caller, and the split is proposed because a second caller is expected next year. Does the split become more or less worth doing now?"
a = "Less, around -1. The principle is real and the timing is the whole question: with one caller there is no client being forced to depend on anything it does not use, so the split buys nothing today and commits you to a shape guessed from a caller that does not exist. Wait for the second case, then split along what it actually needs. Going from a concrete interface to a narrower one once you can see both callers is cheap; unwinding a division that turned out to be along the wrong axis is not."

[[q]]
id = "so-016"
qtype = "numeric"
subtopic = "ocp"
levels = ["graduate", "mid"]
q = "A payment type is identified by a branch that appears in the pricing module, the receipt renderer, the refund path and the reconciliation report. Two new payment types are being added this quarter. How many of those branch sites must be edited, and how many edits is that in total?"
a = "All four sites, twice each, so eight edits, and every one is a chance to miss a site - which is the failure this principle names. Adding behaviour requires modifying existing code in four places, so the module is open for neither extension nor safety. Replacing the branches with polymorphism or a registry makes each new type one new class and zero edits to the four call sites. Note the four is the cost that matters, not the two: the edits scale with the number of places that switch on the type."
derivation = ["sites = 4", "new_types = 2", "edits = sites * new_types"]

[[q]]
id = "so-017"
qtype = "recall"
subtopic = "dip"
levels = ["graduate", "mid"]
q = "A use case needs to save an order and must not know whether the store is Postgres or a file. Where does the interface it calls live, and who implements it?"
a = "The interface belongs with the use case, in the domain, and is expressed in the domain's language: save an order, not execute an update. The Postgres class lives in the infrastructure and implements it, so the infrastructure depends on the domain and not the other way round. That reversed arrow is the inversion, and it is the whole content of the principle: without it you have an interface, but the dependency still runs from policy to detail. The consequence noticed first is that the use case can be exercised against an in-memory implementation with no database at all."

[[q]]
id = "so-018"
qtype = "judgment"
subtopic = "dip"
levels = ["graduate", "mid"]
q = "Domain code imports the ORM's session type and calls it directly to save. New information: the team wants the domain's tests to run without a database. Does declaring an interface that the domain owns become more or less worth doing?"
a = "More, +2, and the test requirement is the cheapest justification available. With the session type inside the domain, every domain test needs either a database or a mock of a third-party type nobody controls, which is slow and brittle in equal measure. An interface the domain declares and the persistence layer implements turns those tests into plain calls against an in-memory implementation. Note which detail does the work: the interface has to be defined by the domain in the domain's terms. Extracting one from the ORM class and putting it in a package beside the domain leaves the dependency pointing outwards and buys nothing."

[[q]]
id = "so-019"
qtype = "judgment"
subtopic = "lsp"
levels = ["graduate", "mid"]
q = "A read-only collection is being written as a subclass of the mutable one, with the mutating methods overridden to throw. New information: every caller today is in your own codebase and none of them mutates. More or less appropriate?"
a = "Less, around -1 to -2. It compiles and it works today, which is why this keeps getting built. The defect is that the subtype no longer honours what its supertype promised, so any code taking the mutable type is conditionally wrong, and the failure surfaces at runtime in the caller, a long way from the decision. That today's callers happen not to mutate is a property of today, and nothing marks the type as unsafe to pass. Composition instead: hold the collection, expose the operations that are actually supported, and a caller that needs to mutate cannot be handed one by accident."

[[q]]
id = "so-020"
qtype = "judgment"
subtopic = "isp"
levels = ["lead", "staff"]
q = "An interface in a shared module has reached twelve methods, each added by whichever team needed it. Every implementer stubs the ones it does not use, and each addition recompiles every consumer. The proposal is to split it into per-caller interfaces. More or less appropriate, and what makes the split hold?"
a = "More, +2 on the split; the harder half is stopping it regrowing. Segregate by client need rather than by symmetry: each caller depends on the methods it calls, one class may implement several of the resulting interfaces, and the stubbing disappears because nothing declares what it cannot do. What makes it hold is a mechanism rather than a rule. Put each interface with its consumer, so adding a method to someone else's interface is a change to their code and a conversation. Without that, the next team under a deadline adds a thirteenth method, because a fat interface is never anybody's fault and will not become anybody's responsibility on its own."

[[q]]
id = "so-021"
qtype = "diagnostic"
subtopic = "srp"
levels = ["lead", "staff"]
q = "One file appears in most pull requests. Finance's changes and reporting's changes keep colliding in it, and about once a month a release waits while two teams reconcile edits made in the same window. The class reads coherently and is not especially large. What is the diagnosis?"
a = "It serves two actors, which is what a reason to change actually means: not a topic, but a group of people who ask for changes. Size and readability are the wrong instruments here, which is why the class looks fine; the evidence is in the commit history, not the code. Split it along the actors so each team owns its own file, even where the two halves share data and the seam looks arbitrary from inside the code. The test of the diagnosis is that the monthly collision stops, and if it does not, the actors were not the ones you named."
