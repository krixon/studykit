# Question bank: structural
topic = "structural"

[[q]]
id = "st-001"
qtype = "discrimination"
subtopic = "adapter"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Adapter and decorator have the same shape in a diagram. What separates them?"
a = "Whether the interface changes. An adapter makes an incompatible interface fit - you need PaymentGateway and the vendor gives you StripeClient, so the interface changes. A decorator implements the same interface and adds behaviour. Same structure, opposite intent."

[[q]]
id = "st-002"
qtype = "recall"
subtopic = "adapter"
levels = ["mid", "senior", "lead", "staff"]
q = "Why is an adapter the standard way to handle a third-party SDK?"
a = "Because the vendor's types, exceptions and vocabulary stop at the adapter, so nothing else in the codebase mentions them. Replacing the vendor then touches one class instead of everywhere the SDK was used, and your domain stays expressed in your own language."

[[q]]
id = "st-003"
qtype = "recall"
subtopic = "decorator"
levels = ["graduate", "mid", "senior"]
q = "What does the decorator pattern let you avoid?"
a = "A subclass explosion. Three orthogonal behaviours - caching, retrying, logging - need three decorators that stack in any order, against eight subclasses for every combination. Adding or removing one becomes a change to wiring rather than to a hierarchy."

[[q]]
id = "st-004"
qtype = "judgment"
subtopic = "decorator"
levels = ["mid", "senior", "lead", "staff"]
q = "You are wrapping a repository in six decorators - logging, metrics, caching, retry, circuit breaking, tracing. More or less appropriate?"
a = "Roughly 0, with a real caveat. Each concern is genuinely separate and independently testable, which is the pattern working. The cost is that a stack trace is now six frames of indirection deep and the actual behaviour is only visible in the wiring code. Keep it, and make the composition root read clearly, because that file is now the only place the behaviour is described."

[[q]]
id = "st-005"
qtype = "discrimination"
subtopic = "facade"
levels = ["mid", "senior", "lead", "staff"]
q = "How is a facade different from an adapter?"
a = "A facade wraps MANY objects and offers a NARROWER, simpler interface than the subsystem behind it. An adapter wraps ONE object and offers an equivalent interface in a different shape. Facade simplifies; adapter translates."

[[q]]
id = "st-006"
qtype = "diagnostic"
subtopic = "facade"
levels = ["senior", "lead", "staff"]
q = "A facade has grown to forty methods, each a one-line delegation. What has gone wrong?"
a = "It has stopped simplifying anything - it is the subsystem plus a layer of indirection, and every subsystem change now also changes the facade. Either it should expose only the few operations callers actually need, or the subsystem needs a genuine simplification rather than a pass-through."

[[q]]
id = "st-007"
qtype = "discrimination"
subtopic = "proxy"
levels = ["mid", "senior", "lead", "staff"]
q = "Proxy and decorator have identical structure. What is the difference in intent, and what does it imply?"
a = "A decorator ADDS to what happens; a proxy CONTROLS whether it happens. The implication is practical: a proxy may not call the real object at all - a protection proxy refuses, a caching proxy answers from a store, a virtual proxy has not created it yet."

[[q]]
id = "st-008"
qtype = "recall"
subtopic = "proxy"
levels = ["mid", "senior", "lead", "staff"]
q = "Name three proxies you use without thinking of them as proxies."
a = "An ORM lazy-loaded collection - a virtual proxy deferring the query. An RPC or gRPC client stub - a remote proxy hiding the network. A permission check wrapper on a service - a protection proxy. All three share the same interface as the thing behind them."

[[q]]
id = "st-009"
qtype = "recall"
subtopic = "composite"
levels = ["graduate", "mid", "senior"]
q = "What does the composite pattern remove from client code?"
a = "The conditional. Leaves and containers share an interface, so client code never asks whether it is holding one thing or a tree - recursion falls out of the structure. Files and folders, UI elements and panels, a validation rule and a set of rules."

[[q]]
id = "st-010"
qtype = "judgment"
subtopic = "composite"
levels = ["senior", "lead", "staff"]
q = "You put add(child) on the shared Component interface so clients never need to know leaf from container. More or less appropriate?"
a = "It is a genuine trade with no clean answer, so about 0. Putting it on the interface forces leaves to throw not-supported, which violates Liskov. Keeping it only on the container means clients sometimes must know which they hold. Pick which cost you prefer and be explicit; claiming there is no cost is the wrong answer."

[[q]]
id = "st-011"
qtype = "discrimination"
subtopic = "adapter"
levels = ["senior", "lead", "staff"]
q = "You need to intercept, defer or deny a call. Which of the four wrapping patterns, and why not the others?"
a = "Proxy. Adapter is out because the interface should not change. Decorator is out because you may need not to call through at all, and a decorator always delegates. Facade is out because it wraps a subsystem and simplifies rather than controlling access to one object."

[[q]]
id = "st-012"
qtype = "discrimination"
subtopic = "decorator"
levels = ["graduate", "mid"]
q = "Two wrapping objects, each holding another object of a compatible type, look identical in a diagram. In one the wrapper offers the same interface as the thing it wraps; in the other the interface differs. What is each for, and why is the interface the thing that tells them apart?"
a = "Same interface is a decorator, adding behaviour such as caching, retrying or logging before or after delegating; different interface is an adapter, making something incompatible fit. The interface is the discriminator because it is the only structural difference - both are an object holding an object - and it follows from the intent. A decorator has to be substitutable for what it wraps so it can stack, and an adapter exists precisely because it is not substitutable. Naming the intent is what makes these vocabulary rather than trivia."

[[q]]
id = "st-013"
qtype = "discrimination"
subtopic = "facade"
levels = ["graduate", "mid"]
q = "One wrapper exists because callers found the underlying set of classes hard to use; another exists because a vendor's type would otherwise appear throughout your code. What is each doing, and which one is about the number of things a caller must know?"
a = "The first is a facade: it presents one simple entry point over several collaborating classes, and the point is reducing what a caller must know and orchestrate. The second is an adapter: it translates one interface into another so the foreign type stops at the boundary and replacing the vendor touches one class. Facade is about simplifying a surface you own; adapter is about fitting something you do not. A facade may hide many objects, an adapter usually wraps one."

[[q]]
id = "st-014"
qtype = "diagnostic"
subtopic = "proxy"
levels = ["graduate", "mid"]
q = "Reading a field off an object returned by a data-access layer issues a database query, and doing it inside a loop issues one per iteration. The code contains no query at that point. Most likely cause?"
a = "The returned object is a stand-in rather than the real thing, and touching the field triggers the load it deferred. The whole purpose of the substitute is to be indistinguishable from the real object, which is why the code shows no query: the fetch happens on attribute access. In a loop that produces one query per iteration and the classic N+1. Fix it by asking for the related data up front, so the collection arrives loaded rather than promising to load itself later."

[[q]]
id = "st-015"
qtype = "numeric"
subtopic = "decorator"
levels = ["graduate", "mid"]
q = "A repository needs caching, retrying and logging, and any combination of the three may be wanted. Using a subclass per combination, how many subclasses cover every combination? Using wrappers of the same interface instead, how many classes, and what happens to each count when a fourth concern is added?"
a = "Eight subclasses, because every one of the three concerns is independently present or absent, and adding a fourth doubles it to sixteen. Three wrappers, one per concern, and a fourth concern makes four. The subclass count grows exponentially with the number of concerns and the wrapper count grows by one each time, which is the argument for composing behaviour at runtime rather than fixing it at compile time. The combination is then chosen by wiring rather than by picking a class name."
derivation = ["concerns = 3", "subclasses = 2 ** concerns", "wrappers = concerns", "with_fourth_sub = 2 ** 4", "with_fourth_wrap = 4"]

[[q]]
id = "st-016"
qtype = "recall"
subtopic = "adapter"
levels = ["graduate", "mid"]
q = "There is a class you cannot edit because it comes from a library, and your code already talks to everything of its kind through an interface it does not implement. What do you write, and what property names it?"
a = "A small class that implements your interface, holds an instance of theirs, and translates each call. The property that names it is that the interface changes: it exists precisely because the two shapes do not match, which is what separates it from a wrapper keeping the same interface in order to add behaviour. The same class is where the library's types, exceptions and vocabulary stop, so nothing beyond it mentions them, and replacing the library is one class of work instead of a search across the codebase."

[[q]]
id = "st-017"
qtype = "discrimination"
subtopic = "composite"
levels = ["graduate", "mid"]
q = "A drawing is made of shapes, some of which are groups containing more shapes. One design gives single shapes and groups a shared interface. Another keeps them as separate types and lets callers branch on which they hold. What does the first remove, and what does it cost?"
a = "It removes every conditional about whether you are holding one thing or many: a group implements each operation by delegating to its children, so the recursion falls out of the structure and no client code asks whether this is a leaf. The cost is the operations that only make sense for a group, adding a child being the usual one. Putting those on the shared interface forces single shapes to refuse them at runtime; leaving them off means a caller who wants to add must know which kind it has. There is no clean resolution, only a choice about where the awkwardness sits."

[[q]]
id = "st-018"
qtype = "recall"
subtopic = "facade"
levels = ["graduate", "mid"]
q = "Sending a notification currently means constructing three collaborating objects in a fixed order and calling five methods across them. You give callers one class with a single send method. What have you built, and what have you deliberately not done to the subsystem?"
a = "A facade: one entry point over several collaborating classes, offering a narrower interface than the thing behind it. What you have not done is hide or forbid the subsystem. The three classes are still there and a caller with an unusual need can still use them directly, which is the deal: the facade serves the common path and does not claim to be the only way in. It stops earning its place when it grows a method per subsystem method, at which point it is the subsystem plus a layer, and every change below it changes the facade too."

[[q]]
id = "st-019"
qtype = "discrimination"
subtopic = "proxy"
levels = ["graduate"]
q = "Two wrappers implement the same interface as the object they hold. The first writes a log line and then calls through, every time. The second checks the caller's permissions and calls through only if they pass. They are identical in a diagram. What separates them, and what can the second do that the first cannot?"
a = "Intent, with a practical consequence: the first adds to what happens, the second controls whether it happens. A wrapper that adds behaviour always delegates, so the object behind it is called exactly as often as it would have been. A wrapper that controls access may never call it at all - it can refuse, answer from something it stored earlier, or not have created the real object yet. That is why access control, lazy loading, caching and a remote call stub are all the same shape, and why the second kind can change what the system does rather than only what it records."

[[q]]
id = "st-020"
qtype = "judgment"
subtopic = "composite"
levels = ["senior", "lead", "staff"]
q = "A team-wide rule says every tree-shaped model implements one interface, add-child included, with leaves throwing not-supported. New information: two leaf types were added last quarter and both shipped a bug where a caller added children to a leaf. Keep the rule?"
a = "Less, around -2 as a blanket rule, and the evidence has already been gathered for you. This is the composite trade-off resolved in the direction that pushes the cost to runtime, which is a defensible local choice and a poor standard: every future leaf author has to remember an obligation nothing enforces, and the team has now paid for that twice. Keep the shared interface for the operations that genuinely apply to both, and put child management on the container type, so a caller who wants to add has to hold a container and the compiler says so. Where the uniform interface is genuinely right, such as an editor walking a heterogeneous tree, it should be a decision with a reason attached rather than the default."

[[q]]
id = "st-021"
qtype = "diagnostic"
subtopic = "decorator"
levels = ["senior", "lead", "staff"]
q = "Two services wrap their client in the same two wrappers, one that retries and one that caches, both taken from the same internal library. In one service a failed call is never cached; in the other, failures are served from the cache until they expire. Nobody has changed the wrappers. Most likely cause?"
a = "The two stacks are assembled in opposite orders. With the cache outside the retry, the cache sees only the retry's final result, so a value is stored after the attempts succeed or the failure is returned to the caller unstored. With the cache inside, it sees each individual attempt, so the first failure is written and then handed back to the retry, which is also why retrying stops helping. The general point is that stackable wrappers compose freely only when the concerns are orthogonal, and these two are not: one changes what the other observes. The order is part of the design, so it belongs in one shared assembly function with the reasoning recorded, not in each service's wiring."
