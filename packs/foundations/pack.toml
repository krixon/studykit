[pack]
name = "foundations"
title = "Engineering foundations"
description = "The things every backend engineer is assumed to know. Written for graduates and useful as a refresher well beyond that."
levels = ["graduate", "mid", "senior", "lead", "staff"]
areas = ["fundamentals", "web", "data", "concurrency", "quality", "tooling", "security", "systems"]

[calibration.graduate]
bar = "Names the concept correctly and can describe the mechanism in their own words. A worked example beats a definition."
assume = "Has written code, possibly only at university or in a first job. Vocabulary is still being built."
push_on = ["what it is", "why it exists", "a concrete example", "one thing that goes wrong"]
avoid = "Do not demand production war stories or scale numbers. Building the vocabulary correctly is the goal."

[calibration.mid]
bar = "Correct mechanism plus the tradeoff, and can say when the obvious choice is the wrong one."
assume = "Has shipped and maintained real code. Has debugged something in production."
push_on = ["the tradeoff", "when not to", "how you would test it", "what it costs"]
avoid = "Do not require architectural or organisational reasoning."

[calibration.senior]
bar = "Correct, with the failure mode named and a sense of what it costs at scale or over time."
assume = "Has operated systems and reviewed a lot of other people's code."
push_on = ["the failure mode", "what breaks under load or over years", "what you would measure", "how you would explain it to a junior"]
avoid = "Do not accept a textbook definition with no experience attached."

[calibration.lead]
bar = "Everything at senior, plus how you would get a team to do this consistently."
assume = "Sets standards for others. Cares about what survives staff turnover."
push_on = ["how you make this the default", "what you would automate", "what convention you would pick and why"]
avoid = "Do not reward cleverness that only works when the author is present."

[calibration.staff]
bar = "Fluent, with the boundaries of the advice named and the cases where the usual guidance is wrong."
assume = "Everything below is assumed."
push_on = ["where the received wisdom fails", "what you would delete", "the second-order cost"]
avoid = "Do not accept advice stated without its boundary conditions."

