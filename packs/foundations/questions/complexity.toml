# Question bank: complexity
topic = "complexity"

[[q]]
id = "cx-001"
qtype = "recall"
subtopic = "big-o"
levels = ["graduate", "mid"]
q = "What does big-O actually describe, and what does it deliberately ignore?"
a = "How cost grows as the input grows. It ignores constants and lower-order terms, so O(n) and O(100n) are the same class even though one is a hundred times slower on every real input. It is a statement about scaling, not about speed."

[[q]]
id = "cx-002"
qtype = "numeric"
subtopic = "big-o"
levels = ["graduate", "mid", "senior"]
q = "An O(n squared) algorithm handles 1000 items instantly. Roughly what happens at 1 million?"
a = "1000 items is a million operations, instant. A million items is 10 to the 12, which at a hundred million operations per second is around three hours. Multiplying the input by 1000 multiplied the work by a million."

[[q]]
id = "cx-003"
qtype = "discrimination"
subtopic = "big-o"
levels = ["mid", "senior", "lead", "staff"]
q = "Average, worst and amortised complexity. Why does the distinction matter in production?"
a = "Because the case an attacker controls is the one you get. A hash lookup is O(1) average and O(n) worst under engineered collisions, which is a real denial-of-service technique. Amortised is different again - a dynamic array append is O(n) on resize but O(1) amortised, because resizes double capacity and become rare."

[[q]]
id = "cx-004"
qtype = "recall"
subtopic = "structure-choice"
levels = ["graduate", "mid"]
q = "You need to check repeatedly whether an item has been seen before. Which structure, and why?"
a = "A hash set. Membership is O(1) average, against O(n) for scanning a list. This is the single most common structure fix in real code - a linear scan inside a loop turns O(n squared) into O(n) with a few lines changed."

[[q]]
id = "cx-005"
qtype = "discrimination"
subtopic = "structure-choice"
levels = ["mid", "senior", "lead", "staff"]
q = "A hash map and a balanced tree map both store key-value pairs. When is the tree the right choice?"
a = "When you need order - range queries, sorted iteration, or nearest-key lookups. A hash map has no order at all, so answering all keys between A and M means scanning everything. You pay O(log n) instead of O(1) for the ordering."

[[q]]
id = "cx-006"
qtype = "recall"
subtopic = "hashing"
levels = ["graduate", "mid", "senior"]
q = "What is a hash collision and what happens when there are many?"
a = "Two keys mapping to the same bucket. A few are normal and handled by chaining or probing. Many degrade every operation towards O(n), because the structure becomes a list. Causes are a poor hash function, a high load factor, or input engineered to collide."

[[q]]
id = "cx-007"
qtype = "diagnostic"
subtopic = "hashing"
levels = ["mid", "senior", "lead", "staff"]
q = "An object is put into a hash map, then one of its fields is changed, and afterwards looking it up returns nothing even though it is clearly in the map. Why?"
a = "The field is part of the hash. Changing it changes the bucket the object should be in, but the object is still sitting in the old bucket, so the lookup searches the new bucket and finds nothing. Keys in a hash map must be immutable, and hashCode and equals must agree."

[[q]]
id = "cx-008"
qtype = "recall"
subtopic = "sorting-searching"
levels = ["graduate", "mid", "senior"]
q = "What does binary search require, and what does it cost you to get there?"
a = "Sorted input, and it gives O(log n). Getting there costs O(n log n) to sort, so sorting to do one search is slower than just scanning. Sorting to do many searches pays back after roughly log n searches."

[[q]]
id = "cx-009"
qtype = "recall"
subtopic = "sorting-searching"
levels = ["mid", "senior", "lead", "staff"]
q = "What is a stable sort and when do you need one?"
a = "One that preserves the relative order of elements that compare equal. You need it for multi-key sorting - sort by name, then by department, and within each department the names stay ordered. With an unstable sort the first sort is discarded."

[[q]]
id = "cx-010"
qtype = "judgment"
subtopic = "memory-locality"
levels = ["mid", "senior", "lead", "staff"]
q = "You are replacing an array with a linked list because insertion in the middle is O(1) rather than O(n). New information - the collection holds 200 items and is iterated constantly. More or less appropriate?"
a = "Much less, -2. At 200 items the asymptotic difference is irrelevant and the constant factors dominate. Array iteration is sequential and prefetched at roughly 1ns per element; following pointers costs a cache miss at around 100ns each. The array will win on both operations."

[[q]]
id = "cx-011"
qtype = "numeric"
subtopic = "memory-locality"
levels = ["senior", "lead", "staff"]
q = "Roughly how much slower is a main-memory access than an L1 cache hit, and why does that matter to a data structure choice?"
a = "About 100x - roughly 1ns against 100ns. It matters because big-O ignores exactly this factor, so a structure with worse asymptotics but contiguous memory often wins at practical sizes. The crossover is frequently in the thousands of elements, not at ten."

[[q]]
id = "cx-012"
qtype = "diagnostic"
subtopic = "structure-choice"
levels = ["graduate", "mid", "senior"]
q = "A page is fast in testing with 20 records and takes 40 seconds with 2000. The code loops over records and, for each one, searches a list of related items. What is the shape of the problem?"
a = "Nested iteration, so O(n squared) - 100x more records is 10,000x more work. Build a map from the related items keyed by whatever the inner search looks up, then each lookup is O(1) and the whole thing becomes O(n)."

[[q]]
id = "cx-013"
qtype = "discrimination"
subtopic = "big-o"
levels = ["graduate", "mid"]
q = "A colleague describes the same lookup as constant time in one sentence and linear in the next, and is right both times. What distinguishes the two claims, and which of them should you plan around when the keys arrive from strangers?"
a = "Average case against worst case. A hash lookup is O(1) on average and O(n) when everything collides in one bucket. Plan around the worst case when the input is attacker-controlled, because an attacker who can engineer colliding keys chooses which case you get. That is the algorithmic complexity attack, and randomised hash seeds are the mitigation."

[[q]]
id = "cx-014"
qtype = "discrimination"
subtopic = "structure-choice"
levels = ["graduate", "mid"]
q = "You hold a set of usernames and need to answer two questions: is this exact name taken, and which names begin with 'mar'. One structure answers the first instantly and cannot answer the second at all without reading everything. What property separates them?"
a = "Whether the structure maintains an order. A hash-based set scatters keys by hash, so it answers exact membership in O(1) average and has no notion of what is adjacent to a key, making a prefix query a full scan. A balanced tree or sorted map keeps keys in order, so membership costs O(log n) but a prefix or range query costs the same log to find the start and then a walk. Pay the log if you need ranges."

[[q]]
id = "cx-015"
qtype = "discrimination"
subtopic = "memory-locality"
levels = ["graduate", "mid"]
q = "Two collections hold the same values and the same number of them. Walking one end to end is dramatically faster than walking the other, and both walks visit every element exactly once. What accounts for the gap, and why does the notation not show it?"
a = "Memory layout. A contiguous array is prefetched by the CPU, so most accesses hit cache; a pointer-based structure scatters its nodes, so each step risks a cache miss costing around a hundred times a hit. Big-O deliberately drops constant factors, and this is a constant factor spanning two orders of magnitude. Both walks are O(n) and the notation is describing growth, not speed."

[[q]]
id = "cx-016"
qtype = "discrimination"
subtopic = "sorting-searching"
levels = ["graduate", "mid"]
q = "You sort a list of orders by customer, then sort that result by date, expecting orders to come out grouped by date and by customer within each date. With one sort implementation it works and with another the customer grouping is destroyed. What property decides it?"
a = "Stability. A stable sort preserves the relative order of elements that compare equal, so the earlier sort by customer survives inside each date. An unstable sort is free to reorder equal elements and throws that away. Multi-key sorting by sorting repeatedly only works on a stable sort, least significant key first."

[[q]]
id = "cx-017"
qtype = "judgment"
subtopic = "structure-choice"
levels = ["graduate", "mid"]
q = "A review comment asks you to replace a linear scan inside a loop with a set lookup, on the grounds that it turns quadratic work into linear. New information: the collection being scanned holds about a dozen items and is a fixed list of currency codes that has not changed in years. Does the change become more or less appropriate, and why?"
a = "Less, around -1. The asymptotic argument is correct and irrelevant at this size: a scan of a dozen contiguous items is a handful of cache-friendly comparisons, and building a set costs an allocation and hashing on every call. The crossover where hashing wins is usually in the hundreds. -2 overstates it, because the change is harmless rather than wrong, and a 0 misses that the fixed size is what removes the risk the comment is guarding against. Accepting it as written is how asymptotic reasoning gets applied to collections too small for it to mean anything."

[[q]]
id = "cx-018"
qtype = "numeric"
subtopic = "sorting-searching"
levels = ["mid", "senior", "lead", "staff"]
q = "A collection holds 1,000,000 items in no particular order. Answering a membership question by scanning costs one comparison per item; sorting first costs n log n and then each answer costs log n. Roughly how many questions must you expect to ask before sorting is the cheaper plan?"
a = "About 20, and the general result is that the break-even is roughly log n questions. Sorting costs 19,931,569 comparisons and each subsequent lookup costs about 20 against 1,000,000 for a scan, so the sort pays for itself after 20 lookups - which is why sorting to enable a single search is a loss and sorting to enable many is trivially worth it. The useful form to remember is the shape rather than the figure: the break-even barely moves as n grows, because both the sort cost and the scan cost scale with n."
derivation = [
  "n = 1000000",
  "log_n = log2(n)",
  "sort_cost = round(n * log_n)",
  "scan_cost = n",
  "sorted_lookup = round(log_n)",
  "break_even = round(n * log_n / (n - log_n))",
]

[[q]]
id = "cx-019"
qtype = "numeric"
subtopic = "memory-locality"
levels = ["senior", "lead", "staff"]
q = "A walk visits 10,000,000 elements. Laid out contiguously, essentially every access is a cache hit at about 1 ns. Following pointers, assume every access misses and costs about 100 ns. How long does each walk take, and what does the ratio say about an asymptotic argument between two O(n) options?"
a = "10 ms against 1,000 ms, a factor of 100. Both walks are O(n) and the notation is describing growth, so it is silent on a constant factor of 100 - which here is the difference between imperceptible and a visible stall. That is why an asymptotic argument cannot settle a choice between two structures in the same class, and why the practical rule is to prefer contiguous layouts until measurement gives you a reason not to. The crossover where a pointer-based structure wins on its better asymptotics is often in the thousands of elements, not at ten."
derivation = [
  "elements = 10000000",
  "hit_ns = 1",
  "miss_ns = 100",
  "contiguous_ms = elements * hit_ns / 1000000",
  "pointer_ms = elements * miss_ns / 1000000",
  "ratio = miss_ns / hit_ns",
]
