# Question bank: concurrency
topic = "concurrency"

[[q]]
id = "cc-001"
qtype = "discrimination"
subtopic = "processes-threads"
levels = ["graduate", "mid", "senior"]
q = "A process and a thread. What is the difference that matters?"
a = "Memory. Processes have separate memory, so they cannot corrupt each other and must copy data to communicate. Threads share memory, so communication is free - and any thread can modify any shared value at any moment, which is where every concurrency bug comes from."

[[q]]
id = "cc-002"
qtype = "discrimination"
subtopic = "processes-threads"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Concurrency and parallelism. Are they the same thing?"
a = "No. Concurrency is structuring work so tasks can progress independently - a design property. Parallelism is actually executing them at the same instant on multiple cores - a hardware outcome. A single-core machine can be highly concurrent and not parallel at all."

[[q]]
id = "cc-003"
qtype = "recall"
subtopic = "races-locks"
levels = ["graduate", "mid", "senior"]
q = "Why is count += 1 not safe from two threads?"
a = "Because it is three operations - load, add, store - and a thread can be suspended between any two. Both threads read 5, both add one, both write 6, and one increment is lost. It looks atomic in the source and is not."

[[q]]
id = "cc-004"
qtype = "recall"
subtopic = "races-locks"
levels = ["mid", "senior", "lead", "staff"]
q = "List the ways to make shared state safe, cheapest first."
a = "Do not share - immutable data or a per-thread copy removes the problem. Atomic operations for a single variable. A mutex for a general critical section. A read-write lock when reads vastly outnumber writes. Message passing, where one owner holds the data and others send it messages. The first option is always the best one available."

[[q]]
id = "cc-005"
qtype = "judgment"
subtopic = "races-locks"
levels = ["mid", "senior", "lead", "staff"]
q = "You are adding a lock around a shared counter to fix a race. New information - the counter is incremented on every request across 64 threads. More or less appropriate?"
a = "Correct but costly, so about 0. The lock fixes the race and becomes a serialisation point that every request queues on. An atomic increment does the same job without the scheduler involvement, and a per-thread counter summed on read removes contention entirely."

[[q]]
id = "cc-006"
qtype = "recall"
subtopic = "deadlock"
levels = ["mid", "senior", "lead", "staff"]
q = "What is a deadlock and what is the simplest reliable prevention?"
a = "Two threads each holding a lock the other needs, so neither proceeds. The simplest reliable prevention is a global lock ordering - if every thread acquires locks in the same order, a cycle cannot form. Second best is a timeout on acquisition, which turns a hang into an error you can retry."

[[q]]
id = "cc-007"
qtype = "discrimination"
subtopic = "deadlock"
levels = ["senior", "lead", "staff"]
q = "Deadlock, livelock and starvation. How do they look different from outside?"
a = "Deadlock - everything stops and CPU is idle. Livelock - everything is busy and nothing completes, because threads keep reacting to each other. Starvation - most work completes and one participant never gets a turn. All three look like it is stuck, and they need different fixes."

[[q]]
id = "cc-008"
qtype = "diagnostic"
subtopic = "deadlock"
levels = ["mid", "senior", "lead", "staff"]
q = "A service works fine in testing and hangs occasionally under production load. Restarting fixes it for a while. What class of bug should you suspect?"
a = "A deadlock or lock contention. It needs a specific interleaving that only concurrent load produces, which is exactly what testing lacks. Take a thread dump while it is hung - that shows which threads hold which locks and usually names the cycle immediately."

[[q]]
id = "cc-009"
qtype = "recall"
subtopic = "async-io"
levels = ["mid", "senior", "lead", "staff"]
q = "What does async I/O actually buy you, and what does it not?"
a = "It removes the memory and context-switch cost of one thread per waiting operation, so one thread can manage thousands of in-flight I/Os. It does not make anything compute faster - CPU-bound work is exactly as slow, and worse, it blocks the loop and stalls every other request."

[[q]]
id = "cc-010"
qtype = "judgment"
subtopic = "async-io"
levels = ["mid", "senior", "lead", "staff"]
q = "You are moving an image-resizing service to an async framework for throughput. More or less appropriate?"
a = "Less, -2. Resizing is CPU-bound, and async helps only with waiting. One resize blocks the event loop and stalls every other request on it, so latency gets worse rather than better. Use a process or thread pool sized to your cores, and keep async for the I/O around it."

[[q]]
id = "cc-011"
qtype = "recall"
subtopic = "atomicity"
levels = ["mid", "senior", "lead", "staff"]
q = "Name three things people assume are atomic and are not."
a = "Check-then-act - if not exists, create - which races between the two steps. Appending to a shared collection. Any sequence of two individually atomic operations, because the gap between them is where another thread runs. Reading a 64-bit value on a 32-bit platform is a fourth."

[[q]]
id = "cc-012"
qtype = "recall"
subtopic = "atomicity"
levels = ["senior", "lead", "staff"]
q = "How do you replace a file's contents safely with no locks?"
a = "Write to a temporary file in the same directory, fsync it, then rename it over the target. Rename within a filesystem is atomic, so any reader sees either the whole old file or the whole new one and never a partial write. Same directory matters, because rename across filesystems is not atomic."

[[q]]
id = "cc-013"
qtype = "discrimination"
subtopic = "processes-threads"
levels = ["graduate", "mid"]
q = "A colleague says the service is not concurrent because the machine has one core. What is being conflated, and which of the two does a single core actually rule out?"
a = "Concurrency with parallelism. Concurrency is structuring work so tasks can progress independently, which is a design property and entirely possible on one core: the tasks interleave, and while one waits on I/O another runs. Parallelism is tasks literally executing at the same instant, which needs more than one core. A single-core machine can be highly concurrent and cannot be parallel, and a single-threaded event loop serving tens of thousands of connections is the everyday proof."

[[q]]
id = "cc-014"
qtype = "discrimination"
subtopic = "races-locks"
levels = ["graduate", "mid"]
q = "Two remedies for a shared counter that keeps losing increments: one makes the increment indivisible in hardware, the other stops other threads entering the surrounding code at all. What is the axis, and when does the cheaper one stop being enough?"
a = "How much is protected. An atomic operation covers exactly one variable and costs close to nothing; a mutex covers whatever region you put it around and costs contention. The atomic stops being enough as soon as correctness spans more than one variable, or spans a read followed by a decision followed by a write. Checking a balance and then deducting from it cannot be made correct by two atomics, because another thread can interleave between them. Cheaper still than either is not sharing the value at all."

[[q]]
id = "cc-015"
qtype = "discrimination"
subtopic = "deadlock"
levels = ["graduate", "mid"]
q = "Two failures look identical from outside: the work never finishes. In one, every thread is blocked and the CPU is idle. In the other, threads are busy and no work completes. What are these called, and what distinguishes their causes?"
a = "Deadlock and livelock. Deadlock is threads blocked waiting on locks each other holds, so nothing runs and the CPU shows nothing happening; it needs a circular wait, which consistent lock ordering prevents. Livelock is threads actively responding to each other, changing state, retrying and yielding without progressing, so the CPU looks busy. Starvation is a third case worth separating: work does progress, but one thread never gets a turn."

[[q]]
id = "cc-016"
qtype = "judgment"
subtopic = "async-io"
levels = ["graduate", "mid"]
q = "A service spends nearly all its time waiting on a database, and the team is rewriting it on an event loop to raise the number of concurrent requests it can hold. New information: each request also resizes an uploaded image, in-process and synchronously. Does the rewrite become more or less likely to deliver what they want?"
a = "Much less, -2, unless the image work moves. An event loop wins by removing the memory and context-switch cost of a thread per waiting request, and it makes nothing compute faster. A synchronous CPU-bound call on the loop blocks every other request on that loop, so the resize serialises the whole service and the concurrency they bought disappears under load. Push the resize to a thread pool, a process pool or a separate worker, and the original reasoning holds again."

[[q]]
id = "cc-017"
qtype = "judgment"
subtopic = "atomicity"
levels = ["graduate", "mid"]
q = "A counter guarded by a mutex is showing up in a profile as a contention point, and someone proposes swapping the mutex for an atomic increment. New information: the code inside the lock reads the counter, and if it is below a limit, increments it. Does the swap become more or less appropriate?"
a = "Less, -2. The lock is not protecting an increment, it is protecting a read, a decision and a write, and an atomic increment cannot express that. Replacing it lets two threads both read a value under the limit and both increment past it, which is the original race with the lock removed. A compare-and-swap loop expresses check-then-set correctly and is the atomic primitive that fits; a plain atomic increment does not."
