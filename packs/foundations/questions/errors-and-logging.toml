# Question bank: errors-and-logging
topic = "errors-and-logging"

[[q]]
id = "er-001"
qtype = "recall"
subtopic = "error-handling"
levels = ["graduate", "mid", "senior"]
q = "What is the first question to ask when deciding how to handle an error?"
a = "Can this code do anything useful about it. If yes, handle it here. If no, let it propagate to a caller who can, adding context on the way. Catching something you cannot act on just hides it."

[[q]]
id = "er-002"
qtype = "judgment"
subtopic = "error-handling"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "A catch block is empty with a comment saying this should never happen. More or less acceptable?"
a = "Not acceptable, -2. If it never happens, the block costs nothing to log. If it does happen, you have destroyed the only evidence and converted a loud failure into a quiet wrong answer. Empty catch blocks are where the hardest production bugs come from."

[[q]]
id = "er-003"
qtype = "discrimination"
subtopic = "error-handling"
levels = ["mid", "senior", "lead", "staff"]
q = "An expected condition and a bug. Why handle them differently?"
a = "An expected condition - invalid email, record not found, remote rate limit - is part of your design and deserves a modelled outcome and a useful message. A bug - a null where the type says non-null - should fail loudly and fast, because a bug handled gracefully is a bug that ships and corrupts data quietly."

[[q]]
id = "er-004"
qtype = "recall"
subtopic = "error-handling"
levels = ["mid", "senior", "lead", "staff"]
q = "What is lost when you wrap an exception without chaining the original?"
a = "The stack trace that names the actual failing line, and the original type and message. You are left with your own wrapper pointing at the wrapping code, which tells you where you caught it, not where it broke."

[[q]]
id = "er-005"
qtype = "discrimination"
subtopic = "exceptions-vs-results"
levels = ["mid", "senior", "lead", "staff"]
q = "Exceptions and result types. What does each get right?"
a = "Exceptions keep the happy path clean and readable, at the cost of failure being invisible in the signature so callers do not know it can happen. Result types put failure in the type so the compiler forces you to handle it, at the cost of noise at every call site. Neither is universally right; consistency within a codebase is."

[[q]]
id = "er-006"
qtype = "recall"
subtopic = "exceptions-vs-results"
levels = ["senior", "lead", "staff"]
q = "Three audiences see an error. What does each need?"
a = "The user needs a message they can act on and no stack trace. The developer needs the stack, the type, and the inputs. Support needs a correlation id linking the user's report to the developer's log line. Giving any of them the wrong one is a real cost."

[[q]]
id = "er-007"
qtype = "recall"
subtopic = "log-levels"
levels = ["graduate", "mid", "senior"]
q = "What is the test for whether something should be logged at ERROR?"
a = "Would you want to be told about it. If nobody would act on it, it is not an error. Level inflation - everything logged as ERROR because it felt important - is why the error log stops being read, and then the real one is missed."

[[q]]
id = "er-008"
qtype = "discrimination"
subtopic = "log-levels"
levels = ["mid", "senior", "lead", "staff"]
q = "WARN and ERROR. Where is the line?"
a = "WARN means something was wrong and the code handled it - a retry succeeded, a fallback was used. ERROR means something failed and needs attention. The practical test is whether the outcome was still correct: if it was, it is a WARN."

[[q]]
id = "er-009"
qtype = "recall"
subtopic = "structured-logs"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Why log key-value pairs instead of a sentence?"
a = "Because structured logs can be filtered, grouped, counted and graphed, so you can answer questions you did not anticipate. A prose message can only be grepped, and the grep breaks the moment someone rewords it."

[[q]]
id = "er-010"
qtype = "recall"
subtopic = "structured-logs"
levels = ["mid", "senior", "lead", "staff"]
q = "What should every log line carry, and where should it be attached?"
a = "A correlation or trace id, the identifiers needed to find the affected record, a duration for anything that took time, and the outcome. Attach them once at the request boundary rather than threading them through every function."

[[q]]
id = "er-011"
qtype = "judgment"
subtopic = "structured-logs"
levels = ["mid", "senior", "lead", "staff"]
q = "An exception is logged at each level as it propagates, so no context is lost. More or less appropriate?"
a = "Less, -2. You get five log lines describing one event, error counts become meaningless, and the noise buries the useful line. Log once, where the decision about what to do is made, and add context by chaining the exception rather than by logging again."

[[q]]
id = "er-012"
qtype = "recall"
subtopic = "what-not-to-log"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Name five things that must never appear in a log."
a = "Passwords, tokens and API keys, session ids, full card numbers, and national or health identifiers. Logs are copied, shipped to third parties, retained for years and read by more people than you expect, so treat them as semi-public."

[[q]]
id = "er-013"
qtype = "diagnostic"
subtopic = "what-not-to-log"
levels = ["senior", "lead", "staff"]
q = "You redact secrets carefully, and an audit still finds tokens in the logs. Where did they come from?"
a = "Exception messages and stack traces. An error raised while parsing or validating often includes the offending input verbatim, which is exactly the data you were careful not to log. Sanitise error messages at the boundary, not just the fields you log deliberately."

[[q]]
id = "er-014"
qtype = "discrimination"
subtopic = "error-handling"
levels = ["graduate", "mid"]
q = "A record not being found and a value being null where the type says it cannot be are both handled the same way in a codebase: caught, logged, and execution continues. One of these deserves that treatment and one does not. Which, and what is the axis?"
a = "Whether it is an expected condition or a bug. A missing record is part of the design: it happens in normal operation, the caller can do something sensible about it, and it deserves a modelled outcome. A null where the type forbids one is a programming error, and handling it gracefully means the bug ships and produces a quiet wrong answer instead of a loud stop. Expected conditions get handled; bugs should fail fast and loudly. Catching broadly enough to cover both is what erases the distinction."

[[q]]
id = "er-015"
qtype = "discrimination"
subtopic = "exceptions-vs-results"
levels = ["graduate", "mid"]
q = "Two ways of signalling that a function can fail. With one, a caller who ignores the possibility still compiles; with the other they cannot. What does each buy, and what is the cost of the safer one?"
a = "Exceptions keep failure out of the signature: the happy path reads cleanly, and nothing forces a caller to know failure is possible or to handle it, so uncaught paths are easy to leave behind. A result type puts failure in the return type, so the compiler makes every caller confront it and nobody forgets. The cost is noise at every call site, and composing several fallible calls needs language support to stay readable. Neither is universally right; being inconsistent within one codebase is what is actually wrong."

[[q]]
id = "er-016"
qtype = "discrimination"
subtopic = "what-not-to-log"
levels = ["graduate", "mid"]
q = "A request fails and three audiences need something from it: the person who hit the error, the engineer who will fix it, and whoever answers the support call. What does each need, and which of the three things must never reach the first audience?"
a = "The user needs a message describing what to do next. The engineer needs the stack trace and the inputs that produced it, in the logs. Support needs a correlation id that ties the user's report to that log entry. The stack must never reach the user: it discloses internals useful to an attacker and is meaningless to them anyway. The correlation id is what lets you show the user nothing sensitive and still find the exact failure."

[[q]]
id = "er-017"
qtype = "judgment"
subtopic = "log-levels"
levels = ["graduate", "mid"]
q = "A noisy service is quietened by raising the log level in production so that informational lines are dropped. New information: the request handler logs the inbound request's parameters at that informational level, and nothing else records them. Does raising the level become more or less appropriate?"
a = "Less, around -1, and the remedy is not to leave the level down. Levels exist so volume can be reduced without losing the important lines, and this configuration has made an important line unimportant: the next production bug arrives with no record of what was asked for. Move the parameters to the error path, or log them structurally at a level that survives, then raise the level. Turning the volume down while the evidence lives in the discarded band is what makes an incident unreconstructable."

[[q]]
id = "er-018"
qtype = "judgment"
subtopic = "error-handling"
levels = ["graduate", "mid"]
q = "A catch-all handler wraps the body of a request handler, converting anything thrown into a 500 and logging it. A reviewer objects that catching everything is a known anti-pattern. New information: this is the outermost frame of the request, and without it an exception reaches the web server and returns a blank response with no log line. Does the catch-all become more or less defensible?"
a = "More, +2. The anti-pattern is catching broadly in the middle of a call chain, where it swallows failures a caller could have handled and turns a bug into a wrong answer. At the top of a request or job there has to be a boundary that catches everything, because the alternative is an unlogged failure and an empty response. That boundary is the one place a bare catch-all belongs, and what makes it correct rather than lazy is that it logs with the cause chained and does not continue as though the work succeeded."

[[q]]
id = "er-019"
qtype = "judgment"
subtopic = "exceptions-vs-results"
levels = ["graduate", "mid"]
q = "A lookup throws an exception when the record is absent, and the caller catches it and substitutes a default. New information: the record is absent on most calls. More or less appropriate?"
a = "Less, -2. Absence is now the ordinary case, and an exception is a claim that something went wrong, so the code is using an error mechanism for a normal branch. Three costs follow: throwing and unwinding is far more expensive than returning on the common path, the logs and any error metric now count a routine outcome as a failure, and the reader is misled about which path is normal. Model the absence in the return type instead - an optional or a result - so the caller has to consider the miss and the code says which case is expected. Keep the exception for the case the caller cannot do anything sensible about."

[[q]]
id = "er-020"
qtype = "diagnostic"
subtopic = "structured-logs"
levels = ["graduate", "mid"]
q = "An incident review needs to know how many payments failed with a timeout last week. The logs contain that information as English sentences, and three people asking the same question get three different counts. Why?"
a = "Because a sentence can only be counted by matching text, and the text is not stable: the wording changed with a release, so a search for one phrase misses the other, and any word that appears in more than one message over-counts. On top of that, an exception logged at each level as it propagates writes several lines for one failure, so the count depends on which line the search happened to match. Log key-value pairs instead - an event name, an outcome, an error kind, an identifier and a trace id - and the answer becomes a filter and a count rather than an argument. Log once, at the point where the decision about the failure is made."

[[q]]
id = "er-021"
qtype = "judgment"
subtopic = "log-levels"
levels = ["lead", "staff"]
q = "A team wants an alert on the rate of ERROR lines from their services. New information: a review of a day's errors finds that most are retries that subsequently succeeded. More or less useful an alert, and what would you change first?"
a = "Less as it stands, around -1: the alert would fire on a healthy service and be tuned until it fires on nothing, which is how a team ends up with an alert that has never caught anything. What the review has actually found is level inflation, and that is what to fix first. The test for the level is whether someone would act: a retry that succeeded is at most a signal worth counting, so it belongs at WARN or, better, as a metric with a name rather than a log line. Then an ERROR means something failed that nobody recovered, and its rate is worth waking someone for. As a lead the durable part is the convention and its enforcement - the test stated in the logging guidance, applied in review, and a periodic look at what the error log actually contains, because inflation returns one well-intentioned line at a time."
