# Question bank: http-and-web
topic = "http-and-web"

[[q]]
id = "ht-001"
qtype = "recall"
subtopic = "request-response"
levels = ["graduate", "mid"]
q = "HTTP is stateless. What does that actually mean, and how does being logged in work anyway?"
a = "The server remembers nothing between requests - each one is understood entirely on its own. Being logged in works because the client sends something every time, usually a cookie holding a session id or a token, and the server reconstructs who you are from that."

[[q]]
id = "ht-002"
qtype = "numeric"
subtopic = "request-response"
levels = ["mid", "senior", "lead", "staff"]
q = "How many round trips before the first byte of application data on a fresh HTTPS connection, and on a reused one?"
a = "Two to three on a fresh one - one for TCP, one or two for TLS depending on version. Zero on a reused connection. That is why connection reuse and keep-alive matter far more than most server-side tuning for a client on a slow network."

[[q]]
id = "ht-003"
qtype = "discrimination"
subtopic = "methods-status"
levels = ["graduate", "mid", "senior"]
q = "Safe and idempotent. What does each mean and why do the labels matter?"
a = "Safe means it does not change state - GET, HEAD. Idempotent means doing it twice has the same effect as once - GET, PUT, DELETE. They matter because browsers, proxies, caches and retry libraries act on them: a GET can be prefetched, cached or retried automatically, so a state change behind a GET can happen without anyone clicking anything."

[[q]]
id = "ht-004"
qtype = "discrimination"
subtopic = "methods-status"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "401 and 403. What is the difference and what does each tell the client to do?"
a = "401 means not authenticated - get credentials and try again. 403 means authenticated and still not allowed - retrying with the same identity will never work. Returning 401 for an authorisation failure sends clients into a pointless re-login loop."

[[q]]
id = "ht-005"
qtype = "judgment"
subtopic = "methods-status"
levels = ["mid", "senior", "lead", "staff"]
q = "You are implementing delete-an-item as a GET so it can be a plain link. More or less appropriate?"
a = "Not appropriate, -2. GET is defined as safe, so browsers prefetch links, crawlers follow them, and proxies may repeat them. Someone's link preview or a search crawler will delete data. Use POST or DELETE with a confirmation."

[[q]]
id = "ht-006"
qtype = "recall"
subtopic = "headers-caching"
levels = ["mid", "senior", "lead", "staff"]
q = "What does an ETag do, and what does it not save you?"
a = "The server sends a version tag, the client sends it back with If-None-Match, and an unchanged resource gets a 304 with no body. It saves the bandwidth of re-sending the body. It does not save the round trip - you still asked and waited."

[[q]]
id = "ht-007"
qtype = "diagnostic"
subtopic = "headers-caching"
levels = ["senior", "lead", "staff"]
q = "You add a CDN in front of a site whose pages are identical for everyone, and the hit rate is nearly zero. What do you check?"
a = "The Vary header and Set-Cookie. Vary: Cookie makes each distinct cookie value a separate cache entry, so any per-user cookie - including an analytics one set on the response - collapses the hit rate to nothing."

[[q]]
id = "ht-008"
qtype = "recall"
subtopic = "cookies-sessions"
levels = ["graduate", "mid", "senior"]
q = "Name the three cookie flags that matter for security and what each stops."
a = "HttpOnly - JavaScript cannot read it, so cross-site scripting cannot steal the session. Secure - only sent over HTTPS, so it is not exposed on a plain connection. SameSite - not sent on cross-site requests, which blunts cross-site request forgery."

[[q]]
id = "ht-009"
qtype = "discrimination"
subtopic = "cookies-sessions"
levels = ["mid", "senior", "lead", "staff"]
q = "A server-side session versus a signed token in the cookie. What do you trade?"
a = "A server-side session id means the state lives with you, so revocation is immediate and you pay a lookup per request. A signed token carries the state, so the server stores nothing and scales trivially - and revocation becomes hard, because a valid token stays valid until it expires. You then need short expiry plus refresh, or a deny-list that reintroduces the lookup."

[[q]]
id = "ht-010"
qtype = "recall"
subtopic = "cors-origins"
levels = ["graduate", "mid", "senior"]
q = "What is the same-origin policy for, and what counts as a different origin?"
a = "It stops a page on one site reading responses from another, which matters because the browser attaches your cookies automatically - without it any site could read your email by asking for it. An origin is scheme plus host plus port, so http and https differ, and so do two ports on the same host."

[[q]]
id = "ht-011"
qtype = "judgment"
subtopic = "cors-origins"
levels = ["mid", "senior", "lead", "staff"]
q = "Someone says CORS protects your API from unauthorised callers. More or less accurate?"
a = "Inaccurate, -2. CORS is a browser rule - it stops other websites reading your responses in a user's browser. A server, a script or curl ignores it entirely. It protects your users from other sites, not your API from attackers. Authentication and authorisation do that."

[[q]]
id = "ht-012"
qtype = "diagnostic"
subtopic = "cors-origins"
levels = ["mid", "senior", "lead", "staff"]
q = "A browser reports a CORS error on a POST with a JSON body, but the same request works from curl. What is likely happening?"
a = "The preflight is failing. A POST with a JSON content type is not a simple request, so the browser sends an OPTIONS request first and only proceeds if the response permits the origin, method and headers. curl sends no preflight, so it never sees the problem. Handle OPTIONS and return the right Allow headers."

[[q]]
id = "ht-013"
qtype = "discrimination"
subtopic = "headers-caching"
levels = ["graduate", "mid"]
q = "A page showing someone's account balance is served with a directive whose name reads as though it prevents caching, and the browser writes a copy to disk anyway. A different directive would have prevented that. What separates the two, and which one did they want?"
a = "Whether a copy may be stored at all, against whether a stored copy may be used without checking. `no-cache` permits storing and requires revalidation before reuse. `no-store` forbids keeping it. For a balance on a shared machine they wanted `no-store`, because `no-cache` leaves the response on disk where the next person can find it. `private` is a third axis again: it permits storing, but only by the browser and never by a shared cache."

[[q]]
id = "ht-014"
qtype = "discrimination"
subtopic = "cookies-sessions"
levels = ["graduate", "mid"]
q = "Two ways of keeping someone logged in. One lets you throw them out instantly and costs a lookup on every single request; the other costs nothing per request and leaves you unable to throw them out at all. What is the axis, and which way does each design fall?"
a = "Where the state lives. An opaque session id in the cookie keeps the real state on the server, so revocation is a delete and every request pays a lookup. A signed token carries the state in the request itself, so the server stores nothing and validates by signature, which means a valid token stays valid until it expires no matter what you do. Revocation is the price of statelessness, bought back with short expiry plus refresh, or a deny-list that reintroduces the lookup you were avoiding."

[[q]]
id = "ht-015"
qtype = "discrimination"
subtopic = "cors-origins"
levels = ["graduate", "mid"]
q = "A colleague argues the API needs no authorisation checks on a sensitive endpoint, because the browser rule already blocks any request that does not come from your own domain. What is being confused with what, and what is that rule actually protecting?"
a = "A browser-enforced restriction is being read as an access control. The same-origin policy and CORS are rules a browser applies to script running in a page; curl, a server, a proxy and a script ignore them entirely. What it protects is your users from other websites reading their data, because the browser attaches their cookies automatically. It protects nothing about your API from anyone who is not using a browser, so the authorisation check is still the only thing standing there."

[[q]]
id = "ht-016"
qtype = "judgment"
subtopic = "methods-status"
levels = ["graduate", "mid"]
q = "Cancelling a subscription is wired to an ordinary link, so clicking it issues a GET. New information: the team has turned on a browser feature that fetches links when the pointer hovers over them. Does GET become more or less appropriate here, and what is the mechanism?"
a = "Far less, -2. GET is defined as safe, meaning it does not change state, and everything in the chain acts on that: prefetchers, proxies, caches and retry logic will all issue it without a user deciding to. Hovering now cancels subscriptions. The property was already violated before the prefetcher existed; the new information only made the consequence visible. A state change belongs behind POST, or DELETE if you want the idempotence."

[[q]]
id = "ht-017"
qtype = "judgment"
subtopic = "headers-caching"
levels = ["graduate", "mid"]
q = "A profile page is served with a directive that lets any shared cache keep it and hand it to anyone who asks for the same URL. New information: the page greets the visitor by name, resolved from their session cookie. More or less appropriate?"
a = "Less, -2, and it is a data leak rather than a performance question. A shared cache keyed on the URL alone will serve the first person's greeting to the second. The fix is `private`, so only the visitor's own browser stores it. `Vary: Cookie` makes the cache key correct in principle, but on a site where everyone carries a distinct cookie it drops the shared hit rate to nothing, so it buys correctness and no caching."

[[q]]
id = "ht-018"
qtype = "judgment"
subtopic = "request-response"
levels = ["graduate", "mid"]
q = "A mobile client opens a fresh HTTPS connection for each of the several small requests it makes on startup, and someone proposes optimising the server's handler to shave time off each one. New information: the client and the server are on different continents. Does tuning the handler become more or less appropriate?"
a = "Less, -2 or -1. A fresh HTTPS connection spends two to three round trips on TCP and TLS before any of your data moves, and a cross-continent round trip is on the order of a hundred milliseconds. The startup cost is dominated by connection setup and distance, neither of which the handler touches. Reuse the connection with keep-alive, or multiplex over HTTP/2, and the several setups collapse to one. Handler time is worth attention once it is a visible share of the total."

[[q]]
id = "ht-019"
qtype = "diagnostic"
subtopic = "cookies-sessions"
levels = ["graduate", "mid"]
q = "Users report being logged out at random. It happens more often at busy times, never in testing, and the affected users were doing nothing unusual. The login flow itself works. Most likely cause?"
a = "Session state held somewhere that is not shared across the servers answering requests - typically in each instance's memory. A user's cookie is fine; it arrives at an instance that has never seen that session, so the lookup misses and they appear logged out. It correlates with traffic because more instances are running and requests spread further, and it never reproduces in testing because there is one instance there. Move session state to a shared store, or make the session self-contained in a signed token, and the request no longer cares which instance answers."

[[q]]
id = "ht-020"
qtype = "discrimination"
subtopic = "request-response"
levels = ["senior", "lead", "staff"]
q = "Keep-alive on HTTP/1.1, multiplexing on HTTP/2, and QUIC under HTTP/3. What does each remove, and what does none of them remove?"
a = "Keep-alive removes the connection setup from every request after the first, which is the largest single win because a fresh secure connection costs several round trips before any application data moves. Multiplexing removes the queue at the application layer: many requests share one connection instead of waiting for a free one, so a slow response no longer blocks the ones behind it in the client's own pipeline. QUIC removes the queue at the transport layer, where a single lost packet on a shared TCP connection stalls every stream on it until the retransmission arrives, and it folds the transport and cryptographic handshakes together. What none of them touches is the propagation delay: a request to another continent takes what the distance takes, however few round trips are left, which is why the remaining wins are about moving the endpoint closer rather than about the protocol."

[[q]]
id = "ht-021"
qtype = "judgment"
subtopic = "cookies-sessions"
levels = ["lead", "staff"]
q = "A team is standardising every service on a signed token carried in a cookie, so no service needs a session lookup. More or less appropriate, and what has to be decided at the same time?"
a = "Around 0: the property being bought is real and the thing being given up is revocation, which is not a detail. A signed token is valid until it expires, so logout, a password change, a disabled account and a compromised token are all questions the design has no answer to yet. Decide these together with the standard, or each service invents its own: a short expiry with a refresh mechanism, so the window is bounded; a deny-list for the cases that must take effect now, accepting that it reintroduces a lookup for exactly those; and a signing key rotation procedure, including what happens to tokens signed with the retired key. Then make the cookie's flags and the verification a shared library rather than a page of documentation, because the failure that matters is one service accepting an unverified token, and that is a thing a library can make impossible."
