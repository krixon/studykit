# Question bank: processes-and-os
topic = "processes-and-os"

[[q]]
id = "os-001"
qtype = "recall"
subtopic = "process-model"
levels = ["graduate", "mid", "senior"]
q = "Why do stdout and stderr exist as separate streams?"
a = "So program output can be piped while diagnostics still reach the terminal. Output goes to stdout, diagnostics to stderr. Logging to stdout breaks anything downstream that parses your output, which is why yourprog | jq fails when someone adds a helpful log line."

[[q]]
id = "os-002"
qtype = "recall"
subtopic = "process-model"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "What does an exit code of 0 mean, and who cares?"
a = "Success; anything else is failure. Shells, CI pipelines, container orchestrators and && all branch on it, so a program that exits 0 after failing silently breaks every piece of automation around it."

[[q]]
id = "os-003"
qtype = "discrimination"
subtopic = "process-model"
levels = ["mid", "senior", "lead", "staff"]
q = "How is a container different from a process, really?"
a = "It is a process, with namespaced views of the filesystem, network and process table plus cgroup resource limits. Nothing about scheduling, memory or signals changes. The one genuine difference is that your process may be PID 1, which does not get default signal handlers and is expected to reap orphans."

[[q]]
id = "os-004"
qtype = "diagnostic"
subtopic = "memory"
levels = ["mid", "senior", "lead", "staff"]
q = "A service disappears with no error in its logs and no stack trace. The container restarts. What do you check?"
a = "The exit code and the kernel log. 137 is 128 plus 9, killed by SIGKILL, which for a container almost always means the OOM killer or the cgroup memory limit. There is no log line because the process was not asked to stop, it was terminated."

[[q]]
id = "os-005"
qtype = "discrimination"
subtopic = "memory"
levels = ["senior", "lead", "staff"]
q = "Resident set size and virtual size. Which one gets you killed?"
a = "RSS. It is the physical memory actually in use and is what the OOM killer and cgroup limits act on. Virtual size is address space reserved, is often enormous for reasons that do not matter, and alarms people unnecessarily."

[[q]]
id = "os-006"
qtype = "judgment"
subtopic = "memory"
levels = ["senior", "lead", "staff"]
q = "You are adding swap to a server so it stops running out of memory. More or less appropriate?"
a = "Usually less, -1 to -2 for a latency-sensitive service. Swap converts a memory shortage into a latency catastrophe - a page fault to disk is around a hundred thousand times slower than RAM, so the service stays alive and stops meeting any latency target. Failing fast is generally better than swapping; fix the leak or raise the limit."

[[q]]
id = "os-007"
qtype = "diagnostic"
subtopic = "files-descriptors"
levels = ["mid", "senior", "lead", "staff"]
q = "A server starts failing to accept connections after several hours, with errors about too many open files. What is happening?"
a = "File descriptor exhaustion - descriptors opened and not closed on some path, usually an error path. The default per-process limit is often 1024, which is very low for a server. The error surfaces far from the leak, because it appears when the next open happens rather than where the leak is."

[[q]]
id = "os-008"
qtype = "recall"
subtopic = "files-descriptors"
levels = ["graduate", "mid", "senior"]
q = "Why are a crashed program's last log lines often missing?"
a = "Output is buffered and had not been flushed when the process died. Line-buffer or explicitly flush anything you need to survive a crash - which is exactly the logs you most want after one."

[[q]]
id = "os-009"
qtype = "recall"
subtopic = "signals-shutdown"
levels = ["mid", "senior", "lead", "staff"]
q = "SIGTERM and SIGKILL. Which matters to your code and why?"
a = "SIGTERM, because it is catchable and is what an orchestrator sends first - it is your chance to shut down cleanly. SIGKILL cannot be caught and gives you nothing, and arrives when the grace period expires, typically 30 seconds later."

[[q]]
id = "os-010"
qtype = "recall"
subtopic = "signals-shutdown"
levels = ["mid", "senior", "lead", "staff"]
q = "List the steps of a graceful shutdown."
a = "Catch SIGTERM. Fail the readiness check so the load balancer stops sending new traffic. Stop accepting new work. Finish in-flight requests up to a deadline shorter than the orchestrator's grace period. Close connections and flush buffers. Exit 0. Without this, every deploy drops the requests in flight."

[[q]]
id = "os-011"
qtype = "diagnostic"
subtopic = "signals-shutdown"
levels = ["senior", "lead", "staff"]
q = "Your app handles SIGTERM correctly, and in the container it is still killed hard on every deploy. Why?"
a = "The signal is not reaching it. If the entrypoint is a shell script, the shell is PID 1 and does not forward SIGTERM to its child, so your handler never runs and SIGKILL arrives 30 seconds later. Use exec in the script, or a minimal init as PID 1."

[[q]]
id = "os-012"
qtype = "recall"
subtopic = "environment-config"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Why does configuration come from the environment rather than being built into the artefact?"
a = "So the same artefact runs in every environment. Same image, different config, is what makes promoting a build from staging to production meaningful - otherwise the thing you tested is not the thing you shipped."

[[q]]
id = "os-013"
qtype = "recall"
subtopic = "environment-config"
levels = ["mid", "senior", "lead", "staff"]
q = "What should happen at startup if a required configuration value is missing?"
a = "The process should exit immediately with a message naming the missing key. Failing fast at startup turns a mystery null three hours later on an uncommon path into an obvious error before any traffic arrives. Log the effective configuration too, with secrets redacted."

[[q]]
id = "os-014"
qtype = "discrimination"
subtopic = "memory"
levels = ["graduate", "mid"]
q = "A monitoring dashboard shows one figure for a process's memory in the tens of gigabytes and another in the hundreds of megabytes. Both are correct. Which of them decides whether the process gets killed, and why is the other so large?"
a = "The resident set size, the smaller figure, is physical memory actually in use and is what the OOM killer and a container's cgroup limit measure. The virtual size is address space the process has reserved, which includes mappings never touched, memory-mapped files and large allocations not yet paged in, so it is routinely enormous and means almost nothing about pressure. Alerting on virtual size produces noise; alerting on resident set size predicts the kill."

[[q]]
id = "os-015"
qtype = "discrimination"
subtopic = "process-model"
levels = ["graduate", "mid"]
q = "A command's output is piped into another tool, and the diagnostic messages appear on the terminal rather than in the pipe. A colleague calls this a bug. Which stream is which, and what breaks if the diagnostics are moved into the pipe?"
a = "Program output goes to stdout, which is what the pipe captures; diagnostics go to stderr, which is why they reach the terminal instead. That is the design and not a bug. Moving diagnostics to stdout corrupts the data the next tool is parsing, so a log line lands in the middle of the JSON and the consumer fails. The separation is what lets the same command be both readable by a person and consumable by a program."

[[q]]
id = "os-016"
qtype = "discrimination"
subtopic = "files-descriptors"
levels = ["graduate", "mid"]
q = "A service starts failing to accept new connections and to open files, reporting the same error for both. The code that leaks is nowhere near either symptom. What is being exhausted, and why does the error appear so far from its cause?"
a = "The per-process file descriptor limit. Sockets, pipes and files all consume descriptors from one small pool, so a leak in any of them starves all of the others, and whatever tries to open something next is what fails - which is usually innocent code. The leak is almost always a descriptor not closed on an error path, so the remedy is a scope-bound construct that closes regardless of how the block exits, plus raising a default limit that is far too low for a server."

[[q]]
id = "os-017"
qtype = "judgment"
subtopic = "signals-shutdown"
levels = ["graduate", "mid"]
q = "A container image runs the service through a small shell script as its entry point, which works fine in testing. New information: deploys are taking the full grace period and in-flight requests are being dropped at the end of it. Does the shell script remain a reasonable entry point?"
a = "No, -2, and the symptom names the mechanism. The script is PID 1, which does not get default signal handlers, and a shell that is not explicitly forwarding signals will not pass SIGTERM to the service it launched. So the service never learns it should stop, sits until the grace period expires, and is then SIGKILLed with requests still in flight. Exec the service so it replaces the shell and becomes PID 1 itself, or use an init that forwards signals and reaps orphans."

[[q]]
id = "os-018"
qtype = "judgment"
subtopic = "memory"
levels = ["graduate", "mid"]
q = "A service occasionally vanishes with no log line and no stack trace, and the team is adding more logging inside the request handler to catch it. New information: the host has swap disabled and the service holds an in-memory cache with no eviction policy. Does adding handler logging become more or less likely to find it?"
a = "Less, -1 or -2: the logging cannot run because nothing in the process gets to run. An unbounded cache grows until the limit is hit, and the OOM killer sends SIGKILL, which is not catchable and permits no cleanup or final log line - which is exactly why the disappearance is silent. Look at dmesg and the exit code, where 137 is 128 plus 9 and names SIGKILL. Then bound the cache. Swap being off is what makes it a fast kill rather than a slow collapse."

[[q]]
id = "os-019"
qtype = "numeric"
subtopic = "memory"
levels = ["mid", "senior", "lead", "staff"]
q = "A service runs under a container limit of 2,048 MB. Its resident set size is 512 MB and is climbing by 40 MB per hour with no sign of levelling off. How long before it is killed, and what does that interval tell you about how the incident will be experienced?"
a = "38.4 hours, from 1,536 MB of headroom at 40 MB per hour. The interval is the point: a leak this size does not fail in testing and does not fail on the day it ships, it fails a day and a half later, which usually means overnight and after whatever change introduced it has stopped being the obvious suspect. It will also present as a process vanishing with no log line, because exceeding the limit brings a SIGKILL that permits no cleanup. Alert on the gradient and you get the whole 38.4 hours of warning; alert at 90% of the limit and you get 5.12 hours, most of it while nobody is awake."
derivation = [
  "limit_mb = 2048",
  "current_mb = 512",
  "growth_mb_per_hour = 40",
  "headroom_mb = limit_mb - current_mb",
  "hours = headroom_mb / growth_mb_per_hour",
  "alert_pct = 90",
  "alert_mb = limit_mb * alert_pct / 100",
  "warning_hours = (limit_mb - alert_mb) / growth_mb_per_hour",
]
