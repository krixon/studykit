# Question bank: security-basics
topic = "security-basics"

[[q]]
id = "sc-001"
qtype = "discrimination"
subtopic = "authn-authz"
levels = ["graduate", "mid", "senior"]
q = "Authentication and authorisation. Which one causes more real bugs, and why?"
a = "Authentication is who you are; authorisation is what you may do. Authorisation causes more bugs because it must be checked on every operation and every resource, so one missed check is a hole - whereas login is one place you get right once."

[[q]]
id = "sc-002"
qtype = "diagnostic"
subtopic = "authn-authz"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "GET /orders/1234 returns the order. Changing the number returns someone else's order. What is this called and what is the fix?"
a = "Insecure direct object reference - a missing authorisation check. The fix is to scope the query by the authenticated principal, WHERE id = ? AND customer_id = ?, so an unauthorised id simply returns nothing. That is more reliable than a separate check that can be forgotten on the next endpoint."

[[q]]
id = "sc-003"
qtype = "judgment"
subtopic = "authn-authz"
levels = ["mid", "senior", "lead", "staff"]
q = "The delete button is hidden for non-admin users, so the delete endpoint has no permission check. More or less safe?"
a = "Not safe at all, -2. The UI is a convenience and anyone can call the endpoint directly. Authorisation is enforced on the server, always, regardless of what any client shows or hides."

[[q]]
id = "sc-004"
qtype = "recall"
subtopic = "injection"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "State the one principle that prevents SQL injection, command injection and XSS."
a = "Never build an instruction by concatenating a string with untrusted data. Use the mechanism that keeps code and data on separate channels - parameterised queries, argument arrays for exec, context-aware output encoding in templates. Escaping by hand is competing against every encoding trick in existence."

[[q]]
id = "sc-005"
qtype = "judgment"
subtopic = "injection"
levels = ["mid", "senior", "lead", "staff"]
q = "You are stripping quotes and semicolons from input to prevent SQL injection. More or less appropriate?"
a = "Much less, -2. Filtering is a guessing game against encodings, unicode variants and contexts you have not thought of, and it corrupts legitimate input like O'Brien. Parameterised queries make the problem structurally impossible. Validation is a useful second layer and a poor first one."

[[q]]
id = "sc-006"
qtype = "recall"
subtopic = "injection"
levels = ["mid", "senior", "lead", "staff"]
q = "Where does path traversal come from and what stops it?"
a = "Untrusted input used to build a file path, so ../../etc/passwd escapes the intended directory. Resolve the path to its canonical form and check it is still inside the permitted root - do not try to filter dot-dot sequences out, because there are many encodings of them."

[[q]]
id = "sc-007"
qtype = "recall"
subtopic = "password-storage"
levels = ["graduate", "mid", "senior"]
q = "Why is SHA-256 the wrong choice for storing passwords?"
a = "Because it is fast, which is the wrong property here - a GPU tries billions per second against a stolen hash. Password storage wants a deliberately slow, memory-hard function with a tunable cost: Argon2id, scrypt or bcrypt."

[[q]]
id = "sc-008"
qtype = "recall"
subtopic = "password-storage"
levels = ["mid", "senior", "lead", "staff"]
q = "What is a salt for, given that it is stored next to the hash?"
a = "It makes identical passwords produce different hashes, so an attacker cannot precompute one rainbow table and crack everyone at once, and cannot see which users share a password. It is not secret; it is a per-user uniqueness device."

[[q]]
id = "sc-009"
qtype = "judgment"
subtopic = "password-storage"
levels = ["senior", "lead", "staff"]
q = "Your policy forces a password change every 90 days. More or less appropriate under current guidance?"
a = "Less, -2. Current NIST guidance dropped forced rotation because it produces predictable variations - Summer2026, Autumn2026 - with no measured security benefit, and it trains users to write passwords down. Rotate on evidence of compromise, check against breached-password lists, and allow long passphrases."

[[q]]
id = "sc-010"
qtype = "recall"
subtopic = "secrets"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "A secret was committed and then removed in the next commit. Is it safe?"
a = "No. It is in the history on every clone that ever fetched it, and history is not private. The only real remediation is to rotate the secret. Removing or rewriting the commit does not help once it has been pushed."

[[q]]
id = "sc-011"
qtype = "recall"
subtopic = "secrets"
levels = ["mid", "senior", "lead", "staff"]
q = "What does least privilege mean in practice for a service's database credentials?"
a = "The service gets a user that can do exactly what its code needs and nothing more - a reporting service gets read-only, a service that never drops tables cannot. Most of the damage in a breach comes from credentials that could do far more than the code required."

[[q]]
id = "sc-012"
qtype = "judgment"
subtopic = "transport"
levels = ["mid", "senior", "lead", "staff"]
q = "You are using plain HTTP between services because the traffic never leaves your private network. More or less appropriate?"
a = "Less, -2. It assumes an attacker never gets inside the network, which is the assumption every breach report retires - one compromised host can then read everything. TLS internally is cheap now, and it also gives you service identity, which the private network does not."

[[q]]
id = "sc-013"
qtype = "recall"
subtopic = "transport"
levels = ["senior", "lead", "staff"]
q = "What does TLS protect, and what does it say nothing about?"
a = "It protects data in transit between two endpoints. It says nothing about storage, backups, logs, or what the other end does with the data once it arrives - and nothing at all if certificate validation has been disabled to make something work."

[[q]]
id = "sc-014"
qtype = "discrimination"
subtopic = "authn-authz"
levels = ["graduate", "mid"]
q = "A service has a flawless login flow and a bug that lets any registered user read any other user's records by changing a number in the URL. Which of the two concerns is intact and which is broken, and what is the shape of the fix?"
a = "Authentication is intact, authorisation is broken; establishing who you are was never the same question as what you may see. This is insecure direct object reference. The fix is to scope the query by the authenticated principal rather than bolt on a separate ownership check - `WHERE id = ? AND customer_id = ?` - so a foreign id returns nothing by construction. A separate check placed after the fetch works until the day someone adds a second code path and forgets it."

[[q]]
id = "sc-015"
qtype = "discrimination"
subtopic = "injection"
levels = ["graduate", "mid"]
q = "Two defences against untrusted input reaching a query. One rejects input matching a list of dangerous patterns; the other sends the query and the values over separate channels. Why is only one of them a fix, and what is the other good for?"
a = "Parameterised queries are the fix, because the value never gets parsed as part of the statement, so there is nothing for a clever encoding to escape from. Pattern-based filtering is a fix you have to win repeatedly against every encoding trick that exists or will be invented, and you lose once. Validation is a useful second layer for its own reasons - rejecting nonsense early, enforcing your domain rules - and a poor first line. The general principle is to never build an instruction by concatenating a string with untrusted data, in SQL, a shell command, HTML or a file path."

[[q]]
id = "sc-016"
qtype = "discrimination"
subtopic = "password-storage"
levels = ["graduate", "mid"]
q = "Two hashing algorithms are proposed for storing credentials. One is widely praised for its speed. What makes that a disqualifying property here, and what are the other two properties the right choice must have?"
a = "Speed is what an attacker with the stolen hashes gets to use: a fast hash lets a GPU try billions of candidates a second, so the algorithm must be deliberately slow, with a tunable cost factor set so verification takes on the order of a hundred milliseconds. It also needs a per-user salt, so identical passwords hash differently and one precomputed table cannot attack everyone at once, and memory-hardness, which denies the attacker the advantage of cheap parallel hardware. Argon2id, scrypt or bcrypt; not MD5 or SHA-256, whose fitness for other jobs is exactly why they are wrong for this one."

[[q]]
id = "sc-017"
qtype = "judgment"
subtopic = "authn-authz"
levels = ["graduate", "mid"]
q = "An administrative action is protected by hiding its button from anyone without the admin role, and the reviewer is satisfied. New information: the same action is reachable by a documented API endpoint used by the mobile app. Does the protection become more or less adequate?"
a = "It was never adequate, and the new information makes that visible rather than causing it, so -2. Hiding a control in the interface is presentation, not authorisation: the endpoint behind it accepts a request from anyone who constructs one, and a browser's developer tools are enough. The mobile client is no better as a place to enforce it, because you do not control what runs there. Authorisation has to be checked on the server, on every path into the action."

[[q]]
id = "sc-018"
qtype = "judgment"
subtopic = "password-storage"
levels = ["graduate", "mid"]
q = "A team plans to force every user to change their password every ninety days. New information: they already check new passwords against a list of known-breached credentials and allow long passphrases with paste. Does the rotation policy become more or less worth adding?"
a = "Less, -2, and it undercuts what they already have right. Forced periodic rotation produces predictable variations on one password and pushes people towards shorter, more memorable choices, which is the opposite of what breach-checking and long passphrases are buying. Current guidance is explicit that rotation on a schedule has no measured benefit. Rotate on evidence of compromise, which is a different trigger and a genuinely useful one."

[[q]]
id = "sc-019"
qtype = "discrimination"
subtopic = "secrets"
levels = ["graduate", "mid"]
q = "Two services get their database password differently. One receives it as an environment variable. The other reads it from a file mounted by a secret manager. Both keep it out of source control. What is materially different?"
a = "Where the value can be read from once the process is running. An environment variable is inherited by every child process, is visible in the process table on many systems, and is routinely captured in crash dumps and error reports, so a value that leaks does so through paths nobody chose. A mounted file is readable only by what opens it, can be permissioned, and can be replaced while the process runs, which is what makes rotation something other than a redeploy. Keeping the value out of source control is the floor: it is the one mistake with no clean remediation, because a committed secret is in the history of every clone and must be rotated rather than removed."

[[q]]
id = "sc-020"
qtype = "judgment"
subtopic = "transport"
levels = ["graduate", "mid"]
q = "An integration test fails because the certificate on a test endpoint does not validate. The quickest way past it is a flag on the client that turns verification off. More or less appropriate?"
a = "Less, -2, and the reason is not purity. Certificate verification is the entire mechanism by which the client knows it is talking to the server it named, so a client with it disabled will connect to anything that answers, and TLS without it protects the traffic from everyone except whoever intercepted it. The practical objection is that the flag does not stay in the test: it is copied into a helper, the helper is used by production code, and nothing fails to reveal it. Fix the certificate instead - trust the test certificate authority in the test environment, or use a properly issued one - so the failing check goes away because it now passes."

[[q]]
id = "sc-021"
qtype = "discrimination"
subtopic = "transport"
levels = ["graduate", "mid"]
q = "One site is served over HTTPS. Another is served over HTTPS and also sends a header telling browsers to refuse plain HTTP to that domain in future. What does the second stop that the first does not?"
a = "The downgrade. On the first site a user who types the bare domain, or follows an old link, makes a plain HTTP request before any redirect happens, and whoever is on the network at that moment can answer it or rewrite the redirect. The header removes that request for every visit after the first: the browser rewrites the scheme itself before anything goes on the wire. What it does not do is protect the very first visit to a domain the browser has never seen, which is what the preload list addresses. Both sites are still equally exposed to everything TLS says nothing about, because it protects data in transit and nothing about storage, logs, backups, or what the other end does with it."
