# Question bank: sql-and-indexes
topic = "sql-and-indexes"

[[q]]
id = "sq-001"
qtype = "discrimination"
subtopic = "joins"
levels = ["graduate", "mid"]
q = "INNER JOIN and LEFT JOIN. What question does each answer?"
a = "INNER answers only the rows that matched on both sides - customers who have orders. LEFT answers every row from the left side, with nulls where there was no match - all customers, including those with no orders. The choice depends on whether the absence is data you want."

[[q]]
id = "sq-002"
qtype = "diagnostic"
subtopic = "joins"
levels = ["mid", "senior", "lead", "staff"]
q = "A LEFT JOIN stops returning the unmatched rows after someone adds a WHERE clause on the right-hand table. Why?"
a = "Because the unmatched rows have nulls in those columns, and a null fails the comparison, so the WHERE filters them out - converting the LEFT JOIN into an inner join. Move the condition into the ON clause, where it filters what to match rather than what to keep."

[[q]]
id = "sq-003"
qtype = "recall"
subtopic = "normalisation"
levels = ["graduate", "mid", "senior"]
q = "State the point of normalisation without using the word normal form."
a = "Store each fact once and reference it from everywhere else. If changing one fact means updating many rows, it is not normalised, and sooner or later the copies will disagree."

[[q]]
id = "sq-004"
qtype = "judgment"
subtopic = "normalisation"
levels = ["mid", "senior", "lead", "staff"]
q = "You are storing the customer name on the order row instead of joining. More or less appropriate?"
a = "It depends what the field means, so roughly 0 without that. If it is a cached copy of the current name it is denormalisation and will drift. If it is the name at the time of the order, deliberately frozen for the invoice, it is a different fact and belongs on the order. Say which one you mean, because the two look identical in the schema."

[[q]]
id = "sq-005"
qtype = "recall"
subtopic = "indexes"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "What does every extra index cost you?"
a = "A write. Every insert, update and delete has to maintain every index on the table, so five indexes turn one insert into six writes, plus storage and buffer-pool space. Indexes that are never used are pure cost, and the database can tell you which those are."

[[q]]
id = "sq-006"
qtype = "recall"
subtopic = "indexes"
levels = ["mid", "senior", "lead", "staff"]
q = "You have an index on (customer_id, created_at). Which of these use it - filter by customer_id, filter by created_at, filter by both?"
a = "customer_id yes, both yes, created_at alone no. The index is ordered by the leading column, so there is no way to seek into it without knowing customer_id. This leading-column rule is the most useful single fact about composite indexes."

[[q]]
id = "sq-007"
qtype = "diagnostic"
subtopic = "indexes"
levels = ["mid", "senior", "lead", "staff"]
q = "A query filtering on lower(email) is slow despite an index on email. Why?"
a = "Wrapping the column in a function means the stored values no longer match what is being compared, so the index cannot be used and the database scans. Either index the expression lower(email), or store the email already normalised and compare directly."

[[q]]
id = "sq-008"
qtype = "recall"
subtopic = "indexes"
levels = ["senior", "lead", "staff"]
q = "What is a covering index and why is it often the biggest single win?"
a = "An index containing every column the query returns, so the answer comes from the index alone and the table is never touched. It removes a random read per row, which on a query returning many rows usually beats any other single change."

[[q]]
id = "sq-009"
qtype = "recall"
subtopic = "n-plus-one"
levels = ["graduate", "mid", "senior"]
q = "What is an N+1 query problem and how do you recognise it in a log?"
a = "You fetch N rows, then issue one query per row to load a related field, so one query becomes N+1. In a log it is a flood of identical queries differing only by an id. The symptom is a page that is fine with 10 rows and unusable with 500."

[[q]]
id = "sq-010"
qtype = "numeric"
subtopic = "n-plus-one"
levels = ["mid", "senior", "lead", "staff"]
q = "An N+1 over 500 rows, each query taking 1ms. How much latency, and what does the fix cost?"
a = "About half a second, all of it avoidable. The fix - a join, or one IN query with the collected ids - is a single query in the low milliseconds. It is the highest-ratio performance fix in ordinary application code."

[[q]]
id = "sq-011"
qtype = "recall"
subtopic = "transactions"
levels = ["graduate", "mid", "senior"]
q = "Expand ACID and say which letter people most often misunderstand."
a = "Atomicity, Consistency, Isolation, Durability. Consistency is the misunderstood one - here it means your declared constraints hold before and after, which is a different thing entirely from consistency in a distributed systems sense."

[[q]]
id = "sq-012"
qtype = "judgment"
subtopic = "transactions"
levels = ["mid", "senior", "lead", "staff"]
q = "You are calling a payment provider inside an open database transaction so the charge and the order are atomic. More or less appropriate?"
a = "Much less, -2. You are holding database locks for the duration of a slow third-party call, so one slow provider blocks your database. It also does not give you atomicity - the external charge cannot be rolled back by your transaction. Take the payment outside the transaction with an idempotency key and reconcile."

[[q]]
id = "sq-013"
qtype = "recall"
subtopic = "transactions"
levels = ["senior", "lead", "staff"]
q = "Why should transactions be kept short?"
a = "A transaction holds locks, so a long one blocks other writers, and in an MVCC database it also prevents cleanup of old row versions, which bloats storage and slows every other query. Long transactions are one of the classic causes of a database that gets gradually worse for no visible reason."

[[q]]
id = "sq-014"
qtype = "discrimination"
subtopic = "joins"
levels = ["graduate", "mid"]
q = "A query is meant to list every customer alongside their orders from this year, including customers who ordered nothing. It was written to keep all customers, and a filter on the order date was added afterwards. Customers with no orders have vanished. What happened, and where does the filter belong?"
a = "Filtering on the right-hand table in the WHERE clause turned the outer join into an inner one. The join produced the customer row with nulls for the order columns, then the WHERE compared a null date against the year and a comparison with null is not true, so the row was discarded. Move the date condition into the ON clause, where it restricts which orders match rather than which joined rows survive."

[[q]]
id = "sq-015"
qtype = "discrimination"
subtopic = "indexes"
levels = ["graduate", "mid"]
q = "An index exists over two columns together. Queries filtering on the first column are fast, queries filtering on both are fast, and queries filtering on only the second are as slow as having no index at all. Why is the third case different from the first two?"
a = "The index is sorted by the first column, and only within equal values of the first is it sorted by the second. Seeking requires knowing where to start, and the second column alone gives you no starting point, so the whole index would have to be read, which is not cheaper than reading the table. This is the leading-column rule. Serving the second column alone needs its own index."

[[q]]
id = "sq-016"
qtype = "discrimination"
subtopic = "normalisation"
levels = ["graduate", "mid"]
q = "Two designs both put the customer's name on the order row. One is a bug waiting to happen and the other is correct. What distinguishes them?"
a = "Whether it is a copy of a fact or a different fact. Copying the current name onto the order to save a join is denormalisation: change the name and the copies disagree, and you now own the problem of keeping them in step. Recording the name as it stood when the order was placed is a separate fact with its own meaning, which is what an invoice legally requires, and the customer record changing later must not alter it. Same column, opposite correctness, and the question that separates them is whether the value is supposed to follow the customer or not."

[[q]]
id = "sq-017"
qtype = "judgment"
subtopic = "indexes"
levels = ["graduate", "mid"]
q = "A table of orders is queried constantly by status and the plan shows a full scan, so an index on the status column is proposed. New information: the column holds only 'pending' or 'complete', and almost every row is complete. Does the index become more or less appropriate?"
a = "Less as proposed, around -1, but the right index still exists. A plain index on a column with two values is close to useless for the common case, because so many rows match that the planner reads the table anyway and you have paid maintenance on every write for nothing. The rare value is different: a partial index covering only the pending rows is small, stays useful, and serves exactly the query anyone actually runs. A 0 misses that the shape of the fix changes, and a -2 overstates it, because the query being asked is real."

[[q]]
id = "sq-018"
qtype = "judgment"
subtopic = "n-plus-one"
levels = ["graduate", "mid"]
q = "A page renders a list and issues one extra query per item to fetch a related field. It is comfortably fast, so the team decides to leave it. New information: the list is paginated at twenty items and the pagination limit is enforced server-side and cannot be raised by the caller. Does leaving it become more or less defensible?"
a = "More, and this is a case where 0 or +1 is the honest answer rather than a reflex fix. The pattern is only pathological because N grows; a hard server-side cap of twenty bounds the damage at twenty cheap indexed lookups. What to check before agreeing: that the cap really cannot be raised by a parameter, that the related lookup is indexed, and that nothing else reuses the same code path without the cap. Note the cost is per request, so heavy traffic on this page still multiplies it."

[[q]]
id = "sq-019"
qtype = "numeric"
subtopic = "n-plus-one"
levels = ["graduate", "mid"]
q = "A page fetches 200 rows in one query and then issues one further query per row to load a related name. Each query costs 2 ms in round trip. How much of the page's time goes on queries, and what does the same page cost if the related names are fetched in a single second query?"
a = "402 ms against 4 ms. The list query costs 2 ms and the per-row queries add 400 ms, so essentially all of the page's database time is the pattern rather than the work. Collecting the ids and fetching the names in one further query makes it two queries, 4 ms, a hundredfold reduction with no change to what is displayed. Note the cost is entirely round trips rather than database effort, which is why it is invisible in a query-time profile and obvious in a query count."
derivation = [
  "rows = 200",
  "per_query_ms = 2",
  "extra_ms = rows * per_query_ms",
  "total_ms = extra_ms + per_query_ms",
  "batched_ms = 2 * per_query_ms",
]

[[q]]
id = "sq-020"
qtype = "diagnostic"
subtopic = "transactions"
levels = ["graduate", "mid"]
q = "A nightly job wraps its entire run in one transaction so that a failure rolls everything back. While it runs, unrelated writes elsewhere in the application slow down, and the database's disk usage climbs and does not fall back until the job finishes. Most likely cause?"
a = "The transaction is the problem, not the work inside it. An open transaction holds its locks until it ends, so every other writer touching those rows waits for the job rather than for the database; and in a database using multi-version concurrency control, old row versions cannot be cleaned up while a transaction that might still need to see them is open, which is the disk growth. Both effects scale with how long the transaction is open, not with how much it changes. Keep transactions short: batch the job into many small transactions with a way to resume, and accept that a partial run needs to be idempotent rather than buying atomicity with hours of held locks."

[[q]]
id = "sq-021"
qtype = "judgment"
subtopic = "joins"
levels = ["senior", "lead", "staff"]
q = "A query joining orders to customers takes seconds. The proposal is to drop the join, fetch the orders, collect the customer ids and fetch those in a second query, then match them in application code. More or less appropriate?"
a = "Less, -1 to -2, until the plan has been read. Joins are not slow; joins without an index on the join column are, because the database falls back to scanning, and the same missing index makes the second query in the proposed version slow too unless the ids are looked up by primary key. Moving the match into the application does the same matching with less information and adds a round trip, and it loses the database's ability to choose a strategy by row counts. Run EXPLAIN first and look at whether the join column is indexed and how estimated rows compare with actual. The version worth considering after that is a covering index or, for a genuinely large fan-out, fetching in two queries to avoid multiplying wide rows across the join, which is a different argument from the one being made here."

[[q]]
id = "sq-022"
qtype = "judgment"
subtopic = "n-plus-one"
levels = ["lead", "staff"]
q = "A team keeps shipping N+1 queries. The proposal is to disable the ORM's lazy loading globally, so touching an unfetched relation raises rather than quietly issuing a query. More or less appropriate?"
a = "More, +2. The defect is that the failure is silent and proportional to data volume, so it passes review, passes tests on small fixtures, and appears when a customer's list grows. Turning it into an exception moves the discovery to the first developer who writes it, which is exactly where it is cheapest, and makes the fetch explicit at the point that knows what the page needs. The cost is honest: a noisy migration, and some verbosity forever. Pair it with something that catches the general shape, since the setting only covers one source of it - assert a query count per endpoint in tests, and log queries per request so a regression is visible without being an outage."

[[q]]
id = "sq-023"
qtype = "judgment"
subtopic = "normalisation"
levels = ["lead", "staff"]
q = "A team rule says every table stays in third normal form. A report now joins seven tables and misses its deadline, and the proposal is a denormalised table refreshed nightly. More or less appropriate, and what makes it safe?"
a = "More, +1, and the rule was never meant to survive contact with a reporting workload: normalisation optimises for each fact being changed in one place, which is a write-time property, and a report is a read. What makes the copy safe is that it is derived rather than maintained. Rebuild it from the normalised tables by a job that can be run again at any time, never let application code write to it, and make its staleness part of its contract, named in the table and shown on the report. What goes wrong otherwise is that someone patches a wrong row directly, the copy and the source disagree, and there is no longer an authority. The rule to write down is not third normal form everywhere, it is one authority per fact and every copy derivable from it."
