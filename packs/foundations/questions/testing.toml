# Question bank: testing
topic = "testing"

[[q]]
id = "ts-001"
qtype = "recall"
subtopic = "test-levels"
levels = ["graduate", "mid"]
q = "Why prefer many unit tests and few end-to-end tests?"
a = "Feedback speed and diagnosis cost. A failing unit test runs in milliseconds and names the broken function. A failing end-to-end test takes minutes and tells you that something, somewhere, is wrong. The pyramid is about how quickly you learn what broke."

[[q]]
id = "ts-002"
qtype = "judgment"
subtopic = "test-levels"
levels = ["mid", "senior", "lead", "staff"]
q = "Every component has thorough unit tests with mocked dependencies, so integration tests were skipped. More or less safe?"
a = "Much less, -2. Components mocked into agreement can each be correct and collectively broken - the mocks encode your assumption about the other side, and the assumption is what is wrong. Integration tests against a real database and real wiring catch exactly the class of bug unit tests cannot see."

[[q]]
id = "ts-003"
qtype = "discrimination"
subtopic = "doubles"
levels = ["mid", "senior", "lead", "staff"]
q = "A stub, a mock and a fake. What separates them?"
a = "A stub returns canned answers. A mock is a stub that also asserts how it was called. A fake is a real working implementation that is not production-grade, such as an in-memory repository. The fake is usually best, because it exercises real behaviour rather than your assumption about it."

[[q]]
id = "ts-004"
qtype = "judgment"
subtopic = "doubles"
levels = ["mid", "senior", "lead", "staff"]
q = "Your test asserts that the service called the repository's findById then save, in that order. More or less useful?"
a = "Less, -2. That tests the implementation, not the behaviour. Any refactor that produces the same outcome by different calls breaks the test even though nothing observable changed, so the suite becomes a tax on improving the code. Assert on the outcome instead."

[[q]]
id = "ts-005"
qtype = "recall"
subtopic = "doubles"
levels = ["senior", "lead", "staff"]
q = "Where should you mock, and where should you not?"
a = "Mock at boundaries you do not own - a third-party HTTP API, a payment provider, the clock, randomness. Do not mock your own internal collaborators; use the real thing or a fake, so the test exercises real behaviour and survives refactoring."

[[q]]
id = "ts-006"
qtype = "recall"
subtopic = "what-to-assert"
levels = ["graduate", "mid", "senior"]
q = "Which inputs should a test cover beyond the obvious happy path?"
a = "The edges - empty, one, many, the maximum, null, negative, duplicate, and both sides of any boundary value. Plus the error paths, which are the least-tested code in most systems and also the code that runs when things are already going wrong."

[[q]]
id = "ts-007"
qtype = "recall"
subtopic = "what-to-assert"
levels = ["graduate", "mid", "senior"]
q = "What makes a good test name?"
a = "It states the claim, so a failure tells you what broke without reading the body. rejects_expired_token beats test_auth_2. The name is the specification; the body is just how you checked it."

[[q]]
id = "ts-008"
qtype = "recall"
subtopic = "flakiness"
levels = ["mid", "senior", "lead", "staff"]
q = "Name the four usual causes of a flaky test."
a = "Time - depending on the clock, or a sleep that is long enough locally and not on CI. Order dependence - shared state not reset between tests. Concurrency - a real race, often in the code rather than the test. External dependencies - a real network call where there should be none."

[[q]]
id = "ts-009"
qtype = "judgment"
subtopic = "flakiness"
levels = ["mid", "senior", "lead", "staff"]
q = "A test fails about one run in twenty, so the team re-runs CI when it happens. More or less acceptable?"
a = "Not acceptable, -2, and the cost is not the wasted minutes. It teaches everyone to re-run rather than investigate, so a genuine intermittent failure gets re-run too and ships. Quarantine it immediately, then fix or delete it - a flaky test in the suite is worth less than no test."

[[q]]
id = "ts-010"
qtype = "recall"
subtopic = "flakiness"
levels = ["senior", "lead", "staff"]
q = "How do you expose order-dependent tests?"
a = "Randomise the test execution order, and run tests in isolation as well as together. If a test passes alone and fails in the suite, or vice versa, it is depending on state another test left behind."

[[q]]
id = "ts-011"
qtype = "judgment"
subtopic = "coverage"
levels = ["mid", "senior", "lead", "staff"]
q = "Your team is mandating 100 percent line coverage. More or less appropriate?"
a = "Less, -2 as a mandate. Coverage measures which lines ran, not whether the assertions were right, so it is trivially satisfied by tests that assert nothing. Mandating a number produces tests written to touch lines. Use coverage to find untested areas - a file at zero is worth a look - and judge quality some other way."

[[q]]
id = "ts-012"
qtype = "discrimination"
subtopic = "coverage"
levels = ["senior", "lead", "staff"]
q = "Line coverage and branch coverage. Why is the difference worth knowing?"
a = "A line containing a condition can be fully line-covered with only one side of the condition ever taken, so the untested branch is invisible. Branch coverage counts both outcomes, which is much closer to the question you actually care about."

[[q]]
id = "ts-013"
qtype = "discrimination"
subtopic = "doubles"
levels = ["graduate", "mid"]
q = "Two replacements for a database in a test. One returns whatever answers the test was told to return; the other is a working in-memory implementation with real behaviour. What does the second catch that the first cannot?"
a = "Anything that depends on the dependency behaving like itself. A stub returns canned answers, so it agrees with whatever the test author believed, including a wrong belief: it will happily return two rows for a query that would really return none. A fake implements the actual semantics, so it catches a wrong query, a missed constraint, an ordering assumption or a value the real thing would have rejected. The general trap is a system of components mocked into agreeing with each other while being collectively broken."

[[q]]
id = "ts-014"
qtype = "discrimination"
subtopic = "what-to-assert"
levels = ["graduate", "mid"]
q = "Two tests over the same function pass today. After a refactor that changes nothing a caller can observe, one still passes and the other fails. What distinguishes what they were asserting on?"
a = "Observable behaviour against internal steps. The surviving test states a claim about the result or effect the caller can see, which the refactor preserved by definition. The broken one asserted on how the work was done - which collaborators were called, in what order, with what - so it was pinned to the implementation and every improvement now costs a test edit. That is what makes a suite a tax on change instead of a licence for it, and it is the usual symptom of mocking inside code you own."

[[q]]
id = "ts-015"
qtype = "discrimination"
subtopic = "flakiness"
levels = ["graduate", "mid"]
q = "Two intermittently failing tests. One fails only when the suite is run in a different order; the other fails on a loaded machine and never on a laptop. What is the cause in each case, and what is the fix for each?"
a = "Shared mutable state that is not reset, and a timing assumption. Order dependence means one test leaves something behind - a database row, a global, a cached singleton - that another relies on or trips over; the fix is isolating and resetting state, and randomising order to keep it exposed. The load-sensitive one is usually a sleep that is long enough when nothing else is running; the fix is waiting for a condition rather than a duration, and injecting a clock instead of reading the real one."

[[q]]
id = "ts-016"
qtype = "judgment"
subtopic = "test-levels"
levels = ["graduate", "mid"]
q = "A team has thorough unit tests over every component and is deciding whether the middle layer of slower tests against a real database in a container is worth its cost. New information: each component's dependencies are replaced in tests by doubles the team wrote themselves. Does that layer become more or less worth paying for?"
a = "More, +2. Unit tests with hand-written doubles verify each component against the team's belief about its neighbours, and nothing verifies the belief. Everything that lives between components - the SQL, the serialisation, the wiring, a column that is nullable when the double was not - is exactly what those tests cannot see, and it is what the middle layer exists for. The pyramid is advice about feedback speed and diagnosis cost, not a reason to skip the layer where integration bugs live."

[[q]]
id = "ts-017"
qtype = "judgment"
subtopic = "coverage"
levels = ["graduate", "mid"]
q = "A team sets a rule that no change may lower the coverage percentage. New information: most of the uncovered code is error-handling paths. Does the rule become more or less likely to improve the suite?"
a = "More likely to point somewhere useful, and still a weak instrument, so around +1. Untested error handling is the code that runs when things are already going badly, so it is worth covering and the rule will push people at it. What the rule cannot tell the difference between is a test that exercises a path and a test that asserts something about it: coverage counts lines executed, so a test calling the function and asserting nothing satisfies it. Expect the number to be met with assertions nobody would defend unless review asks what each new test claims."

[[q]]
id = "ts-018"
qtype = "diagnostic"
subtopic = "doubles"
levels = ["graduate", "mid"]
q = "A suite has thorough tests over every component and all of them pass. The feature they make up is broken in an obvious way as soon as anyone uses it. Most likely cause?"
a = "Every component was tested against a replacement dependency that agreed with the author's belief about its neighbour, and the belief was wrong. Nothing in the suite ever put two real components together, so the mismatch - a field named differently, a null the caller does not expect, an order that is not what the consumer assumes - lives exactly where no test looks. This is what a layer of tests over a few real components catches, and why replacing dependencies you own with doubles moves risk rather than removing it."

[[q]]
id = "ts-019"
qtype = "recall"
subtopic = "coverage"
levels = ["graduate", "mid"]
q = "What does a coverage report actually measure, and name two things it cannot tell you."
a = "Which lines executed while the tests ran. That is the whole measurement. It cannot tell you whether the assertions are right, so a test that runs a function and asserts nothing raises coverage exactly as much as one that checks the answer; and it cannot tell you whether what is untested matters, so a file at ninety-something percent may have the payment path in the gap. It also does not mean a covered line is tested for its behaviour: a line with a condition can be fully covered with only one side of that condition ever taken, which is why branch coverage is the more informative number. Its honest use is finding untested areas, not being a target."

[[q]]
id = "ts-020"
qtype = "recall"
subtopic = "flakiness"
levels = ["graduate", "mid"]
q = "Why is a test that fails intermittently worse than not having that test at all?"
a = "Because it teaches the team to re-run rather than investigate, and that habit does not distinguish between failures. Once a red build is something you click through, the real failure gets clicked through too, and the suite has stopped being a signal while still costing time on every run. A missing test at least leaves everyone honest about what is not covered. The policy that works is to quarantine the flaky test as soon as it is identified, so the suite goes back to meaning something, and then fix it or delete it within a bounded time rather than letting the quarantine become a graveyard."

[[q]]
id = "ts-021"
qtype = "diagnostic"
subtopic = "test-levels"
levels = ["senior", "lead", "staff"]
q = "Every service has a thorough, fast, green unit suite. A release breaks in production because two services disagree about the name of a field. Which level was missing, and why did the tests that exist not catch it?"
a = "The middle one: something that exercises the real boundary, whether that is an integration test against the real dependency or a contract test that both sides run. The unit suites could not catch it because each side replaced the other with a double it wrote itself, so both were tested against the same mistaken belief and both passed. That is the standing weakness of a suite that is only unit tests: components mocked into agreement can be individually correct and collectively broken, and the mocks encode the assumption rather than checking it. Mock at the boundaries you do not own, and put a real or shared-contract check on the ones you do."

[[q]]
id = "ts-022"
qtype = "judgment"
subtopic = "what-to-assert"
levels = ["lead", "staff"]
q = "A review checklist is proposed: every test must contain exactly one assert statement. More or less useful as a team standard?"
a = "Less, around -1, because it takes a good rule and enforces the wrong version of it. The rule worth having is one logical claim per test, so a failure names what broke without anyone reading the body. Some single claims need several assert lines to state - a returned object checked field by field - and forcing those apart duplicates the setup, multiplies runtime, and produces names that no longer say anything. Enforcing the literal count also creates a metric that is trivially satisfied by combining conditions into one assertion, which is strictly worse to diagnose. Standardise on what the failure message has to tell you, which is checkable in review by reading a failure, and leave the count alone."

[[q]]
id = "ts-023"
qtype = "diagnostic"
subtopic = "what-to-assert"
levels = ["lead", "staff"]
q = "Two teams have green suites. When one team refactors internals with no change a caller can observe, dozens of their tests fail and are then rewritten. The other team's suite stays green through the same kind of change. What is different about what the first team's tests assert?"
a = "They assert on internal steps rather than on observable behaviour: which collaborators were called, in what order, with what arguments. Those claims are true only of the current implementation, so a refactor that keeps behaviour identical falsifies them, and rewriting them afterwards means the suite confirmed nothing about the change. The effect on a team is the part that matters: a suite like that is a tax on improvement rather than the licence for it, and people stop refactoring rather than stop writing those tests. The convention that fixes it is to assert what a caller could see - the return value, the persisted state, the message sent - and to use real implementations or fakes inside your own code, keeping mocks for the boundaries you do not own."
