# Question bank: version-control
topic = "version-control"

[[q]]
id = "vc-001"
qtype = "recall"
subtopic = "commits-history"
levels = ["graduate", "mid", "senior"]
q = "Is a Git commit a diff or a snapshot, and why does the answer matter?"
a = "A snapshot of the whole tree plus a pointer to its parent, identified by a hash of its content. Diffs are computed when you ask for one. It matters because the id depends on the content and the parent, so rewriting any old commit changes every id after it - which is the whole reason rebasing shared history is a problem."

[[q]]
id = "vc-002"
qtype = "recall"
subtopic = "commits-history"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "What should a commit message say that the diff cannot?"
a = "Why. The diff already shows what changed. Fix null check is worthless; guard against a missing profile, which happens for users created before the migration, answers the question the next reader will actually have."

[[q]]
id = "vc-003"
qtype = "recall"
subtopic = "commits-history"
levels = ["mid", "senior", "lead", "staff"]
q = "Which command finds the commit that introduced a particular line of text, and why is it better than blame here?"
a = "git log -S with the string, which finds commits that added or removed it. blame tells you who last touched the line, which is often a reformat or a rename; log -S finds where the text actually entered the codebase."

[[q]]
id = "vc-004"
qtype = "discrimination"
subtopic = "branching"
levels = ["mid", "senior", "lead", "staff"]
q = "Trunk-based development and long-lived feature branches. What is the real trade?"
a = "Divergence over time. Short-lived branches merged daily mean small, frequent conflicts and genuine continuous integration, at the cost of needing feature flags to keep main releasable. A three-week branch defers all the conflicts to one painful day. Most merge pain is a scheduling problem, not a tooling one."

[[q]]
id = "vc-005"
qtype = "recall"
subtopic = "branching"
levels = ["graduate", "mid"]
q = "Why is creating a Git branch instant even on a huge repository?"
a = "Because a branch is just a movable pointer to a commit - a file containing a hash. Nothing is copied. That is also why deleting a branch does not delete any commits."

[[q]]
id = "vc-006"
qtype = "discrimination"
subtopic = "merge-vs-rebase"
levels = ["mid", "senior", "lead", "staff"]
q = "Merge and rebase. What does each do to history?"
a = "Merge creates a commit with two parents, so the history is truthful about what happened and contains merge commits. Rebase replays your commits onto a new base, producing linear history and new commit hashes because the parents changed. The new hashes are the reason for every rebase rule."

[[q]]
id = "vc-007"
qtype = "judgment"
subtopic = "merge-vs-rebase"
levels = ["mid", "senior", "lead", "staff"]
q = "You are about to rebase a branch two colleagues have already pulled and built on. More or less appropriate?"
a = "Not appropriate, -2. Rebasing rewrites the commits, so their local history refers to hashes that no longer exist, and reconciling that is painful for everyone. Rebase your own unpushed work; merge anything shared."

[[q]]
id = "vc-008"
qtype = "judgment"
subtopic = "merge-vs-rebase"
levels = ["senior", "lead", "staff"]
q = "Your team squashes every branch to a single commit on merge. New information - branches routinely contain a refactor commit followed by a behaviour change. More or less appropriate?"
a = "Less, -1. Squashing is right when the intermediate commits are wip and fix typo. When a branch separates a refactor from a behaviour change, that separation is exactly what makes the change reviewable and revertable later, and squashing throws it away. Squash noise, keep meaningful steps."

[[q]]
id = "vc-009"
qtype = "recall"
subtopic = "conflicts"
levels = ["graduate", "mid", "senior"]
q = "What must you do after resolving a merge conflict, and why is it easy to skip?"
a = "Run the tests. A conflict resolution can be syntactically clean and semantically broken - your rename and their new call site each compile alone and not together. Git only knows about text, so it cannot tell you the merge is wrong."

[[q]]
id = "vc-010"
qtype = "recall"
subtopic = "conflicts"
levels = ["mid", "senior", "lead", "staff"]
q = "What is the most common bad conflict resolution?"
a = "Keeping your version wholesale and discarding the other side, which silently reverts someone else's fix. Resolve by understanding both intentions and producing something that satisfies each, not by picking a winner."

[[q]]
id = "vc-011"
qtype = "recall"
subtopic = "finding-bugs"
levels = ["mid", "senior", "lead", "staff"]
q = "What does git bisect do and how many steps over 1000 commits?"
a = "Binary search over history. Mark a good and a bad commit, it checks out the midpoint, you judge, and it converges - about 10 steps over 1000 commits. With a script that exits non-zero on the bug, git bisect run does the whole thing unattended."

[[q]]
id = "vc-012"
qtype = "discrimination"
subtopic = "finding-bugs"
levels = ["mid", "senior", "lead", "staff"]
q = "git revert and git reset. Which is safe on a shared branch?"
a = "revert. It creates a new commit that undoes an old one, so history is unchanged and everyone's clone stays consistent. reset moves the branch pointer and rewrites history, which is fine locally and disruptive on anything others have pulled."

[[q]]
id = "vc-013"
qtype = "recall"
subtopic = "finding-bugs"
levels = ["senior", "lead", "staff"]
q = "You reset --hard and lost two hours of committed work. What recovers it?"
a = "git reflog. It records every position HEAD has held, including commits no branch points at any more, so you can find the old hash and reset or cherry-pick back to it. Unreferenced commits survive for about 90 days before garbage collection, which is why almost nothing committed is ever truly lost."

[[q]]
id = "vc-014"
qtype = "discrimination"
subtopic = "merge-vs-rebase"
levels = ["graduate", "mid"]
q = "Two ways to bring your branch up to date with main. One leaves your commits with the ids they already had; the other gives them new ids. Which is which, and what rule follows from the ids alone?"
a = "A merge adds a commit with two parents and leaves existing commits untouched. A rebase replays your commits onto the new base, and since a commit's id is a hash of its content including its parent, changing the parent produces new ids. The rule that follows: never rebase commits anyone else has pulled, because their history still refers to the old ids and reconciling the two is painful. Rebase your own unpushed work, merge anything shared."

[[q]]
id = "vc-015"
qtype = "discrimination"
subtopic = "commits-history"
levels = ["graduate", "mid"]
q = "You need to find out which change introduced a particular string into the codebase, and separately why the line above it is written the way it is. Two different history tools answer these. What does each do, and why would the first not be answered by reading the log?"
a = "`git log -S \"string\"` searches for commits where the number of occurrences of that text changed, so it finds the change that introduced or removed it directly. Reading the log will not do it because the log shows messages, not content, and the string may have arrived in any of thousands of commits. `git blame` names the commit that last touched a given line, which then gives you a message and a ticket explaining why. Blame answers who and which commit; log -S answers when something appeared."

[[q]]
id = "vc-016"
qtype = "discrimination"
subtopic = "branching"
levels = ["graduate", "mid"]
q = "Two teams both report painful merges. One keeps branches alive for weeks; the other merges daily but reformats whole files while working in them. Both problems present as conflicts. What is the actual cause in each, and which one is not solved by merging more often?"
a = "Divergence, and unnecessary churn. The long-lived branch accumulates weeks of change on both sides and delivers all of it as conflicts at once, which merging more often genuinely fixes: merge frequency beats merge strategy. Reformatting is different in kind - a whitespace or import reshuffle touches every region, so any concurrent edit collides no matter how often you merge. That one is fixed by not mixing formatting with behavioural change, or by formatting the whole codebase once in its own commit."

[[q]]
id = "vc-017"
qtype = "judgment"
subtopic = "commits-history"
levels = ["graduate", "mid"]
q = "A branch is about to be merged as a single squashed commit, discarding the intermediate steps. New information: the branch is fourteen commits of which twelve are 'wip' and 'fix typo', and the other two are a deliberate two-step migration where the first commit must be deployable on its own. Does squashing become more or less appropriate?"
a = "Less as a blanket action, around -1, and the answer is to do both. The twelve noise commits are pure gain to discard. Squashing the migration into them destroys the one thing the history was carrying: that the first step was deployable alone, which is what anyone doing the next migration needs to see, and what a revert would need. Clean the noise by rebasing the branch, keep the two migration commits distinct, then merge. Squash-everything is the right default only when nothing in the sequence was meaningful."

[[q]]
id = "vc-018"
qtype = "judgment"
subtopic = "conflicts"
levels = ["graduate", "mid"]
q = "A conflict is resolved by keeping your side, because the other side's change looked like a formatting difference. The merge is clean and the branch compiles. New information: the other side's commit message says it guards against a missing profile for users created before a migration. Does the resolution become more or less trustworthy?"
a = "Much less, -2, and the compile proving nothing is the point. Resolving a conflict means understanding both intentions, and keeping your side here silently discarded someone else's bug fix; the code is syntactically fine and the bug is back. A clean merge is not evidence of a correct merge, which is why the tests get run after resolving and not before. Read the other side's commit message during the resolution, not after."
