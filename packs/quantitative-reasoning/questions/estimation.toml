# Question bank: estimation
# Format and authoring rules: docs/authoring-packs.md
# `levels` gates who is asked. Ids are stable forever and never reused.
topic = "estimation"

[[q]]
id = "es-001"
qtype = "numeric"
subtopic = "rate-conversion"
levels = ["graduate", "mid"]
q = "A product team says the new feature will handle a million events a month and asks whether you need a queue in front of it. What is that in events per second?"
a = "About 0.4 per second. A month is roughly 2.6 million seconds, so a million events a month is 0.39 per second - one every two and a half seconds. Nothing about that needs a queue for throughput reasons, and the conversion is the whole answer: 'a million a month' sounds like scale and is less than one per second. The figure worth memorising is that 1 per second is about 2.6 million a month, so any monthly number under a few million is a rate you can ignore."
derivation = [
  "events_per_month = 1000000",
  "seconds_per_month = 2600000",
  "per_second = events_per_month / seconds_per_month",
  "reference_rate = 1",
  "reference_monthly = reference_rate * seconds_per_month",
]

[[q]]
id = "es-002"
qtype = "discrimination"
subtopic = "unit-discipline"
levels = ["graduate", "mid"]
q = "Two figures describe the same system's data: one says how much there is, the other says how fast it arrives. Someone plans capacity by adding them. What are the two kinds of quantity, and what has to happen to one before they can be combined?"
a = "A stock and a flow. A stock is an amount at an instant, measured in bytes; a flow is a rate, measured in bytes per unit time. They cannot be added because they do not share units. A flow becomes a stock only by integrating it over a window, so the combination you want is current stored bytes plus arrival rate times retention. Writing the unit on every intermediate value is what catches this, because the mistake produces the wrong unit before it produces the wrong number."

[[q]]
id = "es-003"
qtype = "numeric"
subtopic = "powers-of-two"
levels = ["graduate", "mid"]
q = "Every one of 4,000,000 users has a profile of about 2 KB. Roughly how much storage is that, without reaching for a calculator?"
a = "About 8 GB. Four million profiles at two kilobytes each is 8,000,000 KB; divide by 1024 twice and you get 7,812 MB and then 7.6 GB, which rounds to 8. Treating a million as two to the twentieth and a thousand as two to the tenth turns the multiplication into addition of exponents, leaving only the leading digit to track. Getting 8 GB rather than 8 MB or 8 TB is the entire value of the estimate. Note the drift from dividing by a thousand instead: that route gives 8.0 GB, 4.9% high, which never matters here and does matter in a disk-full alert."
derivation = [
  "users = 4000000",
  "profile_kb = 2",
  "binary_kilo = 1024",
  "total_kb = users * profile_kb",
  "total_mb = total_kb / binary_kilo",
  "total_gb = total_mb / binary_kilo",
  "decimal_gb = total_kb / 1000 / 1000",
  "drift_pct = round(100 * (decimal_gb - total_gb) / total_gb, 1)",
]

[[q]]
id = "es-004"
qtype = "numeric"
subtopic = "dominant-term"
levels = ["mid", "senior", "lead", "staff"]
q = "A request writes a 40 byte log line, a 300 byte audit record and one 2 MB image to storage, at 500 requests per second. Which term decides your storage bill, and what is the total write rate?"
a = "The image, by four orders of magnitude, and about 1,000 MB/s. The image contributes 1,048,576,000 bytes per second against 20,000 for the log line and 150,000 for the audit record, so the two small terms together are 0.016% of the total and it does not matter whether either is right. That is the output of the estimate: this is a bandwidth and object-storage problem, and effort spent on log volume is spent on 0.0019% of the bill. Compute each term to one significant figure, compare, and drop anything an order of magnitude below the largest."
derivation = [
  "rps = 500",
  "log_bytes = 40",
  "audit_bytes = 300",
  "image_mb = 2",
  "binary_kilo = 1024",
  "image_bytes = image_mb * binary_kilo * binary_kilo",
  "log_rate = rps * log_bytes",
  "audit_rate = rps * audit_bytes",
  "image_rate = rps * image_bytes",
  "total_mb_s = round(image_rate / binary_kilo / binary_kilo + audit_rate / binary_kilo / binary_kilo)",
  "small_share_pct = round(100 * (log_rate + audit_rate) / image_rate, 3)",
  "log_share_pct = round(100 * log_rate / image_rate, 4)",
]

[[q]]
id = "es-005"
qtype = "judgment"
subtopic = "sanity-checks"
levels = ["graduate", "mid"]
q = "An estimate for an internal expense-approval tool comes out at 40,000 requests per second, and the arithmetic has been checked twice. New information: the company has about 5,000 employees. Does the figure become more or less believable, and what do you do next?"
a = "Far less believable, -2, and the point is that arithmetic review cannot find this. 40,000 per second across 5,000 employees is 8 requests per second per person sustained, all day, on a tool people touch a few times a month. The error is in the model, not the sum - almost always a rate confused with a total, a per-day figure treated as per-second, or a factor of a thousand lost in a unit conversion. Bound the answer against something known before quoting it: employees times plausible actions per day, converted to a rate, gives something in the single digits per second."
derivation = [
  "estimate_rps = 40000",
  "employees = 5000",
  "rps_per_employee = estimate_rps / employees",
]

[[q]]
id = "es-006"
qtype = "discrimination"
subtopic = "rate-conversion"
levels = ["mid", "senior", "lead", "staff"]
q = "Two figures for the same service, both correct: one is used to choose how many machines to run and the other to forecast the invoice. What are they, and what goes wrong if each is used for the other's job?"
a = "Peak and mean. Size for peak, because the machines have to be there when the traffic is; cost for mean, because you pay for the area under the curve. Using the mean to size gives you a service that fails every day at its busiest hour, and a diurnal web workload peaks at two to three times its mean, so that is not a small error. Using the peak to forecast cost overstates the bill by the same factor and gets a viable design rejected. Any rate quoted without saying which one it is cannot be used for either."

[[q]]
id = "es-007"
qtype = "diagnostic"
subtopic = "unit-discipline"
levels = ["mid", "senior", "lead", "staff"]
q = "Two engineers estimate the same pipeline's daily storage independently. One gets 90 GB, the other 90 TB. Both have checked their multiplication. Where is the error almost certainly hiding?"
a = "In a unit conversion, and the factor of a thousand names it: somewhere one of them treated a per-second rate as per-millisecond, or MB as GB, or wrote a kilobyte where a byte belonged. Finding it is fast if both wrote units on every intermediate value, because the step where the unit stops making sense is the step that is wrong. If neither did, the quickest route is re-deriving the figure a different way - bytes per record times records per day - and seeing which of the two it lands on. Checking the multiplication again cannot find this, because the multiplication is right."
derivation = [
  "estimate_gb = 90",
  "estimate_tb = 90",
  "factor = 1000",
]

[[q]]
id = "es-008"
qtype = "judgment"
subtopic = "dominant-term"
levels = ["senior", "lead", "staff"]
q = "An estimate has three terms and no single one dominates: they come out within about 20% of each other. The author presents this as a well-balanced design. Does the absence of a dominant term support that reading?"
a = "Treat it as a warning rather than a result, so around -1. Real systems are lopsided, so three terms landing within 20% is more often a sign that the same figure has been used three times, or that the terms are not independent, or that the model has been tuned until it looked tidy. Check for a shared input driving all three. If it survives that, it is a genuine and useful finding - the design has no single lever, every optimisation buys at most a third, and the sensible move is to reduce total work rather than optimise a component. The reason to be suspicious first is that an estimate whose sensitivity is flat also cannot be checked, since no input moves the answer enough to test."
derivation = [
  "spread_pct = 20",
  "terms = 3",
  "max_single_saving_share = round(100 / terms)",
]

[[q]]
id = "es-009"
qtype = "recall"
subtopic = "powers-of-two"
levels = ["graduate", "mid"]
q = "Roughly how many seconds are in a day, and what is the approximation worth using in your head instead?"
a = "86,400, and the useful approximation is 100,000. It is 16% high, which never matters in an estimate, and it makes every division trivial: a rate per day divided by ten to the fifth is a rate per second, and back the other way a per-second figure times ten to the fifth is a daily total. The two other conversions worth holding: a month is about 2.6 million seconds and a year about 31.5 million, so 1 per second is about 2.6 million a month."
derivation = [
  "exact_seconds_per_day = 86400",
  "approx_seconds_per_day = 100000",
  "error_pct = round(100 * (approx_seconds_per_day - exact_seconds_per_day) / exact_seconds_per_day)",
  "seconds_per_month = 2600000",
  "seconds_per_year = 31500000",
  "reference_rate = 1",
]

[[q]]
id = "es-010"
qtype = "recall"
subtopic = "sanity-checks"
levels = ["graduate", "mid"]
q = "You have an estimate and two minutes before you have to quote it. Name three checks worth spending that time on."
a = "Bound it: is the answer bigger than the whole internet or smaller than one request, both of which happen. Compare it to a known scale, so a figure that exceeds global card-payment volume for an internal tool gets caught. Check the direction: double an input and confirm the answer moves the way it should, which catches a sign or reciprocal error that arithmetic review will not. A fourth if there is time: re-derive one figure a second way, which is the cheapest review available and either confirms the magnitude or names the mistake."

[[q]]
id = "es-011"
qtype = "discrimination"
subtopic = "dominant-term"
levels = ["graduate", "mid"]
q = "Two ways of reporting an estimate: one gives the total, the other names which input the total moves with. Why is the second usually the more useful output?"
a = "Because it tells you what to do. A total answers whether the design fits and nothing else, and it is only as good as its weakest assumption. Naming the sensitivity says which assumption to go and check, which lever would change the outcome, and what kind of problem you have - 'dominated by the image payload, so this is a bandwidth question rather than a request-rate one' redirects the work. It also makes the estimate reviewable, because a reader can attack the input that matters instead of the arithmetic."

[[q]]
id = "es-012"
qtype = "recall"
subtopic = "dominant-term"
levels = ["graduate", "mid"]
q = "You have an estimate with several contributing terms. How do you find the one that decides the answer, and what do you do with the rest?"
a = "Compute each term to one significant figure, compare them, and drop anything an order of magnitude below the largest. A term contributing a few per cent does not need to be right, and spending time on it is the commonest way an estimate takes twenty minutes instead of two. If two terms come out within a factor of two of each other you have not failed, you have found a genuine trade-off, and the estimate has done its job by locating it. The output worth quoting is the term plus its sensitivity: which input the answer moves with, so that everyone knows which number to argue about."

[[q]]
id = "es-013"
qtype = "recall"
subtopic = "rate-conversion"
levels = ["graduate", "mid"]
q = "A daily total is divided by the number of seconds in a day to get a rate, and the fleet is sized for it. What has that assumed, and how wrong is it usually?"
a = "It has assumed the traffic is spread evenly, which no real workload is. A consumer web workload with a daily rhythm peaks at roughly two to three times its daily mean, so a fleet sized at the mean is short by that factor for the hours that matter; a batch-driven workload triggered on a schedule can peak a hundredfold, because the whole day's work arrives in one window. Size for peak and cost for mean, and say which one any figure is: a rate quoted without saying whether it is mean or peak is not usable in either calculation."

[[q]]
id = "es-014"
qtype = "judgment"
subtopic = "rate-conversion"
levels = ["senior", "lead", "staff"]
q = "A capacity plan takes the month's request total, divides by the seconds in a month, and provisions for that rate plus a margin. New information: the service is a consumer app used mostly in one country, in the evening. More or less sound?"
a = "Less, -2, and the margin is doing work it cannot do. A month is about 2.6 million seconds, so 260 million requests a month reads as 100 per second, and a single-country consumer app concentrates its day into a few evening hours: the evening peak is around 300 per second, and the plan is short by a factor the margin was never sized for. The other half of the error is that a monthly mean also hides the weekly shape and any campaign or release spike. Provision against a measured peak, over a window short enough to contain one, and keep the monthly mean for the invoice, which is the question it does answer."
derivation = [
  "requests_per_month = 260000000",
  "seconds_per_month = 2600000",
  "mean_rps = requests_per_month / seconds_per_month",
  "peak_rps = mean_rps * 3",
]

[[q]]
id = "es-015"
qtype = "recall"
subtopic = "unit-discipline"
levels = ["graduate", "mid"]
q = "Which single habit catches most estimation errors, and why does it work?"
a = "Write the unit on every intermediate value and carry it through the multiplication: requests per second times bytes per request gives bytes per second. It works because a wrong step almost always produces the wrong unit before it produces the wrong number, and the wrong unit is visible where a wrong number is not. The corollary is the useful half: if the units of your answer are not the units of the question, the model is wrong, and re-checking the arithmetic will never find it. The same habit forces you to say whether a figure is per second, per day or peak, and to keep a stock apart from a flow, which are the two ways an estimate quietly answers a different question."

[[q]]
id = "es-016"
qtype = "judgment"
subtopic = "unit-discipline"
levels = ["senior", "lead", "staff"]
q = "A requirements document says the system must handle 100,000 requests, and engineering has signed up to it. More or less usable as a requirement?"
a = "Less, -2: it is not a rate, so it does not constrain anything. Spread over a day, 86,400 seconds, it is 1.2 per second, which one machine handles while idle. Concentrated in a busy hour it is 28 per second, and if it is a burst behind a batch trigger it could be the whole lot in a minute, which is a different system again. Those readings are a factor of twenty-four apart at the least and no margin covers that spread. Send it back with the question that fixes it: over what interval, and is that figure the mean or the peak. Sizing is done against a peak rate, and a total with no interval on it is a stock being used as a flow."
derivation = [
  "requests = 100000",
  "seconds_per_day = 86400",
  "per_second_day = requests / seconds_per_day",
  "per_second_hour = requests / 3600",
]

[[q]]
id = "es-017"
qtype = "numeric"
subtopic = "powers-of-two"
levels = ["senior", "lead", "staff"]
q = "A cache is being sized for 20 million entries of about 200 bytes each. How much memory is that, and how much does the answer depend on which kind of gigabyte you mean?"
a = "4,000,000,000 bytes, which is 4.0 GB in decimal units and 3.7 GiB in binary ones, a difference of 7.4%. Twenty million times two hundred is a four with nine zeros after it, and the fastest route in your head is that a million of anything is 2^20, so twenty million entries of two hundred bytes is about four billion bytes without ever writing a zero. The 7.4% matters in exactly one place: an instance with 4 GiB of memory does not hold this cache, and the plan that said 4 GB thought it did. Add the per-entry overhead of whatever structure holds it before believing either figure."
derivation = [
  "entries = 20000000",
  "bytes_each = 200",
  "total_bytes = entries * bytes_each",
  "decimal_gb = total_bytes / 1000 / 1000 / 1000",
  "binary_gib = round(total_bytes / 1024 / 1024 / 1024, 1)",
  "drift_pct = round(100 * (1024 ** 3 / 1000 ** 3 - 1), 1)",
]

[[q]]
id = "es-018"
qtype = "discrimination"
subtopic = "powers-of-two"
levels = ["senior", "lead", "staff"]
q = "Two people size the same volume of data. One divides by 1000 at each step, the other by 1024. Where does the difference between them stop being a rounding detail?"
a = "At the point the number stops being an estimate and becomes a threshold. The gap compounds with each step: 2.4% at kilo, 7.4% at giga, 10% at tera. Inside an estimate that is noise, because the inputs are worth one significant figure and the answer is being used to rule out an order of magnitude. It matters when two systems have to agree on the same number: a disk-full alert set at 1 TB by a tool that means 1 TiB fires 10% later than whoever wrote the threshold intended, and a quota, a billing line and a capacity plan that mix the two disagree in a way nobody can reproduce. Estimate in whichever is easier, and state the unit where the figure crosses a boundary."
derivation = [
  "decimal_kilo = 1000",
  "binary_kilo = 1024",
  "kilo_pct = round(100 * (binary_kilo / decimal_kilo - 1), 1)",
  "giga_pct = round(100 * (binary_kilo ** 3 / decimal_kilo ** 3 - 1), 1)",
  "tera_pct = round(100 * (binary_kilo ** 4 / decimal_kilo ** 4 - 1), 1)",
  "threshold_tb = 1",
]

[[q]]
id = "es-019"
qtype = "judgment"
subtopic = "sanity-checks"
levels = ["senior", "lead", "staff"]
q = "An estimate is reviewed by a second engineer redoing the multiplication and getting the same answer. The team treats it as verified. More or less adequate as a review?"
a = "Less, around -1 to -2, because it checks the only part that was probably right. Arithmetic errors are real and rare; model errors are the ones that survive review, and re-running the same multiplication cannot see a missing factor, a stock used as a flow, a mean used as a peak, or a term left out entirely. The checks that catch those are different in kind: bound the answer and ask whether it is larger than the internet or smaller than one request, compare it to a scale you already know, test that it moves the right way when an input doubles, and re-derive one figure by a second route. That last one is the whole review in a sentence, because two routes to the same magnitude is evidence and two runs of one route is not."

[[q]]
id = "es-020"
qtype = "numeric"
subtopic = "sanity-checks"
levels = ["senior", "lead", "staff"]
q = "A design document says the service will need 8 Gbps of egress at launch for a product with 50,000 daily users. Check the figure before the meeting."
a = "It is wrong unless the product is video. Eight gigabits per second is 1 GB per second of bytes, and over a day, 86,400 seconds, that is 86.4 TB. Split across 50,000 users it is 1.7 GB per user per day, which is a couple of hours of streamed video each, every day, from a product nobody has described that way. The useful part is not the correction, it is what the check tells you to ask: which term produced it. Almost always it is an unthrottled poll, a payload measured in the wrong unit, or a per-user figure multiplied by a per-day figure that already included the users."
derivation = [
  "gigabytes_per_second = 8 / 8",
  "seconds_per_day = 86400",
  "terabytes_per_day = gigabytes_per_second * seconds_per_day / 1000",
  "users = 50000",
  "gigabytes_per_user_per_day = round(terabytes_per_day * 1000 / users, 1)",
]
