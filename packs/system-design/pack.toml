[pack]
name = "system-design"
title = "System design"
description = "Distributed systems design, from first components to multi-region tradeoffs. Graduate through Staff+."
levels = ["graduate", "mid", "senior", "lead", "staff"]
areas = [
  "caching", "networking", "rate-limiting", "api-schema", "geo-cdn",
  "partitioning", "storage", "consistency", "messaging", "real-time",
  "observability", "multi-region-dr",
]

# --------------------------------------------------------------------------- #
# Calibration: the bar an answer is judged against, per level.
# The engine injects this into every session so the same question can be scored
# fairly at different levels. It changes the bar, never the score scale.
# --------------------------------------------------------------------------- #

[calibration.graduate]
bar = "Names the component, says what problem it solves, and draws a sensible box diagram. Getting the mechanism right is the whole job."
assume = "No prior exposure to distributed systems. Vocabulary is being learned, not assumed."
push_on = ["what it is", "what it is for", "when you would reach for it", "one thing that can go wrong"]
avoid = "Do not demand numbers, blast-radius analysis, or organisational consequences. A correct mechanism scores well here."

[calibration.mid]
bar = "Correct mechanism plus the main tradeoff, and a rough sense of scale. Should not need the alternatives listed for them."
assume = "Comfortable with HTTP, SQL, a cache and a queue. Has shipped features on someone else's architecture."
push_on = ["the tradeoff, not just the mechanism", "when it is the wrong tool", "the common failure mode", "an order-of-magnitude estimate"]
avoid = "Do not require multi-region reasoning or cost modelling unless the topic is about them."

[calibration.senior]
bar = "Tradeoff named and defended, a number attached, and a failure mode volunteered without being asked."
assume = "Has operated systems in production. Knows what a pager feels like."
push_on = ["why, not what", "what breaks at 10x", "what it costs", "the second-order effect", "what you would measure"]
avoid = "Do not accept 'it works' as a complete answer, and do not accept a mechanism with no cost attached."

[calibration.lead]
bar = "Everything at senior, plus the migration path and the operational burden the team actually inherits."
assume = "Owns a system and a team. Decisions have to survive people leaving."
push_on = ["how you would get there from here", "what the team has to run at 3am", "which decision is reversible", "what you would deliberately not build"]
avoid = "Do not reward the most sophisticated design. Reward the one that survives contact with a real team."

[calibration.staff]
bar = "Correct, quantified, with a failure mode and a blast radius, and an explicit statement of what the design buys and what it forecloses."
assume = "Basics are assumed entirely. Vocabulary is shared."
push_on = ["blast radius", "cost at 10x and at 100x", "what you would delete", "where the design is load-bearing on an assumption", "what you would tell an exec"]
avoid = "Do not accept an unquantified claim. Do not accept a design with no stated failure mode."

