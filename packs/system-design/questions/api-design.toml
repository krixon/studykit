# Question bank: api-design
topic = "api-design"

[[q]]
id = "ap-001"
qtype = "discrimination"
subtopic = "styles"
levels = ["mid", "senior", "lead", "staff"]
q = "REST and GraphQL. What does the choice actually decide?"
a = "Who owns the round trips and who owns the query cost. REST fixes the response shape server-side, so caching by URL works and cost is predictable. GraphQL lets the client specify what it needs, which removes round trips for varied clients and moves query-cost control into your resolvers, where you now need depth limits, complexity budgets and persisted queries."

[[q]]
id = "ap-002"
qtype = "judgment"
subtopic = "styles"
levels = ["senior", "lead", "staff"]
q = "You are choosing GraphQL for a public API. New information - it is read-heavy, mostly the same few queries, and you were relying on CDN caching. More or less appropriate?"
a = "Less, -2. GraphQL typically POSTs to a single URL, so shared HTTP caching stops working and you have to rebuild caching inside the resolver layer. With few distinct queries you get little of GraphQL's benefit and lose a caching layer that was doing real work. Persisted queries over GET recover some of it."

[[q]]
id = "ap-003"
qtype = "recall"
subtopic = "styles"
levels = ["graduate", "mid"]
q = "When would you use a webhook instead of having the client poll?"
a = "When the event is rare and the client would otherwise poll constantly for nothing, or when the work outlives a request timeout. The cost is that delivery becomes your problem - retries, signing, ordering, and a replay path for when the receiver was down."

[[q]]
id = "ap-004"
qtype = "recall"
subtopic = "versioning"
levels = ["mid", "senior", "lead", "staff"]
q = "What is the genuinely hard part of API versioning?"
a = "Retiring the old version, not issuing the new one. That needs per-version per-client usage telemetry, a deprecation window with real communication, and someone whose job is chasing the last few callers. Issuing v2 is an afternoon; removing v1 is a quarter."

[[q]]
id = "ap-005"
qtype = "judgment"
subtopic = "versioning"
levels = ["senior", "lead", "staff"]
q = "You are bumping the whole API to /v2 to change one field on one endpoint. New information - there are 40 endpoints and 200 external consumers. More or less appropriate?"
a = "Much less, -2. A global version forces every consumer through a migration for a change none of them use. Version at the granularity of what changes, or better, make the change additive - add the new field, deprecate the old one, and remove it after telemetry shows nobody reads it."

[[q]]
id = "ap-006"
qtype = "discrimination"
subtopic = "pagination"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Offset pagination and cursor pagination. What separates them?"
a = "Stability under concurrent writes, and cost. An insert shifts every subsequent offset page, so items are skipped or repeated; a cursor anchors to a sort key so pages stay stable. Offset cost also grows with depth because the database walks the skipped rows, while keyset cost is constant per page. Offset buys the ability to jump to page 40, which is rarely a real requirement."

[[q]]
id = "ap-007"
qtype = "recall"
subtopic = "pagination"
levels = ["senior", "lead", "staff"]
q = "Why should a pagination cursor be opaque?"
a = "Because the moment clients parse it, its structure becomes part of your contract and you can never change the sort key or the encoding. Opaque means you can switch from a timestamp cursor to a composite key without a breaking change."

[[q]]
id = "ap-008"
qtype = "diagnostic"
subtopic = "pagination"
levels = ["mid", "senior", "lead", "staff"]
q = "A nightly export job using page-number pagination consistently misses a few records, and the count varies. The query and data look correct. Why?"
a = "Rows are being inserted or deleted while the job pages through. Each insert before the current offset shifts everything down by one, so a record slides from page N+1 to page N after page N was already read. Cursor pagination on a stable sort key fixes it; so does exporting from a snapshot."

[[q]]
id = "ap-009"
qtype = "discrimination"
subtopic = "errors-status"
levels = ["mid", "senior", "lead", "staff"]
q = "401, 403, 404 and 409. What does each tell the caller to do differently?"
a = "401 - you are not authenticated, get credentials and retry. 403 - you are authenticated and still not allowed, retrying will never help. 404 - the resource is not there, though it may be deliberately masking a 403 to avoid leaking existence. 409 - your request conflicts with current state, re-read and try again with fresh state. The point is that each implies a different client action."

[[q]]
id = "ap-010"
qtype = "judgment"
subtopic = "errors-status"
levels = ["senior", "lead", "staff"]
q = "You are returning 200 with an error object in the body so clients get consistent parsing. More or less appropriate?"
a = "Much less, -2. Every intermediary - proxies, CDNs, retry policies, dashboards, alerting - reads the status code. A 200 means caches may store the error, retries never fire, and error rate reads as zero during an outage. Use the status for the class of outcome and the body for detail."

[[q]]
id = "ap-011"
qtype = "recall"
subtopic = "errors-status"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "You are designing a JSON API. A mobile client calls it, a third-party integrator also calls it, and your support team fields tickets about it. A request fails. Beyond the status code, what goes in the response body, and what does each part buy you?"
a = "A stable machine-readable code the client can branch on, a human message for logs, and a correlation id so a support conversation can find the request. Never make clients regex the message - that makes your prose part of the contract, so say explicitly that the message is not covered by it. A strong answer adds pointers to the offending fields for validation failures, a link to documentation for the code, one consistent schema across every endpoint, and the boundary that stack traces and internal detail never ship in a production body. The correlation id is the one that changes support economics: an error code says what class of thing broke, only the id says which request."

[[q]]
id = "ap-012"
qtype = "discrimination"
subtopic = "compatibility"
levels = ["senior", "lead", "staff"]
q = "Backward and forward compatibility. Why does a rolling deploy need both?"
a = "Backward compatible means old clients work against the new server. Forward compatible means new clients work against the old server. During a rolling deploy both versions are live simultaneously, and traffic hits either, so a change safe in only one direction breaks during the rollout window even though it is fine before and after."

[[q]]
id = "ap-013"
qtype = "recall"
subtopic = "compatibility"
levels = ["mid", "senior", "lead", "staff"]
q = "Name four changes that look additive but are breaking."
a = "Making an optional field required. Tightening validation on an existing field. Adding an enum value when clients were never told to tolerate unknown values. Changing a type, including integer ids to strings. Changing the meaning of an existing value without changing its name is the worst of them, because nothing fails loudly."

[[q]]
id = "ap-014"
qtype = "recall"
subtopic = "compatibility"
levels = ["senior", "lead", "staff"]
q = "Describe expand-migrate-contract for a breaking field change."
a = "Expand - add the new field alongside the old, write both, read the old. Migrate - switch reads to the new field, backfill history, move consumers across, and prove with telemetry that nobody reads the old one. Contract - remove the old field. There is no shortcut for the middle step; the telemetry is what makes the last step safe rather than hopeful."

[[q]]
id = "ap-015"
qtype = "discrimination"
subtopic = "versioning"
levels = ["graduate", "mid"]
q = "Two ways of changing a published response shape. One issues a new numbered surface alongside the old; the other never removes or repurposes a field and only adds optional ones. What does each cost you, and which cost do large APIs usually decide they prefer?"
a = "A new numbered surface makes the change obvious and greppable, and encourages copying the whole surface for one field, after which you are supporting two of everything and the real work is retiring the old one. Additive-only keeps a single surface and pays in accumulated fields that can never be deleted and a schema that only grows. Large APIs generally take the second, because permanent clutter is cheaper than permanent duplication, and because the hard part was never issuing the new version but chasing the last callers off the old one."

[[q]]
id = "ap-016"
qtype = "discrimination"
subtopic = "styles"
levels = ["graduate", "mid"]
q = "A mobile screen needs data assembled from six places. One API style makes the client issue six requests; another lets the client describe what it wants in one. What has moved rather than disappeared, and what is now yours to control?"
a = "The assembly work, and with it the cost. Six resource-shaped requests put the round trips on the client, which is expensive on a mobile network, and each response is independently cacheable by URL. A client-specified query collapses it to one round trip and moves the fan-out inside your service, so the client can now author something expensive and cost control lives in your resolvers, plus caching gets harder because it is one URL with a body. Both are defensible; the choice is who owns the round trips and who owns the cost."

[[q]]
id = "ap-017"
qtype = "judgment"
subtopic = "pagination"
levels = ["graduate", "mid"]
q = "A listing endpoint pages by offset, which the team keeps because the interface shows numbered pages. New information: the list is ordered newest first and new items arrive continuously while a user is reading. Does offset paging remain acceptable?"
a = "No, -2 for correctness, and the numbered pages are a weaker requirement than they look. An insert ahead of the reader shifts every subsequent position by one, so the next page repeats an item already seen or skips one entirely, and nobody notices because the response looks valid. Cost also grows with the offset, because the database still walks the rows it discards. Keyset paging on the sort key plus a tiebreaker is stable under writes and constant cost per page; what it gives up is jumping to page forty, which is almost never a real requirement."

[[q]]
id = "ap-018"
qtype = "judgment"
subtopic = "compatibility"
levels = ["graduate", "mid"]
q = "An id is being changed from a number to a string in the response, because JavaScript clients lose precision on large values. The change is planned for one release. More or less appropriate?"
a = "The reason is right and the plan is wrong, so around -2 as scheduled. Changing a field's type is a breaking change even when the new type is strictly better: every client that parses the value as a number now sees a string, and a client comparing ids, using them as map keys or sending them back gets a different result or an error. You do not control when callers deploy. Do it as expand, migrate, contract: add a new string field alongside the numeric one, populate both, move consumers with telemetry showing who still reads the old field, then remove it after a deprecation window. The middle step is the whole job and there is no shortcut for it."

[[q]]
id = "ap-019"
qtype = "diagnostic"
subtopic = "compatibility"
levels = ["graduate", "mid"]
q = "During a deploy, a fraction of requests fail validation for a few minutes and then the errors stop by themselves. The release added a required field to a request body and updated the client that sends it. Most likely cause?"
a = "Old and new were live at the same time, which is what a rolling deploy means, and the change was not compatible in both directions. For a window, updated clients were talking to servers that had not yet been replaced, or unchanged clients were reaching servers that now demand the new field; either way one side was speaking a dialect the other had not learned. Making a field required is a breaking change, not an addition. The safe sequence is to accept the field as optional first, deploy that everywhere, then start sending it, and only make it required once telemetry shows no request arrives without it."

[[q]]
id = "ap-020"
qtype = "discrimination"
subtopic = "errors-status"
levels = ["graduate", "mid"]
q = "Three rejected requests: one has a malformed body the parser cannot read; one parses cleanly but sets a delivery date in the past; one asks to cancel an order that has already shipped. Which status does each get, and what does the caller do differently in each case?"
a = "Malformed body is 400: the request could not be understood, and the caller must fix how it is built. A well-formed body that breaks a rule is 422: the syntax was fine and the meaning was not, so the caller must change the values, and the response should name the field and the rule. Cancelling a shipped order is 409: the request is valid and conflicts with the current state of the resource, so the caller must re-read the state and decide, and retrying the same request unchanged will keep failing. The distinction matters because each implies a different next action, and collapsing them into 400 leaves every caller guessing. Whichever it is, put a machine-readable code in the body and let the message be for humans."

[[q]]
id = "ap-021"
qtype = "recall"
subtopic = "versioning"
levels = ["graduate", "mid"]
q = "Name the three common ways to version an HTTP API and what each one costs."
a = "A version in the URL, such as a leading path segment: obvious and easy to grep for, and it encourages copying the entire surface for a change to one field, so consumers get migrated for changes that do not affect them. A version in a header or media type: keeps URLs stable, and is easy for a client to omit, which means you need a default and the default is a trap. No version at all with additive-only changes: never remove or repurpose a field, only add optional ones, which is the discipline most large APIs converge on because it puts the cost on the producer rather than on every consumer. Version at the granularity of the thing that changes, whichever mechanism you pick."
