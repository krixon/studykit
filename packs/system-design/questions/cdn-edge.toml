# Question bank: cdn-edge
topic = "cdn-edge"

[[q]]
id = "cd-001"
qtype = "recall"
subtopic = "what-it-caches"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "What makes a response cacheable at a shared edge?"
a = "The same bytes must be correct for many users. Anything keyed to one user's identity is not shareable, which is why personalisation and Set-Cookie kill edge caching unless you split the response into a shared shell and a client-fetched personal fragment."

[[q]]
id = "cd-002"
qtype = "discrimination"
subtopic = "what-it-caches"
levels = ["mid", "senior", "lead", "staff"]
q = "max-age and s-maxage. What separates them and why does it matter?"
a = "max-age applies to any cache including the browser; s-maxage applies only to shared caches and overrides max-age there. It matters because you usually want a long edge TTL and a short browser TTL - the edge you can purge, the browser you cannot."

[[q]]
id = "cd-003"
qtype = "diagnostic"
subtopic = "what-it-caches"
levels = ["senior", "lead", "staff"]
q = "You put a CDN in front of a site. Traffic volume is normal, but the cache hit ratio is close to zero - the CDN forwards almost every request to the origin, though the pages are byte-identical for every visitor. What do you check first?"
a = "The Vary header and Set-Cookie. Vary: Cookie means each distinct cookie value is a separate cache entry, so with any per-user cookie the hit rate collapses to nothing. Analytics cookies set on the origin response are the usual culprit. Strip or normalise cookies at the edge for cacheable paths."

[[q]]
id = "cd-004"
qtype = "recall"
subtopic = "what-it-caches"
levels = ["mid", "senior", "lead", "staff"]
q = "What does stale-while-revalidate buy you, and what problem is it solving?"
a = "It serves the expired copy immediately while exactly one refresh runs behind it, so nobody waits for the origin and the origin sees one request instead of a wall. It is stampede protection you get by writing a header rather than building coalescing."

[[q]]
id = "cd-005"
qtype = "discrimination"
subtopic = "invalidation"
levels = ["senior", "lead", "staff"]
q = "Purge, short TTL, and content-addressed URLs. Rank them and say why."
a = "Content-addressed URLs first - a hash in the filename means the URL changes when the content does, so you cache for a year and never invalidate anything. Short TTL second - bounded staleness, no coordination. Purge last - it is seconds to a minute to propagate globally, so it is a cleanup mechanism, not a consistency mechanism. Purge is only for content whose URL must stay stable, like an article page."

[[q]]
id = "cd-006"
qtype = "judgment"
subtopic = "invalidation"
levels = ["senior", "lead", "staff"]
q = "You are relying on CDN purge to make a price change visible immediately worldwide. More or less appropriate?"
a = "Less, -2. Purge propagation is seconds to a minute across a global network and is not transactional, so for a window some users see the old price and some the new. If the price must be correct at read time, do not cache it at the edge - cache the page shell and fetch the price from origin, or use a very short TTL and accept the bounded window explicitly."

[[q]]
id = "cd-007"
qtype = "recall"
subtopic = "origin-shield"
levels = ["mid", "senior", "lead", "staff"]
q = "What problem does an origin shield solve?"
a = "Without one, every edge location that misses goes to origin independently, so a purge or a cold start produces as many origin requests as you have populated locations. A shield is a designated mid-tier cache that all edges miss through, collapsing those into one origin request."

[[q]]
id = "cd-008"
qtype = "numeric"
subtopic = "origin-shield"
levels = ["senior", "lead", "staff"]
q = "You purge one hot object. The CDN has 200 populated locations and the object gets 50k requests per second globally. Without a shield, roughly what does origin see in the first instant?"
a = "Up to 200 concurrent origin requests, one per location, not 50k - each location coalesces its own misses but they do not coalesce with each other. With a shield it collapses to one. The number to notice is that the fan-out is the location count, which is why the shield matters more as the network grows."

[[q]]
id = "cd-009"
qtype = "judgment"
subtopic = "edge-compute"
levels = ["senior", "lead", "staff"]
q = "You are moving a request handler to edge compute for latency. New information - it reads the user's order history from your primary database in one region. More or less appropriate?"
a = "Much less, -2. You have moved the compute but not the data, so every edge invocation makes a cross-region call to your database - adding a hop rather than removing one. Edge compute wins when the data is also at the edge or the function needs no data at all. This is data gravity."

[[q]]
id = "cd-010"
qtype = "recall"
subtopic = "edge-compute"
levels = ["mid", "senior", "lead", "staff"]
q = "Name three things edge compute is genuinely good at."
a = "Auth and token validation before the request travels further. A/B assignment and header rewriting so the response behind it stays cacheable. Redirects, bot filtering and request routing. The pattern is a cheap decision that turns an uncacheable response into a cacheable one."

[[q]]
id = "cd-011"
qtype = "numeric"
subtopic = "tls-latency"
levels = ["mid", "senior", "lead", "staff"]
q = "How many round trips for a new HTTPS connection under TLS 1.2, TLS 1.3, and TLS 1.3 with session resumption?"
a = "TLS 1.2 - two round trips for the handshake plus one for TCP. TLS 1.3 - one, plus TCP. TLS 1.3 with resumption - zero, data goes in the first flight. A CDN terminating that handshake 20ms away instead of 150ms away is one of its largest and least discussed wins."

[[q]]
id = "cd-012"
qtype = "numeric"
subtopic = "tls-latency"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Roughly how long does light take to cross 1000km of fibre, and what does that imply for London to Sydney?"
a = "About 5ms each way per 1000km, so around 200km per millisecond. London to Sydney is roughly 17,000km, so about 85ms one way and 170ms round trip before any processing. That is a floor set by physics, not by engineering."

[[q]]
id = "cd-013"
qtype = "judgment"
subtopic = "tls-latency"
levels = ["senior", "lead", "staff"]
q = "Someone argues a CDN is pointless for your API because responses are dynamic and uncacheable. More or less appropriate as an argument?"
a = "Weaker than it sounds, -1. Even with a zero hit rate, terminating TLS near the user removes handshake round trips, and the CDN keeps warm long-lived connections back to origin so the request skips connection setup entirely. For first-time visitors on mobile networks that can dominate total time."

[[q]]
id = "cd-014"
qtype = "discrimination"
subtopic = "what-it-caches"
levels = ["graduate", "mid"]
q = "Two directives set a lifetime on the same response, and one applies to a visitor's browser while the other applies to the shared cache in front of your origin. Why would you deliberately set them to different values?"
a = "Because they buy different things. The shared lifetime is what removes load from your origin and can be long, since one copy serves everyone and you can purge it. The browser lifetime is a copy you cannot reach: once handed out, it is stale until it expires no matter what you do. So the usual shape is a long shared lifetime and a short browser one, which gives you origin offload plus the ability to push a change out quickly. `s-maxage` overrides `max-age` for the shared cache, which is what makes the pair expressible in one header."

[[q]]
id = "cd-015"
qtype = "discrimination"
subtopic = "invalidation"
levels = ["graduate", "mid"]
q = "Two ways of making sure nobody is served an old copy of an asset. One tells the edge to drop the key; the other changes the key whenever the bytes change. Why is only one of them free of a propagation delay?"
a = "Because the second has nothing to propagate. Putting a content hash in the filename means a changed file is a different URL, which was never cached, so the new bytes are fetched on first request and the old URL can be kept for a year. A purge is a message that has to reach every edge location, taking seconds to a minute, during which some users get the old copy - which makes it useless as a consistency mechanism. Purge is for content whose URL genuinely must stay stable, like an article page."

[[q]]
id = "cd-016"
qtype = "judgment"
subtopic = "what-it-caches"
levels = ["graduate", "mid"]
q = "A page is served through a shared edge cache and a header is added declaring that the response depends on the request's cookie, so that the cache keys on it. New information: every visitor to the site carries a distinct session cookie from their first request onwards. Does adding that header achieve what was intended?"
a = "It makes the cache correct and useless, so around -1: correctness was necessary and this is the wrong way to pay for it. Keying on a value unique per visitor means every request is a distinct key and a guaranteed miss, so the hit rate is effectively zero and you are paying for a cache that only forwards. The shape that works is splitting the response: cache a shared shell at the edge with no dependence on the cookie, and fetch the personal fragment separately. Declaring the dependence is right; doing it on a value that never repeats is what makes it futile."

[[q]]
id = "cd-017"
qtype = "recall"
subtopic = "edge-compute"
levels = ["graduate", "mid"]
q = "Code running in a CDN's locations sits under constraints that code in your own region does not. Name them, and say what they rule out."
a = "A tight CPU budget per request, no durable local state, a small memory footprint, and cold starts that are cheap but not free, in the low single-digit milliseconds. Between them they rule out anything with a large working set, anything that needs to write something and be sure it stays written, anything requiring agreement across locations, and anything whose data lives in your primary region: reaching back for that data adds a hop and gives up the latency the move was for. What is left is decisions rather than work - token checks, redirects, routing, header rewriting, experiment assignment, bot filtering - which is exactly the shape that turns an uncacheable response into a cacheable one plus a cheap decision at the edge."

[[q]]
id = "cd-018"
qtype = "judgment"
subtopic = "edge-compute"
levels = ["graduate", "mid"]
q = "A team proposes moving the whole API to edge functions to cut latency for a global audience. New information: every endpoint reads and writes the primary database, which lives in one region. More or less appropriate?"
a = "Less, -2, and it usually makes latency worse. Moving the compute to the user without moving the data means each request travels from the user to a nearby location, then across the world to the database and back, then back to the user, so a request that used to make one long trip now makes one long trip plus an extra hop, with the database round trips no shorter than before. Writes make it worse still, because they cannot be served from a copy. This is data gravity: edge compute pays when the data is at the edge too, or when the function needs no data at all. Keep the write path where the data is and move the cheap decisions outwards."

[[q]]
id = "cd-019"
qtype = "diagnostic"
subtopic = "invalidation"
levels = ["graduate", "mid"]
q = "A deploy ships new scripts and stylesheets. Most users see the new page correctly, a minority see a broken layout for hours, and a hard refresh fixes it for anyone who tries. The CDN was purged as part of the deploy. Most likely cause?"
a = "Those users are holding old copies in their own browsers, mixing an old stylesheet with new markup, and a purge does not reach a browser cache: it drops the object at the edge and nothing else. Anything already downloaded with a long lifetime stays until it expires or the user forces a reload, which is why the minority is exactly the set of people who visited recently. The fix is not a longer purge but a different naming scheme: put a content hash in the asset filename so a change produces a new URL, cache those for a year, and let the HTML that references them carry a short lifetime. Then there is nothing to invalidate, because the old and new files are different objects."

[[q]]
id = "cd-020"
qtype = "diagnostic"
subtopic = "origin-shield"
levels = ["graduate", "mid"]
q = "One popular object is purged. The origin immediately sees a burst of identical requests for it, far more than the object's own request rate would explain, and they arrive within a second or two of each other. Most likely cause?"
a = "Every populated edge location missed independently and went to the origin on its own, so the burst is roughly one request per location that had the object, all triggered by the same purge. The edges do not know about each other, and there is nothing between them and you to collapse the misses. That is what an origin shield is for: a designated mid-tier cache that all edges miss through, so the origin sees one request and the shield fans the answer back out. The same reasoning applies to a cold start after a deploy, and the general shape is request coalescing applied to a geography: each layer only passes on what it missed, so hit rates compound and the origin sees the true tail."

[[q]]
id = "cd-021"
qtype = "judgment"
subtopic = "origin-shield"
levels = ["graduate", "mid"]
q = "The origin is being scaled up so it can absorb the bursts that follow a purge. More or less appropriate as the response?"
a = "Less, around -1 to -2: it pays continuously for a peak that is an artefact of the topology rather than of demand. The bursts exist because every edge location misses independently, so their size is set by how many locations hold the object, not by how many users want it, and the origin is being sized for a number that grows as the CDN's footprint grows. A shield collapses those misses into one and costs a cache tier rather than a permanently larger origin. Scale the origin for the traffic it genuinely has to serve, and remove the artificial part with the shield, longer lifetimes on the objects that allow them, and content-addressed URLs that never need purging at all."

[[q]]
id = "cd-022"
qtype = "discrimination"
subtopic = "tls-latency"
levels = ["graduate", "mid"]
q = "Two users fetch the same uncacheable API response over a fresh HTTPS connection using TLS 1.3. One connects straight to the origin, 150 ms away. The other reaches an edge 20 ms away that holds a warm connection back to the same origin. If nothing is cached, where does the difference come from?"
a = "From the handshakes, which happen close by instead of far away. A new connection costs one round trip for TCP and one for TLS before any request goes out, then one more for the request itself: three round trips, so 450 ms direct. Terminating at the edge makes those setup round trips cost 20 ms each, and the request then travels the 150 ms to origin over a connection that is already established, for about 210 ms. The saving is not in the response, which still has to come from the origin: it is in never paying the distance for the setup. That is why a CDN helps an API with no cacheable content at all, and why the answer changes for an established connection where the setup has already been paid."
derivation = [
  "edge_rtt_ms = 20",
  "origin_rtt_ms = 150",
  "setup_round_trips = 2",
  "direct_ms = origin_rtt_ms * (setup_round_trips + 1)",
  "via_edge_ms = edge_rtt_ms * (setup_round_trips + 1) + origin_rtt_ms",
]
