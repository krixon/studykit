# Question bank: consistent-hashing
topic = "consistent-hashing"

[[q]]
id = "ch-001"
qtype = "recall"
subtopic = "definition"
levels = ["mid", "senior", "lead", "staff"]
q = "State the property consistent hashing guarantees, and what it fixes."
a = "Only about K/N keys move when a node joins or leaves, where K is the key count and N the node count. It fixes hash mod N, where changing N changes the divisor and remaps almost every key - going from 4 nodes to 5 remaps roughly 80 percent."

[[q]]
id = "ch-002"
qtype = "numeric"
subtopic = "definition"
levels = ["mid", "senior", "lead", "staff"]
q = "8 nodes, one is added. Roughly what fraction of keys move under consistent hashing, and under mod N?"
a = "Consistent hashing about 1/9, roughly 11 percent. Mod N about 8/9, roughly 89 percent. That difference is the whole reason the technique exists."

[[q]]
id = "ch-003"
qtype = "recall"
subtopic = "ring-mechanics"
levels = ["mid", "senior", "lead", "staff"]
q = "How is a key mapped to a node on the ring, and what is the lookup cost?"
a = "Hash the key onto the same circular space as the node positions and walk clockwise to the first node found. With node positions kept in a sorted array it is a binary search, O(log N), and the ring is small enough to hold in memory on every client."

[[q]]
id = "ch-004"
qtype = "recall"
subtopic = "ring-mechanics"
levels = ["senior", "lead", "staff"]
q = "A key hashes to a position on the ring and replication factor is 3, so three nodes must store a copy. Which three do you pick, and what is the trap?"
a = "Keep walking clockwise and take the next 3 DISTINCT physical nodes. The trap is skipping the distinctness check once virtual nodes exist - several consecutive positions can belong to the same machine, so all three replicas land on one box and the replication factor is a fiction."

[[q]]
id = "ch-005"
qtype = "recall"
subtopic = "virtual-nodes"
levels = ["mid", "senior", "lead", "staff"]
q = "Why does one ring position per node not work, and what do virtual nodes change?"
a = "Random placement of a handful of points divides the circle very unevenly, so some nodes own several times the arc of others and there is no way to fix it without moving nodes. Giving each node 100-200 positions cuts imbalance to low single-digit percent, roughly as 1 over the square root of V."

[[q]]
id = "ch-006"
qtype = "discrimination"
subtopic = "virtual-nodes"
levels = ["senior", "lead", "staff"]
q = "Virtual nodes are usually explained as improving balance. Name the two benefits that matter more in practice."
a = "Departure spreading - when a node dies its many small arcs each go to a different successor, so the load is absorbed by the whole cluster instead of dumped on one neighbour. And heterogeneous capacity - give a machine twice the hardware twice the virtual nodes and it takes twice the keys, with no other change."

[[q]]
id = "ch-007"
qtype = "judgment"
subtopic = "virtual-nodes"
levels = ["senior", "lead", "staff"]
q = "You are raising virtual nodes from 150 to 2000 per node to improve balance. New information - the cluster has 500 nodes and clients hold the ring in memory. More or less appropriate?"
a = "Less, -1. Balance improves as 1 over root V, so going from 150 to 2000 buys maybe a factor of 3.6 on an imbalance already in the low single digits. Meanwhile the ring goes from 75k to 1M entries in every client, and every membership change touches far more, smaller ranges. The returns have flattened well before this point."

[[q]]
id = "ch-008"
qtype = "recall"
subtopic = "rebalancing"
levels = ["senior", "lead", "staff"]
q = "What has to happen between a node joining the ring and it serving its new keys?"
a = "It claims arcs from several successors and streams those keys across. Until the transfer completes, reads for those keys must still be served by the old owner or sent to both, otherwise the new node answers misses for data that exists. Membership change and data movement are separate steps and must not be treated as atomic."

[[q]]
id = "ch-009"
qtype = "diagnostic"
subtopic = "rebalancing"
levels = ["senior", "lead", "staff"]
q = "After adding cache nodes, hit rate drops to near zero for several minutes and the database is overwhelmed, even though only a small fraction of keys should have moved. What went wrong?"
a = "Clients disagreed about ring membership. If some clients saw the new node and some did not, keys are looked up in two different places, so both miss. Gossip converges eventually and serves inconsistent views during the change. Either use a coordination service for a consistent view, or roll membership changes out with a warm-up where the new node is populated before it is authoritative."

[[q]]
id = "ch-010"
qtype = "discrimination"
subtopic = "alternatives"
levels = ["senior", "lead", "staff"]
q = "Rendezvous hashing versus a ring. What is the trade?"
a = "Rendezvous computes hash(key, node) for every node and takes the highest, giving the same minimal-disruption property with no ring to build, natural weighting, and code that is obviously correct. The cost is O(N) per lookup instead of O(log N), which is irrelevant for tens of nodes and disqualifying for thousands."

[[q]]
id = "ch-011"
qtype = "judgment"
subtopic = "alternatives"
levels = ["lead", "staff"]
q = "You are choosing jump consistent hash for its O(1) lookup and perfect balance. New information - nodes fail and are replaced by machines with different identifiers. More or less appropriate?"
a = "Much less, -2. Jump consistent hash only maps to buckets 0..N-1 and only supports adding or removing at the END of the range, so it cannot express removing an arbitrary node. It is right for a shard count you only ever grow, wrong for a membership set that churns."

[[q]]
id = "ch-012"
qtype = "recall"
subtopic = "alternatives"
levels = ["senior", "lead", "staff"]
q = "When are fixed logical shards with an explicit lookup table better than any hashing scheme?"
a = "When you need deliberate placement - isolating a large tenant, meeting residency rules, or draining one machine gracefully. The table is the source of truth rather than a function, so rebalancing is moving whole shards and you can see and choose exactly where anything lives. It costs a lookup and a component to keep available."

[[q]]
id = "ch-013"
qtype = "judgment"
subtopic = "hot-key"
levels = ["mid", "senior", "lead", "staff"]
q = "One key is taking 40 percent of your cache traffic. You are adding virtual nodes to spread it. More or less appropriate?"
a = "Not appropriate at all, -2. Consistent hashing balances keyspace, not traffic. A single key maps to exactly one node however the ring is arranged, and no number of virtual nodes changes that. Replicate the VALUE - suffixed copies read at random, or an in-process L1 on every client."

[[q]]
id = "ch-014"
qtype = "recall"
subtopic = "hot-key"
levels = ["senior", "lead", "staff"]
q = "What question separates the three imbalances a ring-based system can show?"
a = "Is the KEY hot, the RANGE hot, or the SLOT hot. A hot key is workload skew - replicate the value. A hot range is key-design skew - change the key. A hot slot is assignment skew - add virtual nodes. Only the last is a hashing problem."

[[q]]
id = "ch-015"
qtype = "judgment"
subtopic = "virtual-nodes"
levels = ["mid", "senior"]
q = "A ring places one point per node, and the team is content because the hash function is uniform. New information: the cluster has a handful of nodes rather than hundreds. Does one point per node remain acceptable?"
a = "No, -2. Uniformity of the hash is not the issue; variance is. A few random points divide a circle badly, so some nodes own several times the arc of others, and the load imbalance follows the arc. With hundreds of points the variance averages out, which is exactly why virtual nodes exist: give each physical node many positions and its share converges on its intended fraction. It also lets you weight a bigger machine by giving it more points, and it makes a departing node's keys spread over many successors rather than landing entirely on one."

[[q]]
id = "ch-016"
qtype = "recall"
subtopic = "alternatives"
levels = ["mid", "senior"]
q = "Name a placement scheme with the same minimal-movement property as a ring but no ring to maintain, and say where it stops being suitable."
a = "Rendezvous hashing, also called highest random weight. For a key, compute a hash of the key combined with each node's identifier and take the node with the highest value. Adding or removing a node only changes the winner for keys where it was the winner or would have become one, which is the same minimal-disruption property, and weighting a node is a matter of scaling its score. There is no ring, no virtual nodes and no structure to keep in sync, so it is trivially correct and easy to reason about. It stops being suitable on size: every lookup evaluates a hash per node, so tens of nodes is fine and thousands is not, where a ring's binary search still is."

[[q]]
id = "ch-017"
qtype = "discrimination"
subtopic = "alternatives"
levels = ["mid", "senior"]
q = "Two ways to decide which node owns a key. One computes it from the key. The other looks it up in a table of fixed logical shards that someone maintains. What changes operationally?"
a = "Who decides, and whether you can override it. With a computed owner, placement is uniform, needs no storage and cannot be argued with: if one shard becomes a problem, the only levers are the hash and the node count. With an explicit table, placement is deliberate: you can move one hot shard to its own machine, drain a rack before maintenance, keep a large tenant apart from the rest, and see at a glance where anything lives. The costs are that the table is state which has to be distributed, versioned and agreed, and that someone must own rebalancing rather than getting it for free. Pre-splitting into far more shards than nodes is what makes it work, because then rebalancing is moving whole shards rather than splitting them."

[[q]]
id = "ch-018"
qtype = "recall"
subtopic = "hot-key"
levels = ["mid", "senior"]
q = "Consistent hashing balances what, exactly? Name the thing it does not balance and what to do about that."
a = "It balances the keyspace: each node ends up owning a roughly equal share of the ring, and with virtual nodes that share is even to within a few per cent. What it does not balance is traffic. A single key that takes a large share of reads maps to one position and therefore one node, whatever the ring looks like, and adding nodes or virtual nodes divides the space more finely without touching that. The remedies live at another layer: replicate the value under several suffixed keys read at random, or keep an in-process copy on each client so the hot key never crosses the network. Keep the three imbalances apart, because only the last is a placement problem: a hot key, a hot range, and a node that owns too much of the ring."

[[q]]
id = "ch-019"
qtype = "recall"
subtopic = "rebalancing"
levels = ["mid", "senior"]
q = "A node in the ring crashes without warning. What happens to the keys it owned, and what decides whether they are simply gone?"
a = "Its successor becomes the owner of those arcs immediately, because ownership is defined by position rather than by a handover, and clients that refresh their view of the membership start routing there. Whether the data is still there depends entirely on the replication factor: with copies on the next distinct nodes clockwise, the successor already holds one and serves from it; with a replication factor of one, the keys existed only on the dead node and are gone. For a cache that is a cold range and a burst of origin load. For a store it is data loss. The other consequence to plan for is that the successor now carries its own share plus the departed node's, unless virtual nodes were used, in which case the arcs spread across many successors instead of landing on one neighbour."

[[q]]
id = "ch-020"
qtype = "judgment"
subtopic = "rebalancing"
levels = ["mid", "senior"]
q = "A node is being removed from the cluster by terminating the instance and letting the ring heal by itself, since the mechanism handles departures anyway. More or less appropriate?"
a = "Less, around -1 to -2, and how much depends on the replication factor. The mechanism does handle a crash, which is why it looks like nothing is being given up, but a planned departure can hand its keys over first, and a crash cannot. Without the handoff the successors take ownership of ranges they must now serve from a replica, or cannot serve at all if there is only one copy, and every miss in those ranges goes to the origin at once. Treat the crash path as the thing that saves you from an accident, not as the deployment procedure: drain, stream the ranges to their new owners, confirm they are serving, then terminate. The same argument applies to a rolling restart, where doing this to every node in turn is a self-inflicted cache flush."

[[q]]
id = "ch-021"
qtype = "judgment"
subtopic = "ring-mechanics"
levels = ["mid", "senior"]
q = "Each client holds its own copy of the ring, updated by gossip, so a client with a stale view occasionally routes a key to the node that no longer owns it. The proposal is to route through a coordinator that always has the current membership. More or less appropriate?"
a = "Around -1: it removes a real inconsistency by adding a hop and a dependency to every request, and the inconsistency is usually the cheaper problem. A stale ring view is bounded in time and in blast radius: it costs a miss, a misroute or a read of a slightly stale replica during a membership change, and it heals on its own. A coordinator on the request path is a new failure domain, an extra network round trip on every lookup, and a capacity ceiling. The middle option is what most systems do: keep the client-side ring for routing, and take a consistent view of membership from a coordination service that is consulted on change rather than per request, so the agreement cost is paid when nodes join and leave."
