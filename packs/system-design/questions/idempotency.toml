# Question bank: idempotency
topic = "idempotency"

[[q]]
id = "id-001"
qtype = "recall"
subtopic = "keys"
levels = ["mid", "senior", "lead", "staff"]
q = "Why must an idempotency key be generated by the client rather than the server?"
a = "Because the failure case is the client not receiving a response. A server-generated id never reached the client, so on retry the client has nothing to send that identifies the earlier attempt. The key must exist before the first attempt and be reused on every retry of that intent."

[[q]]
id = "id-002"
qtype = "recall"
subtopic = "keys"
levels = ["senior", "lead", "staff"]
q = "Why must the idempotency key and the side effect be written in one transaction?"
a = "Two separate writes leave a window where the side effect committed and the key did not, so a retry arriving in that window reprocesses and double-applies. Committing them together is what makes the whole operation atomic with respect to retries."

[[q]]
id = "id-003"
qtype = "judgment"
subtopic = "keys"
levels = ["senior", "lead", "staff"]
q = "Your idempotency store records only that a key was seen, not the response. More or less appropriate?"
a = "Less, -2. A retry then gets an acknowledgement with no payload, so the client never learns the created resource's id and cannot proceed. Store the full response and status against the key, so a retry returns exactly what the first attempt would have."

[[q]]
id = "id-004"
qtype = "recall"
subtopic = "keys"
levels = ["senior", "lead", "staff"]
q = "Why bind the idempotency key to a hash of the request body?"
a = "So the same key with a different payload is caught as a client bug rather than silently replaying the wrong result. Without the binding, a client that reuses a key by accident gets back the previous operation's response and believes its new request succeeded."

[[q]]
id = "id-005"
qtype = "recall"
subtopic = "retries"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "Which status codes are worth retrying, and which are never?"
a = "Retry timeouts, connection resets, 429 and 503 - conditions that may pass. Never retry 400, 401, 403 or 422, which will fail identically however many times you try. Retrying a deterministic failure is pure load with no chance of success."

[[q]]
id = "id-006"
qtype = "recall"
subtopic = "retries"
levels = ["mid", "senior", "lead", "staff"]
q = "Write down full-jitter backoff and say what the jitter is for."
a = "sleep = random(0, base * 2^attempt). The jitter is what disperses the herd - without it, every client that failed at the same moment returns at the same moment, so the recovering service is knocked over by the retry wave it caused."

[[q]]
id = "id-007"
qtype = "numeric"
subtopic = "retries"
levels = ["mid", "senior", "lead", "staff"]
q = "Client SDK retries 3 times, the gateway retries 3 times, the service retries 3 times downstream. Worst case, how many requests reach the bottom for one logical call?"
a = "27. The multiplication is why retrying at more than one layer is dangerous - a small fault becomes a 27x load spike on the component least able to take it. Retry at exactly one layer, ideally closest to the caller where the deadline is known."

[[q]]
id = "id-008"
qtype = "discrimination"
subtopic = "retries"
levels = ["senior", "lead", "staff"]
q = "Retries and circuit breakers. What does each handle, and what happens if you use the wrong one?"
a = "Retries handle TRANSIENT faults - the next attempt may well succeed. Circuit breakers handle SUSTAINED ones - stop sending, probe occasionally, resume. Using retries for a sustained failure amplifies the outage; using a breaker for a transient blip fails requests that would have succeeded on the second try."

[[q]]
id = "id-009"
qtype = "recall"
subtopic = "retries"
levels = ["senior", "lead", "staff"]
q = "What is a retry budget and what does it protect against?"
a = "A cap on retries as a fraction of total requests, say 10 percent. It protects against the correlated case - when a large share of requests start failing, per-request retry policies collectively triple the load. A budget makes retry volume bounded regardless of failure rate."

[[q]]
id = "id-010"
qtype = "recall"
subtopic = "exactly-once"
levels = ["senior", "lead", "staff"]
q = "Name the only two routes to exactly-once processing."
a = "An idempotent consumer - at-least-once delivery plus deduplication or a naturally idempotent operation. Or transactional coupling - commit the side effect and the consumption marker atomically, which only works when both live somewhere that can commit them together. Any exactly-once claim is one of these two, and the question is where its boundary sits."

[[q]]
id = "id-011"
qtype = "numeric"
subtopic = "dedup-windows"
levels = ["senior", "lead", "staff"]
q = "How long should a dedup window be, and what sets the floor?"
a = "Longer than the maximum realistic retry horizon - client backoff, queue redelivery, consumer restart, and an operator manually replaying a dead letter queue days later. 24 hours is a common floor; long-tail manual replay argues for more. The window is a correctness boundary, not a cleanup detail."

[[q]]
id = "id-012"
qtype = "judgment"
subtopic = "dedup-windows"
levels = ["senior", "lead", "staff"]
q = "You are using a bloom filter for deduplication to keep memory constant. More or less appropriate?"
a = "Usually much less, -2. A bloom filter's false positive means you classify a NEW message as a duplicate and drop it, which is silent data loss. False negatives are the safe direction and bloom filters give you the unsafe one. Use a unique constraint or a keyed store with TTL; reach for a probabilistic filter only where dropping a legitimate item is genuinely acceptable."

[[q]]
id = "id-013"
qtype = "recall"
subtopic = "dedup-windows"
levels = ["senior", "lead", "staff"]
q = "Why is a database unique constraint often the best dedup mechanism?"
a = "Because the constraint violation IS the deduplication - you attempt the insert and catch the conflict, rather than checking first and racing between the check and the write. It is exact, durable with the data, and needs no extra store to keep consistent."

[[q]]
id = "id-014"
qtype = "recall"
subtopic = "side-effects"
levels = ["mid", "senior", "lead", "staff"]
q = "Why is an increment the classic idempotency trap, and what replaces it?"
a = "Because balance = balance + 10 applied twice is simply wrong, and nothing about the second call looks different from the first. Replace it with a conditional write on a version, or record the EVENT with its idempotency key and derive the balance from the event set, which is naturally idempotent."

[[q]]
id = "id-015"
qtype = "diagnostic"
subtopic = "side-effects"
levels = ["senior", "lead", "staff"]
q = "A customer receives the same confirmation email twice, minutes apart. The order was created once. Where do you look?"
a = "At the boundary between sending and recording that you sent. If the process dies after the provider accepted the email but before you persisted that fact, a retry re-sends. Fix with a provider-side idempotency key where supported, or write the intent durably before sending and mark it complete after, accepting that the ambiguous window shrinks rather than vanishes."

[[q]]
id = "id-016"
qtype = "discrimination"
subtopic = "side-effects"
levels = ["lead", "staff"]
q = "Deduplication and ordering. Why is one not a substitute for the other?"
a = "Deduplication stops the same update applying twice. It does nothing about a stale update applying AFTER a fresh one, which reordering produces and which corrupts state just as thoroughly. Guard with a version or timestamp on the write so an older update is rejected, not merely not-duplicated."

[[q]]
id = "id-017"
qtype = "judgment"
subtopic = "keys"
levels = ["mid", "senior"]
q = "An endpoint deduplicates retries by storing the id it generates for each created resource and refusing to create a second one for the same caller within a short window. New information: the failure being defended against is a connection that drops before the client receives any response. Does this scheme work?"
a = "No, -2, and it fails at exactly the moment it is needed. A server-generated id cannot deduplicate the case where the client never received the response, because the client has nothing to send back on the retry - it is indistinguishable from a fresh request. The key has to be generated by the client before the first attempt and reused on every retry of that intent, so the server can recognise the second arrival. It also has to store the original response rather than a done marker, since the retry needs the created resource's id, and it has to be written in the same transaction as the side effect or a crash between the two leaves them disagreeing."

[[q]]
id = "id-018"
qtype = "discrimination"
subtopic = "dedup-windows"
levels = ["mid", "senior"]
q = "Three places to keep the record of what has already been processed: a table with a unique constraint, an in-memory store with an expiry, and a bloom filter. What does each get right and wrong?"
a = "The table is exact and durable, survives a failover, and the constraint violation is itself the deduplication, so the simplest correct implementation is to attempt the write and catch the conflict. It costs a write on every message. The in-memory store with an expiry is fast and cheap and loses the set on a failover unless it is persisted, which turns a duplicate-free guarantee into a best-effort one at exactly the moment things are going wrong. The bloom filter has constant memory and the wrong error direction: a false positive says seen when the message is new, so it drops legitimate work silently, which is rarely acceptable. Choose by what the failure costs: exact and durable where a duplicate is money."

[[q]]
id = "id-019"
qtype = "judgment"
subtopic = "dedup-windows"
levels = ["mid", "senior"]
q = "The deduplication window is set to an hour to keep the table small. New information: failed messages land in a dead letter queue that an operator replays by hand, sometimes days later. More or less appropriate?"
a = "Less, -2. Expiry is a correctness boundary rather than a housekeeping detail: a message that arrives after its key has expired is processed as new, so the replay path is a duplicate generator by construction, and the duplicates arrive days after anyone is watching for them. The window has to exceed the longest realistic redelivery horizon, which is not the client's backoff but the slowest path in the system, and a manual replay makes that days. Either size the window for that, which is usually cheap because the rows are small and can be trimmed by date, or make the replay path carry the original key and check against a durable store that never expires the keys of messages with side effects."

[[q]]
id = "id-020"
qtype = "judgment"
subtopic = "exactly-once"
levels = ["mid", "senior", "lead", "staff"]
q = "A broker's documentation advertises exactly-once. The team plans to rely on it and skip deduplication in the consumer. More or less appropriate?"
a = "Less, -2 until two questions are answered, because the phrase names a property no delivery mechanism can have over an unreliable network: a sender cannot distinguish a lost message from a lost acknowledgement, so it either resends or risks loss. What a broker can offer is exactly-once processing by one of two routes, and the questions are which one this is and where its boundary sits. If it is transactional coupling of the side effect and the consumption marker, it holds only while both live inside the system that can commit them together, which stops the moment your consumer writes to an external database. If it is an idempotent consumer, the deduplication is the thing you were about to skip. Assume at-least-once and make the consumer idempotent."

[[q]]
id = "id-021"
qtype = "diagnostic"
subtopic = "exactly-once"
levels = ["mid", "senior"]
q = "A consumer acknowledges each message as soon as it receives it and then does the work, which the team adopted to stop duplicates after a redelivery storm. After a worker crash, a handful of records are missing and nothing was retried. Most likely cause?"
a = "Acknowledging before processing converts the delivery guarantee from at-least-once to at-most-once: once the marker is committed the broker considers the message done, so anything in flight when the worker died is gone with no trace and no redelivery. The duplicates the team was avoiding were the visible cost of the safe option, and this is the invisible cost of the other one, which is worse because nothing reports it. Acknowledge after the work is complete, accept that a crash between the work and the acknowledgement produces a duplicate, and make the consumer idempotent so the duplicate is harmless. If the duplicates were coming faster than the work, the real problem was the acknowledgement deadline, not the ordering of the two steps."

[[q]]
id = "id-022"
qtype = "judgment"
subtopic = "side-effects"
levels = ["mid", "senior"]
q = "A handler sends a confirmation email and then records that it sent one. The team knows a crash in between produces a duplicate email and has decided to accept it. More or less defensible?"
a = "Defensible, around 0, provided it was a decision and the alternatives were priced. The window is real and cannot be closed by reordering: recording first means a crash produces an email nobody receives, which for a confirmation is worse than two. Nothing local removes the uncertainty, because the send is an external effect you cannot roll back or query reliably. What raises the answer is what you do around it: check the dedup record before calling, so the ordinary retry path sends nothing extra; pass a provider-side idempotency key where the provider offers one, which moves the duplicate suppression to the only place that can be sure; and keep the window as small as possible. What makes it indefensible is the same reasoning applied to a charge rather than an email."
