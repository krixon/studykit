# Question bank: load-balancing
topic = "load-balancing"

[[q]]
id = "lb-001"
qtype = "recall"
subtopic = "l4-l7"
levels = ["graduate", "mid"]
q = "What can a layer 7 load balancer route on that a layer 4 one cannot?"
a = "Anything in the HTTP request - path, headers, cookies, method. Layer 4 only sees the IP and port, so it can balance connections but cannot make a decision based on what is being asked for."

[[q]]
id = "lb-002"
qtype = "discrimination"
subtopic = "l4-l7"
levels = ["mid", "senior", "lead", "staff"]
q = "L4 and L7 balancing. What does each balance, and where does the difference actually bite?"
a = "L4 balances CONNECTIONS, L7 balances REQUESTS. It bites with HTTP/2 or gRPC, where many requests are multiplexed over one long-lived connection - an L4 balancer pins them all to one backend and the pool goes lopsided. That is the case where L7 or client-side balancing stops being optional."

[[q]]
id = "lb-003"
qtype = "judgment"
subtopic = "l4-l7"
levels = ["senior", "lead", "staff"]
q = "You are putting an L4 balancer in front of a gRPC service. New information - clients hold connections open for hours and each sends thousands of requests. More or less appropriate?"
a = "Much less, -2. L4 assigns a backend per connection, so hours-long connections pin load and the distribution never corrects. Use L7 balancing, client-side balancing with a service mesh, or force redistribution with a maximum connection age."

[[q]]
id = "lb-004"
qtype = "recall"
subtopic = "algorithms"
levels = ["graduate", "mid", "senior", "lead", "staff"]
q = "When is round robin the wrong algorithm?"
a = "When requests cost very different amounts, or backends have different capacity. Round robin assumes uniformity in both; without it, some backends saturate while others idle. Least-connections or a latency-aware algorithm adapts without you having to measure the cost."

[[q]]
id = "lb-005"
qtype = "recall"
subtopic = "algorithms"
levels = ["senior", "lead", "staff"]
q = "What is power-of-two-choices and why is it used instead of least-connections?"
a = "Pick two backends at random and send to the less loaded of the two. It gets almost all the benefit of global least-connections without needing global state, which is what makes it the standard choice for client-side balancing where no component sees the whole fleet."

[[q]]
id = "lb-006"
qtype = "judgment"
subtopic = "algorithms"
levels = ["senior", "lead", "staff"]
q = "You are choosing least-response-time balancing. New information - one backend has a corrupt config and returns 500 in 2ms. More or less appropriate?"
a = "Much less, -2. Fast failure looks like low latency, so the algorithm routes MORE traffic to the broken backend - a black hole. Balance on success rate as well as latency, and make health checks assert correctness rather than speed."

[[q]]
id = "lb-007"
qtype = "discrimination"
subtopic = "health-checks"
levels = ["mid", "senior", "lead", "staff"]
q = "Shallow versus deep health checks. What does each miss, and what is the danger of the deep one?"
a = "A shallow check confirms the process is listening, so it stays green while every dependency is down. A deep check confirms real dependencies, so it catches that - and because the dependency is shared, it can mark the ENTIRE fleet unhealthy at once, which is worse than the original fault. The mitigation is a panic threshold: below some fraction healthy, ignore health and spread traffic across everything."

[[q]]
id = "lb-008"
qtype = "numeric"
subtopic = "health-checks"
levels = ["mid", "senior", "lead", "staff"]
q = "Health checks every 5 seconds with a threshold of 3 consecutive failures. How long is a dead backend still taking traffic?"
a = "Up to about 15 seconds, plus the check timeout on the failing probes. That is your real detection budget, and it is why passive signals from live traffic matter as well as active probes."

[[q]]
id = "lb-009"
qtype = "judgment"
subtopic = "health-checks"
levels = ["lead", "staff"]
q = "You are making the health check assert that the backend can reach its database. New information - all backends share one database. More or less appropriate?"
a = "Less, -1 to -2 without a panic threshold. When the database blips, every backend fails its check simultaneously and the balancer removes the entire fleet, turning a degraded service into a total outage. Either keep the check shallow and detect the database fault separately, or configure the balancer to ignore health below a healthy-fraction threshold."

[[q]]
id = "lb-010"
qtype = "discrimination"
subtopic = "topology"
levels = ["senior", "lead", "staff"]
q = "DNS-based and anycast-based traffic steering. What separates them on failover?"
a = "DNS failover is bounded below by the TTL plus resolvers that ignore it, so assume minutes of traffic to a dead site. Anycast reroutes at BGP speed, seconds, because the same IP is announced from many places. The cost of anycast is that you do not choose which site a client lands on and a route change can break long-lived connections."

[[q]]
id = "lb-011"
qtype = "recall"
subtopic = "topology"
levels = ["mid", "senior", "lead", "staff"]
q = "What does a client-side balancer or mesh sidecar buy over a central proxy tier?"
a = "It removes a network hop, balances per request over multiplexed connections rather than per connection, and lets the balancing logic ship with the client. The cost is that policy now lives in every client and updating it is a fleet-wide rollout."

[[q]]
id = "lb-012"
qtype = "diagnostic"
subtopic = "failure-modes"
levels = ["senior", "lead", "staff"]
q = "A backend has a brief 30-second wobble. Load then stays at 4x normal for ten minutes and the service never recovers on its own. What happened?"
a = "A retry storm. Clients retried the failures, and with retries at more than one layer the multiplication is large - three layers retrying three times is 27 attempts. The extra load keeps the service failing, which generates more retries. Fix with retry budgets capping retries as a fraction of traffic, full jitter, and retrying at exactly one layer."

[[q]]
id = "lb-013"
qtype = "recall"
subtopic = "failure-modes"
levels = ["mid", "senior", "lead", "staff"]
q = "Why does a failover cause a second outage, and what prevents it?"
a = "Every client reconnects to the survivors at the same instant, so the surviving capacity takes a synchronised spike on top of the traffic it just inherited. Jittered exponential backoff on reconnect, plus an accept-rate cap on the server, spreads the herd."

[[q]]
id = "lb-014"
qtype = "judgment"
subtopic = "failure-modes"
levels = ["lead", "staff"]
q = "You are adding retries at the gateway to improve reliability. New information - the client SDK already retries three times, and the service calls a downstream that also retries. More or less appropriate?"
a = "Much less, -2. Three layers at three attempts each is up to 27 requests for one logical call, and the amplification peaks exactly when the system is least able to take it. Retry at one layer, ideally closest to the caller where the deadline is known, and give the others a budget of zero."

[[q]]
id = "lb-015"
qtype = "discrimination"
subtopic = "algorithms"
levels = ["graduate", "mid"]
q = "Two distribution strategies over an identical pool. One sends the same number of requests to each backend; the other sends to whichever backend is currently handling the fewest. When do these behave identically, and what makes the second win?"
a = "They behave the same when every request costs about the same, because then request count and load are the same measurement. The second wins when request cost is uneven: a backend that picked up three slow requests stops receiving work without anyone having to measure or predict cost, because in-flight count is a live proxy for how busy it is. Round robin keeps feeding it, so tail latency comes from a queue behind one host while others idle."

[[q]]
id = "lb-016"
qtype = "discrimination"
subtopic = "health-checks"
levels = ["graduate", "mid"]
q = "Two ways of learning that a backend is broken. One notices before any user is affected and costs a request per backend per interval; the other costs nothing and only tells you after users have hit the fault. What are they, and why would you run both?"
a = "Active probing on an interval, and passive inference from real traffic such as error rates and timeouts. Active buys early detection and pays a constant traffic cost. Passive is free and reactive by construction: it needs real failures to see anything. Both, because they catch different things - a probe can pass while the code path users actually take is broken, and passive signals catch exactly that, whereas passive alone means every fault is discovered by a customer."

[[q]]
id = "lb-017"
qtype = "judgment"
subtopic = "topology"
levels = ["graduate", "mid"]
q = "A service is spread across two sites, with visitors sent to one or the other by DNS. The team's plan for a site outage is to update DNS to point at the survivor. New information: the record's TTL is respected by some resolvers and ignored by others, which cache for longer. Does DNS remain an adequate failover mechanism?"
a = "No, -2 as a failover mechanism, while remaining fine as a spreading mechanism. Changing a record only affects resolvers that come back to ask, so recovery time is set by the longest cache anyone keeps, not by your TTL, and you cannot control that. Meanwhile a share of traffic keeps arriving at a dead site. DNS gets you cheap global spread; failover in seconds needs something that does not depend on clients re-resolving, such as anycast, a health-checked global balancer, or shifting the address itself."

[[q]]
id = "lb-018"
qtype = "diagnostic"
subtopic = "failure-modes"
levels = ["graduate", "mid"]
q = "One backend was restarted for maintenance and never came back up. Traffic to the pool is still being distributed evenly across every member including that one, and roughly a third of requests fail immediately. Most likely cause?"
a = "Health checking is absent or not wired into the routing decision. Spreading load and avoiding dead hosts are two different jobs, and a pool configured only for the first will happily send its share to a host that is not listening. The immediate failure rather than a timeout points at connection refused, which is what a stopped process gives you. Check that a health check exists, that its failure threshold is low enough to act, and that the balancer is actually removing members on it rather than only reporting them."

[[q]]
id = "lb-019"
qtype = "judgment"
subtopic = "failure-modes"
levels = ["graduate", "mid"]
q = "During an incident a share of requests fail, and the proposal is to raise the gateway's retry count from two attempts to three. New information: the client SDK already retries three times on its own. More or less appropriate?"
a = "Less, -2, and the existing arrangement is already the problem. Retries at two layers multiply rather than add: three client attempts each producing two gateway attempts is 6x the original load, all of it arriving while the service is least able to take it, and raising the gateway to three makes it 9x. That is the shape of a retry storm, and it is why an incident that would have cleared keeps the service saturated. Retry at one layer only, ideally the one closest to the failure and best able to judge it; bound the total as a fraction of traffic rather than per request; add jitter so the attempts do not arrive together; and do not retry anything that is not idempotent."
derivation = [
  "client_attempts = 3",
  "gateway_attempts = 2",
  "current_multiple = client_attempts * gateway_attempts",
  "proposed_multiple = client_attempts * 3",
]

[[q]]
id = "lb-020"
qtype = "judgment"
subtopic = "health-checks"
levels = ["graduate", "mid"]
q = "Dead backends are taking traffic for too long, so the proposal is to check every second and remove a backend after a single failed probe. More or less appropriate?"
a = "Around -1: the direction is right and this version buys detection speed with stability. One missed probe is an ordinary event - a garbage collection pause, a dropped packet, a moment of scheduling - so a threshold of one converts noise into an eviction, and a fleet under load can then shed healthy backends exactly when it needs them, which shrinks the pool and produces more missed probes. Shorten the interval by all means, and keep a threshold of two or three consecutive failures so the detection budget is a few seconds rather than tens of seconds. Two more things go with it: a probe cheap enough to run every second on every backend, and a floor below which the balancer ignores health entirely and spreads traffic across everything, since a degraded backend beats an empty pool."

[[q]]
id = "lb-021"
qtype = "diagnostic"
subtopic = "l4-l7"
levels = ["graduate", "mid"]
q = "After a service moves from HTTP/1.1 to gRPC, one backend in a pool of six sits at twice the CPU of the others. The imbalance persists for hours and never corrects itself. The balancer is configured to spread work evenly. Most likely cause?"
a = "The balancer is spreading connections, not requests, and the clients now hold one long-lived connection each and multiplex every request over it. So a client that lands on that backend keeps sending it work for as long as the connection lives, and an even spread of connections is an arbitrary spread of load. It never corrects because nothing re-decides: the assignment was made once, at connect time. Three ways out, usually combined: balance at layer 7 so each request is routed independently, move the balancing into the client or a sidecar which sees the requests, and set a maximum connection age so assignments are periodically reshuffled even when nothing fails."

[[q]]
id = "lb-022"
qtype = "recall"
subtopic = "topology"
levels = ["graduate", "mid"]
q = "Trace the layers a request passes through from a user on the internet to one instance of a service inside a datacentre, and say what each layer is deciding."
a = "An anycast address takes the user to a nearby site, decided by internet routing rather than by you. A layer 4 balancer at that site spreads connections across a proxy tier at close to hardware speed, deciding nothing about the request itself. A layer 7 proxy terminates TLS and routes on the path, header or cookie, which is where canaries, per-tenant rules and request-level retries live. Inside the datacentre a client-side balancer or mesh sidecar picks the instance per request, with no extra network hop. Each layer answers a different question, which is why real systems stack them, and each is also a failure domain that needs its own redundancy and its own headroom for the case where a peer fails."
